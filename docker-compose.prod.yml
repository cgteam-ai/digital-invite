# Production stack — four containers, one private network.
#
#   caddy  →  the ONLY container with published ports. Terminates TLS.
#   web    →  nginx: static site + /api proxy + URL rewrites
#   api    →  ASP.NET Core
#   db     →  PostgreSQL, on the server's disk
#
# Deliberately a standalone file rather than an override of docker-compose.yml: on a server
# you want one file that says exactly what runs, with no mental merge step.
#
# The api and web services declare BOTH "image" and "build". That is what lets one file serve
# two very different machines:
#
#   On the server   docker compose -f docker-compose.prod.yml pull && up -d
#                   → downloads pre-built images from GHCR. Never compiles, so the server
#                     needs no .NET SDK, no 2 GB of build RAM and no 3.5 GB of build cache.
#                     This is what makes a small, cheap instance sufficient.
#
#   Anywhere        docker compose -f docker-compose.prod.yml up --build -d
#                   → builds locally instead. Used for the local rehearsal, and as the
#                     fallback if the registry is ever unavailable.
#
# Full walkthrough: backend/docs/DEPLOY.md

name: invitation-platform-prod

# Docker's default json-file logging never rotates. On a 25 GB disk an unnoticed error loop
# fills the volume and takes the whole server down — the most common way a small box dies.
# 10 MB × 3 files caps each container at 30 MB.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── TLS edge ───────────────────────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: invitation-prod-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"        # HTTP/3
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env (":80" until a domain is pointed)}
      # Hostname of the beta site, served by this same Caddy because only one process can hold
      # ports 80/443. Left at a .localhost default when no beta exists: Caddy still parses the
      # block, nothing on the internet resolves there, and no public certificate is requested.
      BETA_SITE_ADDRESS: ${BETA_SITE_ADDRESS:-beta.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and account keys. Losing this volume means re-issuing certificates,
      # and Let's Encrypt rate-limits that — so never "docker compose down -v" in production.
      - caddy_data:/data
      - caddy_config:/config
    # Caddy sits on BOTH networks: the private prod one, to reach the prod web container, and
    # the shared edge, to reach the beta web container. Only the two web containers are on the
    # edge — prod's api and db are not, so a beta build running unreviewed code cannot open a
    # connection to the production database.
    networks:
      - default
      - edge
    depends_on:
      - web
    mem_limit: 96m
    logging: *logging
    restart: unless-stopped

  # ── Static site + routing ──────────────────────────────────────────────────
  web:
    image: ${WEB_IMAGE:-invitation-platform/web:local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: invitation-prod-web
    # "expose", not "ports": reachable by caddy on the internal network, never from outside.
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    # nginx serving static files needs almost nothing; measured at 14 MB.
    mem_limit: 64m
    logging: *logging
    restart: unless-stopped

  # ── Backend ────────────────────────────────────────────────────────────────
  api:
    image: ${API_IMAGE:-invitation-platform/api:local}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: invitation-prod-api
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      Storage__BasePath: /app/media_storage
      Jwt__Issuer: InvitationPlatform
      Jwt__Audience: InvitationPlatform
      Jwt__ExpiryMinutes: "60"
      Media__MaxImageBytes: "8388608"
      Media__MaxVideoBytes: "15728640"
      Media__MaxAudioBytes: "10485760"
      Media__MaxImageDimension: "2000"
      Media__WebpQuality: "80"
      # Quieter than local: Warning-level default keeps the journal small on a small disk.
      Logging__LogLevel__Default: Warning
      Logging__LogLevel__Microsoft.AspNetCore: Warning
      Logging__LogLevel__InvitationPlatform: Information
    expose:
      - "8080"
    volumes:
      # User uploads. This is the volume that must never be lost — back it up.
      - api_media:/app/media_storage
    depends_on:
      db:
        condition: service_healthy
    # Measured at 90 MB idle. .NET reads the cgroup limit and sizes its heap to fit, so this
    # is a hint to the runtime as much as a ceiling.
    mem_limit: 640m
    logging: *logging
    restart: unless-stopped

  # ── Database ───────────────────────────────────────────────────────────────
  db:
    image: postgres:18-alpine
    container_name: invitation-prod-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-invitationplatform}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # /var/lib/postgresql, NOT /var/lib/postgresql/data — postgres:18+ moved the data
      # directory into a version subdirectory. The old path leaves the volume unused and the
      # container restart-loops. This is also the layout pg_upgrade expects.
      - db_data:/var/lib/postgresql
    # No "ports": the database listens only on the private compose network, so there is no
    # port on the server for anyone to reach. To run queries, SSH in and use the psql that
    # ships inside this container — no port and no client install needed:
    #
    #   docker compose -f docker-compose.prod.yml exec db psql -U <user> -d <db>
    #
    # To drive it with pgAdmin from your PC instead, uncomment the binding below and tunnel:
    #
    #   ports:
    #     - "127.0.0.1:5432:5432"
    #
    #   ssh -L 5432:localhost:5432 user@server      # then connect pgAdmin to localhost:5432
    #
    # The "127.0.0.1:" prefix is what makes that safe — it binds to the server's loopback
    # only, so the port is reachable through an SSH session and from nowhere else. Writing
    # it as a bare "5432:5432" would publish the database to the entire internet.
    # An SSH tunnel alone is NOT enough while this stays commented out: the tunnel forwards
    # to the server's localhost, where nothing is listening until the port is bound.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 384m
    logging: *logging
    restart: unless-stopped

volumes:
  api_media:
  db_data:
  caddy_data:
  caddy_config:

networks:
  # Created once on the server, outside either stack, so prod and beta can be brought up and
  # torn down independently without one deleting the other's network:
  #
  #   docker network create invitation-edge
  #
  # Declared external on purpose — compose must never create or remove it.
  edge:
    name: invitation-edge
    external: true
