<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#efe6ff">
<title>Birthday Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Syne: an art-school geometric display face. Instrument Serif: a slim italic for the elegant
     accents. DM Sans: calm, very readable body text. -->
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="../../../shared/config.js"></script>
<style>
  /*
   * LILAC GLOW — a birthday for a teenage girl or young woman: modern, soft and a little iridescent.
   * A slowly drifting lilac-peach glow behind frosted-glass panels, an iridescent name, sparkles,
   * a swipeable carousel for the plan and a glassy guest-list card. Grown-up, not childish.
   */
  :root {
    --ink:    #2a1f3d;
    --plum:   #5b3f8c;
    --soft:   rgba(42,31,61,.66);
    --lilac:  #c9b8ff;
    --pink:   #ff9ec7;
    --peach:  #ffc6a5;
    --cream:  #fff8f4;
    --glass:  rgba(255,255,255,.46);
    --glass-2: rgba(255,255,255,.7);
    --edge:   rgba(255,255,255,.75);
    --shine:  linear-gradient(100deg, #7b5cff 0%, #ff6fae 35%, #ffa277 60%, #9b7bff 85%, #7b5cff 100%);
    --display: 'Syne', 'Avenir Next', system-ui, sans-serif;
    --serif: 'Instrument Serif', 'Didot', Georgia, serif;
    --body: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --pad: clamp(18px, 5.5vw, 44px);
    --r: 28px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { max-width: 100%; overflow-x: hidden; }
  @supports (overflow: clip) { html, body { overflow-x: clip; } }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body { background: #f3ecff; color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55; -webkit-tap-highlight-color: transparent; }
  img, video, svg { display: block; max-width: 100%; }
  a { color: inherit; }
  button, input, select, textarea { font: inherit; color: inherit; }

  /* ── THE GLOW: soft lilac, peach and pink colour fields, painted once as one fixed background.
     (Moving screen-sized layers here would each need its own large GPU texture — enough on a
     phone to stop the rest of the page painting. The motion lives in the orb and sparkles.) ── */
  .glow { position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(60vmax 60vmax at 0% 0%, rgba(201,184,255,.9), transparent 70%),
      radial-gradient(55vmax 55vmax at 100% 45%, rgba(255,198,165,.75), transparent 70%),
      radial-gradient(60vmax 50vmax at 15% 100%, rgba(255,158,199,.55), transparent 70%),
      linear-gradient(160deg, #f6efff, #fff1ea 55%, #f1ebff); }

  .wrap { width: min(100%, 1060px); margin: 0 auto; padding: 0 var(--pad); }
  .sec { position: relative; padding: clamp(50px, 11vw, 100px) 0; }
  .center { text-align: center; }

  .eyebrow { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; background: var(--glass); border: 1px solid var(--edge);
             font-size: .76rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--plum); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .h2 { font-family: var(--display); font-weight: 700; letter-spacing: -.02em; line-height: 1; font-size: calc(clamp(2.2rem, 9.5vw, 3.8rem) * var(--fit, 1)); margin-top: 14px; }
  .h2 i, .it { font-family: var(--serif); font-style: italic; font-weight: 400; letter-spacing: 0; }
  .lead { color: var(--soft); max-width: 44ch; margin-top: 10px; font-size: 1.05rem; }
  .center .lead { margin-inline: auto; }

  /* Panels are a milky translucent white — over this soft background that reads as glass already.
     Real backdrop blur is reserved for the two panels that matter (.frost): blurring every card
     over a moving background re-renders them all on every frame, which is slow on phones. */
  .glass { background: rgba(255,255,255,.58); border: 1px solid var(--edge); border-radius: var(--r); box-shadow: 0 18px 44px rgba(91,63,140,.1), inset 0 1px 0 rgba(255,255,255,.8); }
  @supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .glass.frost { background: var(--glass); -webkit-backdrop-filter: blur(16px) saturate(1.25); backdrop-filter: blur(16px) saturate(1.25); }
  }

  /* Reveal: a gentle fade up (opacity and transform only). */
  .rv { opacity: 0; transform: translateY(22px); transition: opacity .9s ease, transform .9s cubic-bezier(.2,.8,.2,1); }
  .rv.in { opacity: 1; transform: none; }

  /* Sparkles. */
  .spark { position: absolute; width: 22px; height: 22px; pointer-events: none; animation: twinkle 3.2s ease-in-out infinite; }
  .spark path { fill: #fff; }
  @keyframes twinkle { 0%, 100% { transform: scale(.4) rotate(0deg); opacity: .3; } 50% { transform: scale(1) rotate(90deg); opacity: 1; } }

  /* ── HERO ── */
  .hero { position: relative; min-height: 100vh; min-height: 100svh; display: grid; align-items: center; padding: calc(env(safe-area-inset-top) + 34px) 0 44px; overflow: hidden; }
  .hero-grid { display: grid; gap: 26px; align-items: center; text-align: center; }
  .hi { font-family: var(--serif); font-style: italic; font-size: clamp(1.5rem, 6vw, 2.1rem); color: var(--plum); margin-top: 18px; }
  .name {
    font-family: var(--display); font-weight: 800; letter-spacing: -.04em; line-height: .88;
    font-size: calc(clamp(4.2rem, 22vw, 10rem) * var(--fit, 1)); margin: 8px 0;
    background: var(--shine); background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shimmer 9s ease-in-out infinite alternate; padding: 0 .04em .08em;
  }
  @keyframes shimmer { to { background-position: 100% 0; } }
  .turns { display: inline-flex; align-items: center; gap: 12px; font-family: var(--serif); font-style: italic; font-size: clamp(1.6rem, 6.5vw, 2.4rem); color: var(--ink); }
  .turns b { font-family: var(--display); font-style: normal; font-weight: 800; font-size: 1.5em; line-height: 1; color: transparent; -webkit-text-stroke: 1.5px var(--plum); }
  .hero-tag { max-width: 34ch; margin: 12px auto 0; color: var(--soft); font-size: 1.08rem; }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); margin: 26px auto 0; max-width: 520px; padding: 6px; }
  .facts div { padding: 12px 8px; min-width: 0; }
  .facts div + div { border-left: 1px solid rgba(91,63,140,.16); }
  .facts small { display: block; font-size: .66rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--plum); }
  .facts b { display: block; font-family: var(--display); font-weight: 700; font-size: clamp(.9rem, 3.8vw, 1.05rem); line-height: 1.2; margin-top: 3px; overflow-wrap: anywhere; }
  .cta { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 54px; margin-top: 24px; padding: 0 28px; border-radius: 999px;
         background: var(--ink); color: #fff; text-decoration: none; font-weight: 700; letter-spacing: .02em; box-shadow: 0 14px 30px rgba(42,31,61,.25); transition: transform .25s; }
  .cta:hover { transform: translateY(-2px); }
  .snap { position: relative; width: min(64vw, 320px); margin: 0 auto; rotate: -4deg; }
  .snap .ph { aspect-ratio: 4 / 5; border-radius: 30px; overflow: hidden; border: 6px solid rgba(255,255,255,.85); box-shadow: 0 30px 60px rgba(91,63,140,.25); background: var(--lilac); }
  .snap .ph img, .snap .ph video { width: 100%; height: 100%; object-fit: cover; }
  .snap .label { position: absolute; right: -10px; bottom: 18px; rotate: 8deg; padding: 8px 14px; border-radius: 999px; background: var(--ink); color: #fff; font-family: var(--serif); font-style: italic; font-size: 1.1rem; }
  /* Without a photo: a glowing orb with the age. */
  .orb { position: relative; width: min(58vw, 300px); aspect-ratio: 1; margin: 0 auto; border-radius: 50%;
         background: radial-gradient(circle at 30% 25%, #fff 0%, rgba(255,255,255,.3) 22%, transparent 42%), conic-gradient(from 200deg, #c9b8ff, #ff9ec7, #ffc6a5, #b9e0ff, #c9b8ff);
         box-shadow: 0 30px 70px rgba(155,123,255,.35), inset 0 -20px 40px rgba(91,63,140,.2); animation: float 6s ease-in-out infinite; display: grid; place-items: center; }
  .orb b { font-family: var(--display); font-weight: 800; font-size: clamp(5rem, 26vw, 9rem); color: #fff; line-height: 1; letter-spacing: -.05em; text-shadow: 0 8px 30px rgba(91,63,140,.35); }
  @keyframes float { 50% { transform: translateY(-12px); } }
  .hero .name, .hero .turns, .hero .hi { opacity: 0; transform: translateY(16px); transition: opacity 1s ease, transform 1.1s cubic-bezier(.2,.8,.2,1); }
  .hero .turns { transition-delay: .25s; } .hero .name { transition-delay: .1s; }
  .is-ready .hero .name, .is-ready .hero .turns, .is-ready .hero .hi { opacity: 1; transform: none; }
  @media (min-width: 880px) {
    .hero-grid { grid-template-columns: 1.15fr .85fr; text-align: left; gap: 40px; }
    .hero-grid .art { order: 2; }
    .hero-tag { margin-left: 0; }
    .facts { margin-left: 0; }
  }

  /* ── COUNTDOWN ── */
  .cd { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(6px, 2.4vw, 16px); max-width: 680px; margin: 28px auto 0; }
  .cd-cell { padding: clamp(14px, 4vw, 26px) 4px; text-align: center; min-width: 0; }
  /* Syne is very wide, so the figures are sized to fit a three-digit day count in a quarter of a phone. */
  .cd-num { display: block; font-family: var(--display); font-weight: 700; font-size: clamp(1.15rem, 5.6vw, 3rem); line-height: 1; letter-spacing: -.04em; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cd-unit { display: block; margin-top: 6px; font-family: var(--serif); font-style: italic; font-size: clamp(.95rem, 3.8vw, 1.2rem); color: var(--plum); }
  .cd-note { grid-column: 1 / -1; padding: 22px; text-align: center; font-family: var(--serif); font-style: italic; font-size: 2rem; }

  /* ── PLACES ── */
  .places { display: grid; gap: 18px; margin-top: 28px; }
  @media (min-width: 760px) { .places { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); } }
  .place { overflow: hidden; }
  .place figure { aspect-ratio: 16 / 9; overflow: hidden; border-radius: calc(var(--r) - 6px); margin: 6px 6px 0; background: var(--lilac); }
  .place figure img { width: 100%; height: 100%; object-fit: cover; }
  .place-body { padding: 20px 22px 24px; }
  .place .k { font-size: .72rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--plum); }
  .place h3 { font-family: var(--display); font-weight: 700; font-size: 1.55rem; line-height: 1.1; letter-spacing: -.01em; margin-top: 6px; overflow-wrap: anywhere; }
  .place p { color: var(--soft); overflow-wrap: anywhere; }
  .place .time { font-family: var(--serif); font-style: italic; font-size: 1.25rem; color: var(--ink); margin-top: 4px; }
  .pill-btn { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; min-height: 46px; padding: 0 20px; border-radius: 999px; background: #fff; color: var(--ink); font-weight: 700; text-decoration: none; box-shadow: 0 8px 18px rgba(91,63,140,.12); }

  /* ── THE PLAN: a swipeable carousel on phones, a grid on larger screens ── */
  .rail { display: grid; grid-auto-flow: column; grid-auto-columns: min(76%, 290px); gap: 14px; margin: 28px calc(var(--pad) * -1) 0; padding: 6px var(--pad) 18px;
          overflow-x: auto; overscroll-behavior-x: contain; scroll-snap-type: x mandatory; scroll-padding-inline: var(--pad); scrollbar-width: none; }
  .rail::-webkit-scrollbar { display: none; }
  .step { scroll-snap-align: start; padding: 22px 20px; min-height: 190px; display: flex; flex-direction: column; }
  .step .n { font-family: var(--serif); font-style: italic; font-size: 1.1rem; color: var(--plum); }
  .step .ic { font-size: 1.8rem; margin-top: 10px; font-family: 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif; }
  .step .t { margin-top: auto; padding-top: 16px; font-family: var(--display); font-weight: 800; font-size: 1.5rem; letter-spacing: -.02em; }
  .step h3 { font-weight: 700; font-size: 1.1rem; line-height: 1.25; overflow-wrap: anywhere; }
  .step p { color: var(--soft); font-size: .95rem; }
  .step a { font-weight: 700; color: var(--plum); }
  .swipe-note { display: flex; align-items: center; gap: 8px; margin-top: 2px; font-family: var(--serif); font-style: italic; color: var(--plum); }
  @media (min-width: 860px) {
    .rail { grid-auto-flow: row; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); overflow: visible; margin-inline: 0; padding-inline: 0; }
    .swipe-note { display: none; }
  }

  /* ── NOTES / GALLERY ── */
  .notes { display: grid; gap: 16px; margin-top: 26px; }
  @media (min-width: 760px) { .notes { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); } }
  .note { padding: 24px; }
  .note small { font-size: .72rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--plum); }
  .note h3 { font-family: var(--display); font-weight: 700; font-size: 1.6rem; letter-spacing: -.01em; line-height: 1.1; margin-top: 6px; overflow-wrap: anywhere; }
  .note p { color: var(--soft); margin-top: 6px; }
  .note .acct { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(91,63,140,.14); }
  .copy { min-height: 40px; padding: 0 16px; border: 0; border-radius: 999px; background: var(--ink); color: #fff; font-weight: 700; cursor: pointer; }
  .collage { columns: 2; column-gap: 12px; margin-top: 28px; }
  @media (min-width: 760px) { .collage { columns: 3; } }
  .collage figure { break-inside: avoid; margin-bottom: 12px; border-radius: 22px; overflow: hidden; border: 4px solid rgba(255,255,255,.8); background: var(--lilac); }
  .collage figure:nth-child(3n+1) { rotate: -1.5deg; } .collage figure:nth-child(3n) { rotate: 1.5deg; }
  .collage img { width: 100%; height: auto; }

  /* ── GUEST LIST (RSVP) ── */
  .rsvp-card { max-width: 580px; margin: 28px auto 0; padding: clamp(22px, 6vw, 40px); position: relative; }
  .rsvp-card h2 { font-family: var(--display); font-weight: 700; letter-spacing: -.02em; line-height: 1.02; font-size: clamp(2rem, 8vw, 2.9rem); }
  .rsvp-card .desc { color: var(--soft); margin-top: 8px; }
  .rsvp-card .notes-line { margin-top: 8px; font-family: var(--serif); font-style: italic; font-size: 1.15rem; color: var(--plum); }
  .rsvp { display: grid; gap: 14px; margin-top: 22px; }
  .rsvp-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 5px; border-radius: 999px; background: rgba(255,255,255,.55); border: 1px solid var(--edge); }
  .rsvp-choice { position: relative; display: flex; align-items: center; justify-content: center; text-align: center; min-height: 50px; padding: 6px 10px; border-radius: 999px; cursor: pointer;
                 font-weight: 700; font-size: .95rem; line-height: 1.15; transition: background .3s, color .3s, box-shadow .3s; }
  .rsvp-choice input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .rsvp-choice.on { background: var(--ink); color: #fff; box-shadow: 0 8px 18px rgba(42,31,61,.25); }
  .rsvp-choice:focus-within { outline: 2px solid var(--plum); outline-offset: 2px; }
  .rsvp-field { display: grid; gap: 6px; }
  .rsvp-label { font-size: .72rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--plum); }
  .rsvp-input { width: 100%; min-height: 54px; padding: 12px 18px; border-radius: 18px; border: 1px solid rgba(255,255,255,.9); background: rgba(255,255,255,.72); color: var(--ink); font-size: 16px; font-weight: 500; }
  textarea.rsvp-input { resize: none; min-height: 88px; }
  .rsvp-input::placeholder { color: rgba(42,31,61,.45); }
  .rsvp-input:focus { outline: none; border-color: var(--lilac); box-shadow: 0 0 0 4px rgba(201,184,255,.55); }
  .rsvp-error { color: #c2185b; font-weight: 700; }
  .rsvp-submit { position: relative; overflow: hidden; min-height: 58px; border: 0; border-radius: 999px; cursor: pointer; color: #fff; font-weight: 700; font-size: 1.05rem; letter-spacing: .02em;
                 background: var(--shine); background-size: 200% 100%; box-shadow: 0 16px 34px rgba(255,111,174,.32); transition: background-position .8s ease, transform .2s; }
  .rsvp-submit:hover { background-position: 100% 0; }
  .rsvp-submit:active { transform: scale(.98); }
  .rsvp-done { text-align: center; margin-top: 22px; }
  .rsvp-done-title { font-family: var(--serif); font-style: italic; font-size: clamp(2.2rem, 9vw, 3rem); line-height: 1; background: var(--shine); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .rsvp-done-body { color: var(--soft); margin-top: 8px; }

  .contact { margin-top: 24px; padding-top: 18px; border-top: 1px solid rgba(91,63,140,.16); text-align: center; }
  .contact-intro { font-family: var(--serif); font-style: italic; font-size: 1.15rem; color: var(--plum); }
  .contact-name { font-family: var(--display); font-weight: 700; font-size: 1.25rem; }
  .contact-phone { color: var(--soft); }
  .contact-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 10px; }
  .contact-link { display: inline-flex; align-items: center; min-height: 42px; padding: 0 16px; border-radius: 999px; background: #fff; color: var(--ink); font-weight: 700; text-decoration: none; box-shadow: 0 6px 14px rgba(91,63,140,.12); }

  footer { text-align: center; padding: 10px var(--pad) calc(env(safe-area-inset-bottom) + 70px); }
  footer p { font-family: var(--serif); font-style: italic; font-size: clamp(2rem, 9vw, 3.2rem); color: var(--plum); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
    .rv, .hero .name, .hero .turns, .hero .hi { opacity: 1; transform: none; transition: none; }
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<main id="app"></main>

<script src="../../../shared/demo-data.js"></script>
<script src="../../../shared/invitation-core.js"></script>
<script src="../../../shared/invitation-music.js" defer></script>
<script src="../../../shared/rsvp-guest-picker.js" defer></script>
<script>
const DEFAULT_DATA = {
  template: 'lilac-glow',
  title: 'Name',
  cover: {
    enabled: true, headline: '', eventLabel: '16', names: 'Name',
    tagline: 'Good music, great people and a little bit of glitter.',
    greeting: 'Hey', hostIntro: '', hostOutro: '', hostText: '', image: '', video: '', buttonText: 'RSVP'
  },
  countdown: { enabled: true, label: 'The countdown is on', date: '', time: '', tzOffset: null, description: '', image: '' },
  families:  { enabled: false, label: 'Hosted by', title: '', items: [] },
  locations: { enabled: true, label: 'Location', title: 'Where to find us', image: '', items: [
    { label: 'The party', time: '', name: '', addr: '', url: '', img: '' }
  ] },
  timeline:  { enabled: true, label: 'The plan', title: 'How the night goes', items: [] },
  gallery:   { enabled: false, label: 'Moments', title: 'Some favourites', items: [] },
  gifts:     { enabled: false, label: 'Gifts', title: 'Wish list', description: '', image: '', items: [] },
  rsvp: {
    enabled: true, label: 'RSVP', title: 'Will you be there?', description: '',
    deadline: '', maxPeople: 4, buttonText: 'Send my RSVP', allowWishes: true, image: '',
    contactName: '', contactPhone: '', contactLink: ''
  },
  memories: { enabled: false, title: '', description: '', url: '', buttonText: '' },
  music:    { enabled: false, url: '', autoplay: true },
  customSections: []
};

const I = Invite, esc = I.esc;
const R = (cls, extra) => `class="${cls ? cls + ' ' : ''}rv"${extra ? ' ' + extra : ''}`;
const SPARK = (x, y, s, d) => `<svg class="spark" style="left:${x};top:${y};width:${s}px;height:${s}px;animation-delay:${d}s" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0 C13 8 16 11 24 12 C16 13 13 16 12 24 C11 16 8 13 0 12 C8 11 11 8 12 0 Z"/></svg>`;

function hero(data) {
  const c = data.cover || {}, cd = data.countdown || {};
  const name = c.names || data.title || '';
  const age = I.numberIn(c.eventLabel);
  const dp = I.dateParts(cd);
  const place = ((data.locations || {}).items || []).find(x => x && x.name);
  const guest = I.guestName();
  const photo = I.media(c.image, c.video, name, true);
  const facts = [
    dp ? ['Date', `${dp.weekdayShort} ${dp.d} ${dp.monthShort}`] : null,
    cd.time ? ['Time', I.fmtClock(cd.time)] : null,
    place ? ['Place', place.name] : null
  ].filter(Boolean);
  return `
  <section class="hero">
    ${SPARK('8%', '14%', 26, 0)}${SPARK('86%', '22%', 18, 1.1)}${SPARK('74%', '82%', 24, 2)}${SPARK('12%', '70%', 16, .6)}
    <div class="wrap hero-grid">
      <div class="art">
        ${photo
          ? `<div class="snap"><div class="ph">${photo}</div><span class="label">the birthday girl ✦</span></div>`
          : `<div class="orb"><b>${esc(age || '✦')}</b></div>`}
      </div>
      <div>
        <span class="eyebrow">✦ ${esc(c.headline || "You're invited")} ✦</span>
        <p class="hi">${guest ? `${esc(c.greeting || 'Hey')} ${esc(guest)}, you're invited to celebrate` : 'come celebrate'}</p>
        <h1 class="name" data-fit=".35">${esc(name)}</h1>
        ${age ? `<p class="turns">turning <b>${esc(age)}</b></p>` : ''}
        ${c.tagline ? `<p class="hero-tag">${esc(c.tagline)}</p>` : ''}
        ${facts.length ? `<div class="facts glass frost">${facts.map(([k, v]) => `<div><small>${k}</small><b>${esc(v)}</b></div>`).join('')}</div>` : ''}
        <a class="cta" href="#rsvp">${esc(c.buttonText || 'RSVP')} <span aria-hidden="true">→</span></a>
      </div>
    </div>
  </section>`;
}

function countdown(data) {
  const cd = data.countdown || {};
  if (cd.enabled === false) return '';
  const target = I.eventInstant(cd);
  const dp = I.dateParts(cd);
  return `
  <section class="sec center">
    <div class="wrap">
      <span ${R('eyebrow')}>${esc(cd.label || 'The countdown is on')}</span>
      <h2 ${R('h2')} data-fit>${dp ? `${esc(dp.weekday)} <i>the</i> ${esc(I.ordinal(dp.d))}` : 'Date <i>soon</i>'}</h2>
      ${dp ? `<p ${R('lead')}>${esc(dp.month)} ${dp.y}${cd.time ? ' · from ' + esc(I.fmtClock(cd.time)) : ''}${cd.description ? ' · ' + esc(cd.description) : ''}</p>` : ''}
      ${target !== null ? `<div ${R('cd')} data-countdown="${target}" data-past-today="tonight's the night ✦" data-past-after="thank you for coming ✦">
        ${['d', 'h', 'm', 's'].map((k, i) => `<div class="cd-cell glass"><span class="cd-num" data-cd="${k}">–</span><span class="cd-unit">${['days', 'hours', 'minutes', 'seconds'][i]}</span></div>`).join('')}
      </div>` : ''}
    </div>
  </section>`;
}

function places(data) {
  const l = data.locations || {};
  const items = (l.items || []).filter(x => x && (x.name || x.addr || x.label));
  if (l.enabled === false || !items.length) return '';
  return `
  <section class="sec">
    <div class="wrap">
      <span ${R('eyebrow')}>${esc(l.label || 'Location')}</span>
      <h2 ${R('h2')} data-fit>${esc(l.title || 'Where to find us')}</h2>
      <div class="places">
        ${items.map(x => `
          <article ${R('place glass')}>
            ${x.img ? `<figure>${I.img(x.img, x.name)}</figure>` : ''}
            <div class="place-body">
              ${x.label ? `<p class="k">${esc(x.label)}</p>` : ''}
              ${x.name ? `<h3>${esc(x.name)}</h3>` : ''}
              ${x.addr ? `<p>${I.nl2br(x.addr)}</p>` : ''}
              ${x.time ? `<p class="time">${esc(x.time)}</p>` : ''}
              ${x.url ? `<a class="pill-btn" href="${esc(I.mapHref(x.url))}" target="_blank" rel="noopener">Open in Maps ↗</a>` : ''}
            </div>
          </article>`).join('')}
      </div>
    </div>
  </section>`;
}

function plan(data) {
  const t = data.timeline || {};
  const items = (t.items || []).filter(x => x && (x.time || x.title));
  if (t.enabled === false || !items.length) return '';
  return `
  <section class="sec" style="padding-top:0">
    <div class="wrap">
      <span ${R('eyebrow')}>${esc(t.label || 'The plan')}</span>
      <h2 ${R('h2')} data-fit>${esc(t.title || 'How the night goes')}</h2>
      <div class="rail" role="list">
        ${items.map((x, i) => `
          <article ${R('step glass', 'role="listitem"')}>
            <span class="n">no. ${i + 1}</span>
            ${I.stepIcon(x) ? `<span class="ic" aria-hidden="true">${esc(I.stepIcon(x))}</span>` : ''}
            <span class="t">${esc(x.time || '')}</span>
            ${x.title ? `<h3>${esc(x.title)}</h3>` : ''}
            ${x.subtitle ? `<p>${esc(x.subtitle)}</p>` : ''}
            ${x.url ? `<p><a href="${esc(I.mapHref(x.url))}" target="_blank" rel="noopener">Map ↗</a></p>` : ''}
          </article>`).join('')}
      </div>
      ${items.length > 1 ? '<p class="swipe-note">swipe for more <span aria-hidden="true">→</span></p>' : ''}
    </div>
  </section>`;
}

function notes(data) {
  const c = data.cover || {}, f = data.families || {}, g = data.gifts || {}, gl = data.gallery || {};
  const fams = (f.enabled !== false ? (f.items || []) : []).filter(x => x && (x.names || x.label));
  const cards = [];
  (data.customSections || []).filter(s => s && s.enabled !== false && (s.title || s.body)).forEach(s => cards.push(`
    <div ${R('note glass')}>
      ${s.label ? `<small>${esc(s.label)}</small>` : ''}
      ${s.title ? `<h3>${esc(s.title)}</h3>` : ''}
      ${s.image ? `<figure style="margin:12px 0;border-radius:18px;overflow:hidden">${I.img(s.image, s.title)}</figure>` : ''}
      ${s.body ? `<p>${I.nl2br(s.body)}</p>` : ''}
    </div>`));
  if (c.hostText || fams.length || c.hostOutro) cards.push(`
    <div ${R('note glass')}>
      <small>${esc(f.label || 'Hosted by')}</small>
      ${c.hostText ? `<h3>${I.nl2br(c.hostText)}</h3>` : ''}
      ${fams.map(x => `<p>${x.label ? esc(x.label) + ' · ' : ''}<b>${esc(x.names || '')}</b></p>`).join('')}
      ${c.hostOutro ? `<p>${I.nl2br(c.hostOutro)}</p>` : ''}
    </div>`);
  const accounts = (g.items || []).filter(x => x && x.account);
  if (g.enabled !== false && (accounts.length || g.description)) cards.push(`
    <div ${R('note glass')}>
      <small>${esc(g.label || 'Gifts')}</small>
      <h3>${esc(g.title || 'Wish list')}</h3>
      ${g.description ? `<p>${I.nl2br(g.description)}</p>` : ''}
      ${accounts.map(x => `<div class="acct"><p><b>${esc(x.bank || 'Account')}</b><br>${esc(x.account)}</p><button type="button" class="copy" data-copy="${esc(x.account)}">Copy</button></div>`).join('')}
    </div>`);
  const photos = (gl.enabled !== false ? (gl.items || []) : []).filter(x => x && x.url).slice(0, 9);
  if (!cards.length && !photos.length) return '';
  return `
  <section class="sec" style="padding-top:0">
    <div class="wrap">
      ${cards.length ? `<span ${R('eyebrow')}>Good to know</span><div class="notes">${cards.join('')}</div>` : ''}
      ${photos.length ? `
        <div style="margin-top:${cards.length ? 70 : 0}px"><span ${R('eyebrow')}>${esc(gl.label || 'Moments')}</span>
        ${gl.title ? `<h2 ${R('h2')} data-fit>${esc(gl.title)}</h2>` : ''}</div>
        <div class="collage">${photos.map(x => `<figure ${R()}>${I.img(x.url, x.caption || 'Photo')}</figure>`).join('')}</div>` : ''}
    </div>
  </section>`;
}

function rsvp(data) {
  const r = data.rsvp || {};
  if (r.enabled === false) return '';
  return `
  <section class="sec center" id="rsvp">
    ${SPARK('10%', '12%', 22, .4)}${SPARK('88%', '40%', 26, 1.6)}
    <div class="wrap">
      <span ${R('eyebrow')}>${esc(r.label || 'RSVP')}</span>
      <div ${R('rsvp-card glass frost')} style="text-align:left">
        <h2>${esc(r.title || 'Will you be there?')}</h2>
        ${r.description ? `<p class="desc">${I.nl2br(r.description)}</p>` : ''}
        ${I.rsvpNotes(r).map(n => `<p class="notes-line">${esc(n)}</p>`).join('')}
        ${I.rsvpForm(r, {
          yes: "I'll be there ✦", no: "Can't make it",
          nameLabel: 'Your name', namePlaceholder: 'First and last name',
          countLabel: 'How many of you', wishesLabel: 'A little note (optional)',
          wishesPlaceholder: 'Happy birthday!', button: r.buttonText || 'Send my RSVP',
          doneTitle: 'yay, see you there'
        })}
        ${I.contactHtml(r, { intro: 'questions? ask' })}
      </div>
    </div>
  </section>`;
}

function build(data) {
  const c = data.cover || {};
  const name = c.names || data.title || '';
  document.title = (c.headline || `${name}'s Birthday`) + ' — Invitation';
  document.getElementById('app').innerHTML = [
    c.enabled !== false ? hero(data) : '',
    countdown(data), places(data), plan(data), notes(data), rsvp(data),
    `<footer><p>xoxo, ${esc(I.splitNames(name)[0] || name)}</p></footer>`
  ].join('');
}

Invite.boot(build, DEFAULT_DATA);
</script>
</body>
</html>
