<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1b3e">
<title>Birthday Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Baloo 2 is round, chunky and friendly for the big words; Nunito keeps small text easy to read. -->
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="../../../shared/config.js"></script>
<style>
  /*
   * ROCKET PARTY — a kids' birthday as a space mission.
   * Night sky, a rocket lifting off, the age inside a ringed planet, a "T-minus" launch panel,
   * a mission log for the programme and a boarding pass for the RSVP.
   */
  :root {
    --night:  #0d1b3e;
    --deep:   #152a5e;
    --panel:  #1b3372;
    --orange: #ff7a3d;
    --orange-2: #d9551c;
    --yellow: #ffd23f;
    --mint:   #3ee6b8;
    --sky:    #7cc4ff;
    --pink:   #ff6fa5;
    --cream:  #fff8ee;
    --ink:    #172448;
    --soft:   rgba(255,248,238,.74);
    --display: 'Baloo 2', 'Arial Rounded MT Bold', system-ui, sans-serif;
    --body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --pad: clamp(18px, 5vw, 40px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { max-width: 100%; overflow-x: hidden; }
  @supports (overflow: clip) { html, body { overflow-x: clip; } }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    background: var(--night); color: var(--cream);
    font-family: var(--body); font-size: 16px; line-height: 1.55;
    -webkit-tap-highlight-color: transparent;
  }
  img, video, svg { display: block; max-width: 100%; }
  a { color: inherit; }
  button, input, select, textarea { font: inherit; color: inherit; }

  /* ── STARFIELD: two tiled layers, the second twinkles (opacity only) ── */
  .sky { position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(1.5px 1.5px at 20px 30px, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 120px 80px, rgba(255,255,255,.8) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 70px 150px, rgba(255,255,255,.7) 50%, transparent 51%),
      radial-gradient(1px 1px at 170px 190px, #fff 50%, transparent 51%),
      radial-gradient(120% 70% at 80% 0%, #24418c 0%, transparent 60%),
      radial-gradient(90% 60% at 0% 100%, #2a1f62 0%, transparent 60%),
      var(--night);
    background-size: 200px 220px, 200px 220px, 200px 220px, 200px 220px, 100% 100%, 100% 100%, 100% 100%;
  }
  .sky::after { content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(2px 2px at 40px 60px, var(--yellow) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 150px 130px, var(--sky) 50%, transparent 51%),
      radial-gradient(2px 2px at 260px 40px, #fff 50%, transparent 51%);
    background-size: 310px 290px;
    animation: twinkle 3.6s ease-in-out infinite alternate;
  }
  @keyframes twinkle { from { opacity: .25; } to { opacity: 1; } }

  .wrap { width: min(100%, 1040px); margin: 0 auto; padding: 0 var(--pad); }
  section { position: relative; }
  .sec { padding: clamp(56px, 12vw, 104px) 0; }

  /* ── TYPE ── */
  .kicker {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--display); font-weight: 700; font-size: .82rem; letter-spacing: .14em; text-transform: uppercase;
    color: var(--mint);
  }
  .kicker::before { content: ''; width: 18px; height: 3px; border-radius: 2px; background: currentColor; }
  .h2 {
    font-family: var(--display); font-weight: 800; line-height: 1.02;
    font-size: calc(clamp(2.1rem, 9vw, 3.4rem) * var(--fit, 1));
    margin-top: 8px; overflow-wrap: break-word;
  }
  .lead { color: var(--soft); font-size: 1.05rem; max-width: 46ch; margin-top: 10px; }

  /* Reveal: a springy pop into place. */
  .rv { opacity: 0; transform: translateY(26px) scale(.97); transition: opacity .6s ease, transform .7s cubic-bezier(.2,1.5,.4,1); }
  .rv.in { opacity: 1; transform: none; }

  /* ── HERO ── */
  .hero { min-height: 100vh; min-height: 100svh; display: flex; align-items: center; overflow: hidden;
          padding: calc(env(safe-area-inset-top) + 28px) 0 calc(env(safe-area-inset-bottom) + 40px); }
  .hero-grid { display: grid; gap: 10px; align-items: center; text-align: center; width: 100%; }
  .hero-hi { font-family: var(--display); font-weight: 700; font-size: 1.15rem; color: var(--yellow); }
  .hero-name {
    font-family: var(--display); font-weight: 800; text-transform: uppercase;
    font-size: calc(clamp(3.4rem, 19vw, 7.6rem) * var(--fit, 1)); line-height: .9; letter-spacing: -.01em;
    color: var(--cream); text-shadow: 0 6px 0 var(--orange-2), 0 18px 34px rgba(0,0,0,.35);
    overflow-wrap: normal; margin: 6px 0 2px;
  }
  .hero-turning { font-family: var(--display); font-weight: 700; font-size: 1.2rem; color: var(--sky); }
  .hero-tag { font-size: 1.08rem; color: var(--soft); max-width: 34ch; margin: 8px auto 0; }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 20px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 6px 14px;
    border-radius: 999px; background: rgba(255,255,255,.08); border: 1.5px solid rgba(124,196,255,.35);
    font-weight: 700; font-size: .92rem; max-width: 100%;
  }
  .chip span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .blast {
    display: inline-flex; align-items: center; gap: 10px; margin-top: 26px; min-height: 52px; padding: 0 26px;
    border-radius: 999px; background: var(--orange); color: #fff; text-decoration: none;
    font-family: var(--display); font-weight: 800; font-size: 1.1rem; letter-spacing: .02em;
    box-shadow: 0 6px 0 var(--orange-2), 0 16px 30px rgba(255,122,61,.35);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .blast:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--orange-2); }

  /* Illustration: planet with the age, rocket flying past it. */
  .art { position: relative; width: min(84vw, 420px); aspect-ratio: 1; margin: 0 auto; order: -1; }
  .planet { position: absolute; left: 6%; bottom: 4%; width: 74%; }
  .planet svg { width: 100%; height: auto; overflow: visible; }
  .planet-ring-back, .planet-ring-front { transform-origin: 50% 50%; }
  .age {
    position: absolute; left: 6%; bottom: 4%; width: 74%; aspect-ratio: 1;
    display: grid; place-items: center; text-align: center; pointer-events: none;
  }
  .age b { display: block; font-family: var(--display); font-weight: 800; color: #fff; line-height: .8;
           font-size: clamp(4rem, 26vw, 9.4rem); text-shadow: 0 5px 0 rgba(0,0,0,.18); }
  .age small { display: block; font-family: var(--display); font-weight: 800; letter-spacing: .2em; font-size: clamp(.7rem, 2.6vw, .95rem); color: #fff3; color: rgba(255,255,255,.85); margin-top: 4px; }
  .rocket { position: absolute; right: 0; top: 0; width: 46%; animation: bob 3.4s ease-in-out infinite; }
  .flame { transform-origin: 50% 0; animation: flicker .18s ease-in-out infinite alternate; }
  @keyframes bob { 0%, 100% { transform: translate(0, 0) rotate(0deg); } 50% { transform: translate(-6px, -14px) rotate(-3deg); } }
  @keyframes flicker { from { transform: scaleY(.82); } to { transform: scaleY(1.12); } }
  .porthole {
    position: absolute; left: 58%; bottom: 0; width: 38%; aspect-ratio: 1; border-radius: 50%; overflow: hidden;
    border: 7px solid #c9d6ef; box-shadow: 0 0 0 3px var(--deep), 0 14px 30px rgba(0,0,0,.4); background: var(--deep);
  }
  .porthole img, .porthole video { width: 100%; height: 100%; object-fit: cover; }
  .has-photo .rocket { width: 38%; }

  /* Entrance: the rocket comes in from below the planet. */
  .hero .art .rocket { opacity: 0; translate: 30px 60px; transition: opacity .8s ease .2s, translate 1.1s cubic-bezier(.2,.9,.3,1.1) .2s; }
  .is-ready .hero .art .rocket { opacity: 1; translate: 0 0; }

  @media (min-width: 860px) {
    .hero-grid { grid-template-columns: 1.1fr .9fr; text-align: left; gap: 40px; }
    .art { order: 0; width: min(100%, 460px); }
    .chips { justify-content: flex-start; }
    .hero-tag { margin-left: 0; }
  }

  /* ── T-MINUS PANEL ── */
  .panel {
    margin-top: 26px; padding: clamp(18px, 4vw, 30px); border-radius: 28px;
    background: linear-gradient(160deg, var(--panel), var(--deep));
    border: 2px solid rgba(124,196,255,.28); box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 24px 50px rgba(0,0,0,.35);
  }
  .panel-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; align-items: baseline; margin-bottom: 16px; }
  .panel-top b { font-family: var(--display); font-size: 1.25rem; }
  .panel-top span { color: var(--sky); font-weight: 700; }
  .lights { display: flex; gap: 6px; }
  .lights i { width: 10px; height: 10px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 10px var(--mint); animation: blink 1.8s infinite; }
  .lights i:nth-child(2) { background: var(--yellow); box-shadow: 0 0 10px var(--yellow); animation-delay: .6s; }
  .lights i:nth-child(3) { background: var(--pink); box-shadow: 0 0 10px var(--pink); animation-delay: 1.2s; }
  @keyframes blink { 50% { opacity: .35; } }
  .cd { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(6px, 2vw, 14px); }
  .cd-cell { background: #0a1532; border-radius: 18px; padding: 14px 4px 10px; text-align: center; box-shadow: inset 0 3px 10px rgba(0,0,0,.5); min-width: 0; }
  .cd-num { display: block; font-family: var(--display); font-weight: 800; font-size: clamp(1.7rem, 8.5vw, 3.2rem); line-height: 1;
            color: var(--yellow); text-shadow: 0 0 18px rgba(255,210,63,.45); font-variant-numeric: tabular-nums; }
  .cd-unit { display: block; margin-top: 6px; font-size: clamp(.62rem, 2.4vw, .78rem); font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--mint); }
  .cd-note { grid-column: 1 / -1; text-align: center; font-family: var(--display); font-weight: 800; font-size: 1.5rem; color: var(--yellow); padding: 10px 0; }
  .when { margin-top: 16px; color: var(--soft); font-weight: 700; }

  /* ── LAUNCH PADS (locations) ── */
  .pads { display: grid; gap: 16px; margin-top: 26px; }
  @media (min-width: 760px) { .pads { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); } }
  .pad { position: relative; overflow: hidden; border-radius: 26px; background: rgba(255,255,255,.06); border: 1.5px solid rgba(255,255,255,.12); }
  .pad figure { aspect-ratio: 16 / 9; overflow: hidden; background: var(--deep); }
  .pad figure img { width: 100%; height: 100%; object-fit: cover; }
  .pad-body { padding: 20px 20px 22px; }
  .tag { display: inline-block; padding: 4px 12px; border-radius: 999px; background: var(--orange); color: #fff; font-weight: 800; font-size: .76rem; letter-spacing: .08em; text-transform: uppercase; }
  .pad h3 { font-family: var(--display); font-weight: 800; font-size: 1.6rem; line-height: 1.1; margin-top: 10px; overflow-wrap: anywhere; }
  .pad p { color: var(--soft); margin-top: 4px; overflow-wrap: anywhere; }
  .pad .time { color: var(--yellow); font-weight: 800; }
  .btn-map { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; min-height: 44px; padding: 0 18px; border-radius: 999px;
             background: var(--mint); color: var(--ink); font-weight: 800; text-decoration: none; }

  /* ── MISSION LOG (timeline) ── */
  .log { list-style: none; margin-top: 26px; position: relative; }
  .log::before { content: ''; position: absolute; left: 25px; top: 8px; bottom: 8px; border-left: 3px dotted rgba(124,196,255,.55); }
  .log li { position: relative; display: grid; grid-template-columns: 54px 1fr; gap: 14px; padding: 10px 0; align-items: start; }
  .log .dot { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; font-size: 1.5rem;
              background: var(--deep); border: 3px solid var(--sky); font-family: 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif; }
  .log li:nth-child(3n+2) .dot { border-color: var(--orange); }
  .log li:nth-child(3n) .dot { border-color: var(--mint); }
  .log .t { font-family: var(--display); font-weight: 800; color: var(--yellow); font-size: 1.05rem; }
  .log h3 { font-family: var(--display); font-weight: 700; font-size: 1.35rem; line-height: 1.15; overflow-wrap: anywhere; }
  .log p { color: var(--soft); }
  .log a { font-weight: 800; color: var(--mint); }

  /* ── HOSTS / CUSTOM ── */
  .note { margin-top: 26px; padding: 22px; border-radius: 26px; background: rgba(62,230,184,.08); border: 1.5px dashed rgba(62,230,184,.5); }
  .note h3 { font-family: var(--display); font-weight: 800; font-size: 1.4rem; }
  .note p { color: var(--soft); margin-top: 6px; }
  .note .who { color: var(--cream); font-weight: 800; }

  /* ── CREW PHOTOS ── */
  .portholes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(12px, 4vw, 26px); margin-top: 26px; }
  @media (min-width: 760px) { .portholes { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .portholes figure { aspect-ratio: 1; border-radius: 50%; overflow: hidden; border: 6px solid #c9d6ef; box-shadow: 0 0 0 3px var(--deep); background: var(--deep); }
  .portholes img { width: 100%; height: 100%; object-fit: cover; }

  /* ── CARGO (gifts) ── */
  .cargo { margin-top: 20px; display: grid; gap: 10px; }
  .cargo div { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,.07); }
  .cargo b { font-family: var(--display); }
  .cargo span { color: var(--soft); overflow-wrap: anywhere; }
  .copy { min-height: 40px; padding: 0 16px; border: 0; border-radius: 999px; background: var(--yellow); color: var(--ink); font-weight: 800; cursor: pointer; }

  /* ── BOARDING PASS (RSVP) ── */
  .pass { max-width: 560px; margin: 26px auto 0; border-radius: 30px; overflow: hidden; background: var(--cream); color: var(--ink);
          box-shadow: 0 30px 60px rgba(0,0,0,.4); }
  .pass-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 22px; background: var(--orange); color: #fff;
               font-family: var(--display); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
  .pass-head span:last-child { background: rgba(0,0,0,.14); padding: 2px 10px; border-radius: 8px; white-space: nowrap; }
  .pass-route { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 18px 22px 8px; text-align: center; }
  .pass-route small { display: block; font-size: .72rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #6c7697; }
  .pass-route b { display: block; font-family: var(--display); font-weight: 800; font-size: clamp(1.3rem, 6vw, 1.9rem); line-height: 1.05; overflow-wrap: anywhere; }
  .pass-route svg { width: 46px; }
  .pass-meta { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 8px 22px 18px; text-align: center; }
  .pass-meta small { display: block; font-size: .68rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #6c7697; }
  .pass-meta b { display: block; font-weight: 800; overflow-wrap: anywhere; }
  .tear { position: relative; height: 2px; margin: 0 22px; border-top: 3px dashed #d9cdb8; }
  .tear::before, .tear::after { content: ''; position: absolute; top: -17px; width: 30px; height: 30px; border-radius: 50%; background: var(--night); }
  .tear::before { left: -38px; } .tear::after { right: -38px; }
  .pass-body { padding: 22px; }
  .pass-body h2 { font-family: var(--display); font-weight: 800; font-size: clamp(1.7rem, 7vw, 2.3rem); line-height: 1.05; }
  .pass-body .desc { color: #4a5578; margin-top: 6px; }
  .pass-notes { margin-top: 8px; font-weight: 800; font-size: .88rem; color: var(--orange-2); }

  .rsvp { display: grid; gap: 14px; margin-top: 18px; }
  .rsvp-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .rsvp-choice { position: relative; display: flex; align-items: center; justify-content: center; text-align: center; min-height: 56px; padding: 8px;
                 border-radius: 18px; border: 2.5px solid #e2d6c1; background: #fff; cursor: pointer; font-family: var(--display); font-weight: 800; font-size: 1.05rem; line-height: 1.1;
                 transition: transform .2s cubic-bezier(.2,1.6,.4,1), background .2s, border-color .2s, color .2s; }
  .rsvp-choice input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .rsvp-choice.on { background: var(--ink); border-color: var(--ink); color: var(--yellow); transform: scale(1.03); }
  .rsvp-choice:focus-within { outline: 3px solid var(--sky); outline-offset: 2px; }
  .rsvp-field { display: grid; gap: 6px; }
  .rsvp-label { font-size: .78rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #6c7697; }
  .rsvp-input { width: 100%; min-height: 52px; padding: 12px 16px; border-radius: 16px; border: 2px solid #e2d6c1; background: #fff; color: var(--ink);
                font-family: var(--body); font-weight: 700; font-size: 16px; }
  textarea.rsvp-input { resize: none; min-height: 84px; }
  .rsvp-input:focus { outline: none; border-color: var(--sky); box-shadow: 0 0 0 3px rgba(124,196,255,.35); }
  .rsvp-input[readonly] { background: #f5efe4; }
  .rsvp-error { color: #c43b1b; font-weight: 800; }
  .rsvp-submit { min-height: 58px; border: 0; border-radius: 999px; cursor: pointer; background: var(--orange); color: #fff;
                 font-family: var(--display); font-weight: 800; font-size: 1.2rem; box-shadow: 0 6px 0 var(--orange-2); transition: transform .15s, box-shadow .15s; }
  .rsvp-submit:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--orange-2); }
  .rsvp-submit:disabled { opacity: .6; }
  .rsvp-done { margin-top: 18px; text-align: center; padding: 10px 0 4px; }
  .rsvp-done::before { content: '🚀'; display: block; font-size: 3rem; animation: launch 1.2s cubic-bezier(.2,.9,.3,1) both; font-family: 'Segoe UI Emoji', 'Apple Color Emoji', sans-serif; }
  .rsvp-done.is-no::before { content: '🛰️'; animation: none; }
  @keyframes launch { from { transform: translateY(40px) scale(.6); opacity: 0; } }
  .rsvp-done-title { font-family: var(--display); font-weight: 800; font-size: 1.6rem; }
  .rsvp-done-body { color: #4a5578; margin-top: 4px; }

  .contact { margin-top: 20px; padding-top: 16px; border-top: 2px dashed #e2d6c1; text-align: center; }
  .contact-intro { font-size: .8rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #6c7697; }
  .contact-name { font-family: var(--display); font-weight: 800; font-size: 1.25rem; }
  .contact-phone { color: #4a5578; font-weight: 700; }
  .contact-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 10px; }
  .contact-link { min-height: 42px; display: inline-flex; align-items: center; padding: 0 16px; border-radius: 999px; background: var(--ink); color: #fff; font-weight: 800; text-decoration: none; }

  footer { text-align: center; padding: 30px var(--pad) calc(env(safe-area-inset-bottom) + 60px); font-family: var(--display); font-weight: 700; color: var(--soft); }

  /* Decorative bits placed in sections. */
  .deco { position: absolute; pointer-events: none; z-index: 0; }
  .sec > .wrap { position: relative; z-index: 1; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
    .rv { opacity: 1; transform: none; transition: none; }
    .hero .art .rocket { opacity: 1; translate: 0 0; transition: none; }
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>
<div class="sky" aria-hidden="true"></div>
<main id="app"></main>

<script src="../../../shared/demo-data.js"></script>
<script src="../../../shared/invitation-core.js"></script>
<script src="../../../shared/invitation-music.js" defer></script>
<script src="../../../shared/rsvp-guest-picker.js" defer></script>
<script>
const DEFAULT_DATA = {
  template: 'rocket-party',
  title: 'Name',
  cover: {
    enabled: true, headline: '', eventLabel: '7', names: 'Name',
    tagline: 'Three, two, one… blast off to a party that is out of this world!',
    greeting: 'Hey', hostIntro: '', hostOutro: '', hostText: '', image: '', video: '', buttonText: 'Blast off'
  },
  countdown: { enabled: true, label: 'T-minus', date: '', time: '', tzOffset: null, description: '', image: '' },
  families:  { enabled: false, label: 'Mission control', title: '', items: [] },
  locations: { enabled: true, label: 'Launch pad', title: 'Where we land', image: '', items: [
    { label: 'The party', time: '', name: '', addr: '', url: '', img: '' }
  ] },
  timeline:  { enabled: true, label: 'Mission log', title: 'The plan', items: [] },
  gallery:   { enabled: false, label: 'Crew photos', title: 'Our astronaut', items: [] },
  gifts:     { enabled: false, label: 'Cargo hold', title: 'Gift ideas', description: '', image: '', items: [] },
  rsvp: {
    enabled: true, label: 'Boarding pass', title: 'Are you coming aboard?', description: '',
    deadline: '', maxPeople: 10, buttonText: 'Confirm my seat', allowWishes: true, image: '',
    contactName: '', contactPhone: '', contactLink: ''
  },
  memories: { enabled: false, title: '', description: '', url: '', buttonText: '' },
  music:    { enabled: false, url: '', autoplay: true },
  customSections: []
};

const I = Invite, esc = I.esc;
let rv = 0;
const R = (cls, extra) => `class="${cls ? cls + ' ' : ''}rv"${extra ? ' ' + extra : ''}`;

// ── ARTWORK ─────────────────────────────────────────────
const PLANET = `
<svg viewBox="0 0 300 300" aria-hidden="true">
  <defs>
    <radialGradient id="pg" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffb36b"/><stop offset=".55" stop-color="#ff7a3d"/><stop offset="1" stop-color="#e0417a"/></radialGradient>
  </defs>
  <ellipse class="planet-ring-back" cx="150" cy="160" rx="148" ry="40" fill="none" stroke="#7cc4ff" stroke-width="12" stroke-opacity=".55" transform="rotate(-14 150 160)"/>
  <circle cx="150" cy="150" r="108" fill="url(#pg)"/>
  <circle cx="98" cy="110" r="16" fill="#fff" fill-opacity=".14"/><circle cx="196" cy="200" r="22" fill="#000" fill-opacity=".08"/>
  <circle cx="200" cy="96" r="9" fill="#fff" fill-opacity=".16"/><circle cx="110" cy="206" r="11" fill="#000" fill-opacity=".07"/>
  <path class="planet-ring-front" d="M2 160 A148 40 0 0 0 298 160" fill="none" stroke="#ffd23f" stroke-width="12" stroke-linecap="round" transform="rotate(-14 150 160)"/>
</svg>`;
const ROCKET = `
<svg class="rocket" viewBox="0 0 160 220" aria-hidden="true">
  <defs><linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd23f"/><stop offset=".6" stop-color="#ff7a3d"/><stop offset="1" stop-color="#ff7a3d" stop-opacity="0"/></linearGradient></defs>
  <g transform="rotate(28 80 110)">
    <path class="flame" d="M62 162 Q80 230 98 162 Z" fill="url(#fl)"/>
    <path d="M52 120 L24 160 L56 150 Z" fill="#ff6fa5"/><path d="M108 120 L136 160 L104 150 Z" fill="#ff6fa5"/>
    <path d="M80 10 C112 40 116 100 106 158 L54 158 C44 100 48 40 80 10 Z" fill="#fff8ee"/>
    <path d="M80 10 C94 24 104 42 109 62 L51 62 C56 42 66 24 80 10 Z" fill="#ff7a3d"/>
    <circle cx="80" cy="96" r="18" fill="#7cc4ff" stroke="#172448" stroke-width="6"/>
    <circle cx="74" cy="90" r="5" fill="#fff" fill-opacity=".7"/>
    <rect x="70" y="150" width="20" height="14" rx="3" fill="#172448"/>
  </g>
</svg>`;
const MINI_PLANET = (color, ring) => `<svg viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="22" fill="${color}"/>${ring ? '<ellipse cx="40" cy="42" rx="38" ry="9" fill="none" stroke="#ffd23f" stroke-width="4" transform="rotate(-16 40 42)"/>' : ''}</svg>`;
const PLANE = `<svg viewBox="0 0 48 24" aria-hidden="true"><path d="M2 12h34" stroke="#ff7a3d" stroke-width="3" stroke-dasharray="3 4" stroke-linecap="round"/><path d="M34 4 L46 12 L34 20 Z" fill="#ff7a3d"/></svg>`;

// ── SECTIONS ────────────────────────────────────────────
function hero(data) {
  const c = data.cover || {}, cd = data.countdown || {};
  const name = c.names || data.title || '';
  const age = I.numberIn(c.eventLabel);
  const dp = I.dateParts(cd);
  const firstPlace = ((data.locations || {}).items || []).find(x => x && x.name);
  const guest = I.guestName();
  const photo = I.media(c.image, c.video, name, true);
  const kicker = c.headline || (age ? `${name}'s ${I.ordinal(age)} birthday` : `${name}'s birthday`);
  const chips = [
    dp ? `<span class="chip">📅 <span>${esc(dp.weekdayShort)} ${dp.d} ${esc(dp.monthShort)} ${dp.y}</span></span>` : '',
    cd.time ? `<span class="chip">⏰ <span>${esc(I.fmtClock(cd.time))}</span></span>` : '',
    firstPlace ? `<span class="chip">📍 <span>${esc(firstPlace.name)}</span></span>` : ''
  ].join('');
  return `
  <section class="hero">
    <div class="wrap">
      <div class="hero-grid">
        <div>
          <p class="kicker">${guest ? `${esc(c.greeting || 'Hey')} ${esc(guest)}, mission alert!` : 'Mission alert'}</p>
          <p class="hero-hi" style="margin-top:10px">${esc(kicker)}</p>
          <h1 class="hero-name" data-fit>${esc(name)}</h1>
          ${age ? `<p class="hero-turning">is turning ${esc(age)}!</p>` : ''}
          ${c.tagline ? `<p class="hero-tag">${esc(c.tagline)}</p>` : ''}
          ${chips ? `<div class="chips">${chips}</div>` : ''}
          <a class="blast" href="#rsvp">${esc(c.buttonText || 'Blast off')} <span aria-hidden="true">🚀</span></a>
        </div>
        <div class="art${photo ? ' has-photo' : ''}">
          <div class="planet">${PLANET}</div>
          <div class="age">${age ? `<div><b>${esc(age)}</b><small>${age === '1' ? 'YEAR' : 'YEARS'}</small></div>` : '<div><b>★</b></div>'}</div>
          ${ROCKET}
          ${photo ? `<div class="porthole">${photo}</div>` : ''}
        </div>
      </div>
    </div>
  </section>`;
}

function launch(data) {
  const cd = data.countdown || {};
  if (cd.enabled === false) return '';
  const target = I.eventInstant(cd);
  const dp = I.dateParts(cd);
  return `
  <section class="sec" id="countdown">
    <div class="deco" style="right:-30px;top:30px;width:120px;opacity:.7">${MINI_PLANET('#3ee6b8', true)}</div>
    <div class="wrap">
      <p ${R('kicker')}>${esc(cd.label || 'T-minus')}</p>
      <h2 ${R('h2')} data-fit>Countdown to lift-off</h2>
      <div ${R('panel')}>
        <div class="panel-top">
          <b>${dp ? `${esc(dp.weekday)}, ${dp.d} ${esc(dp.month)}` : 'Launch date coming soon'}</b>
          <span class="lights" aria-hidden="true"><i></i><i></i><i></i></span>
        </div>
        ${target !== null ? `<div class="cd" data-countdown="${target}" data-past-today="Lift-off day! 🚀" data-past-after="Mission accomplished, thanks for flying with us!">${I.countdownCells()}</div>` : ''}
        ${cd.time || cd.description ? `<p class="when">${[cd.time ? 'Lift-off at ' + esc(I.fmtClock(cd.time)) : '', esc(cd.description || '')].filter(Boolean).join(' · ')}</p>` : ''}
      </div>
    </div>
  </section>`;
}

function pads(data) {
  const l = data.locations || {};
  const items = (l.items || []).filter(x => x && (x.name || x.addr || x.label));
  if (l.enabled === false || !items.length) return '';
  return `
  <section class="sec">
    <div class="wrap">
      <p ${R('kicker')}>${esc(l.label || 'Launch pad')}</p>
      <h2 ${R('h2')} data-fit>${esc(l.title || 'Where we land')}</h2>
      <div class="pads">
        ${items.map(x => `
          <article ${R('pad')}>
            ${x.img ? `<figure>${I.img(x.img, x.name)}</figure>` : ''}
            <div class="pad-body">
              ${x.label ? `<span class="tag">${esc(x.label)}</span>` : ''}
              ${x.name ? `<h3>${esc(x.name)}</h3>` : ''}
              ${x.addr ? `<p>${I.nl2br(x.addr)}</p>` : ''}
              ${x.time ? `<p class="time">⏰ ${esc(x.time)}</p>` : ''}
              ${x.url ? `<a class="btn-map" href="${esc(I.mapHref(x.url))}" target="_blank" rel="noopener">📍 Get directions</a>` : ''}
            </div>
          </article>`).join('')}
      </div>
    </div>
  </section>`;
}

function missionLog(data) {
  const t = data.timeline || {};
  const items = (t.items || []).filter(x => x && (x.time || x.title));
  if (t.enabled === false || !items.length) return '';
  return `
  <section class="sec">
    <div class="deco" style="left:-40px;bottom:40px;width:110px;opacity:.6">${MINI_PLANET('#ff6fa5', false)}</div>
    <div class="wrap">
      <p ${R('kicker')}>${esc(t.label || 'Mission log')}</p>
      <h2 ${R('h2')} data-fit>${esc(t.title || 'The plan')}</h2>
      <ol class="log">
        ${items.map(x => `
          <li ${R()}>
            <span class="dot" aria-hidden="true">${esc(I.stepIcon(x) || '⭐')}</span>
            <div>
              ${x.time ? `<p class="t">${esc(x.time)}</p>` : ''}
              ${x.title ? `<h3>${esc(x.title)}</h3>` : ''}
              ${x.subtitle ? `<p>${esc(x.subtitle)}</p>` : ''}
              ${x.url ? `<p><a href="${esc(I.mapHref(x.url))}" target="_blank" rel="noopener">Map ↗</a></p>` : ''}
            </div>
          </li>`).join('')}
      </ol>
    </div>
  </section>`;
}

function extras(data) {
  const c = data.cover || {}, f = data.families || {};
  const fams = (f.enabled !== false ? (f.items || []) : []).filter(x => x && (x.names || x.label));
  const blocks = [];
  if (c.hostText || fams.length) {
    blocks.push(`<div ${R('note')}>
      <h3>${esc(f.label || 'Mission control')}</h3>
      ${c.hostText ? `<p class="who">${I.nl2br(c.hostText)}</p>` : ''}
      ${fams.map(x => `<p>${x.label ? esc(x.label) + ' · ' : ''}<span class="who">${esc(x.names || '')}</span></p>`).join('')}
      ${c.hostOutro ? `<p>${I.nl2br(c.hostOutro)}</p>` : ''}
    </div>`);
  } else if (c.hostOutro) {
    blocks.push(`<div ${R('note')}><p class="who">${I.nl2br(c.hostOutro)}</p></div>`);
  }
  (data.customSections || []).filter(s => s && s.enabled !== false && (s.title || s.body)).forEach(s => {
    blocks.push(`<div ${R('note')}>
      ${s.label ? `<p class="kicker">${esc(s.label)}</p>` : ''}
      ${s.title ? `<h3>${esc(s.title)}</h3>` : ''}
      ${s.image ? `<figure style="margin-top:12px;border-radius:18px;overflow:hidden">${I.img(s.image, s.title)}</figure>` : ''}
      ${s.body ? `<p>${I.nl2br(s.body)}</p>` : ''}
    </div>`);
  });
  if (!blocks.length) return '';
  return `<section class="sec" style="padding-top:0"><div class="wrap">${blocks.join('')}</div></section>`;
}

function crew(data) {
  const g = data.gallery || {};
  const items = (g.items || []).filter(x => x && x.url).slice(0, 8);
  if (g.enabled === false || !items.length) return '';
  return `
  <section class="sec">
    <div class="wrap">
      <p ${R('kicker')}>${esc(g.label || 'Crew photos')}</p>
      ${g.title ? `<h2 ${R('h2')} data-fit>${esc(g.title)}</h2>` : ''}
      <div class="portholes">${items.map(x => `<figure ${R()}>${I.img(x.url, x.caption || 'Photo')}</figure>`).join('')}</div>
    </div>
  </section>`;
}

function cargo(data) {
  const g = data.gifts || {};
  const accounts = (g.items || []).filter(x => x && x.account);
  if (g.enabled === false || (!accounts.length && !g.description)) return '';
  return `
  <section class="sec">
    <div class="wrap">
      <p ${R('kicker')}>${esc(g.label || 'Cargo hold')}</p>
      <h2 ${R('h2')} data-fit>${esc(g.title || 'Gift ideas')}</h2>
      ${g.description ? `<p ${R('lead')}>${I.nl2br(g.description)}</p>` : ''}
      ${accounts.length ? `<div ${R('cargo')}>${accounts.map(x => `
        <div><p><b>${esc(x.bank || 'Account')}</b><br><span>${esc(x.account)}</span></p>
        <button type="button" class="copy" data-copy="${esc(x.account)}">Copy</button></div>`).join('')}</div>` : ''}
    </div>
  </section>`;
}

function boardingPass(data) {
  const r = data.rsvp || {}, c = data.cover || {}, cd = data.countdown || {};
  if (r.enabled === false) return '';
  const name = c.names || data.title || '';
  const age = I.numberIn(c.eventLabel);
  const dp = I.dateParts(cd);
  const code = (I.splitNames(name)[0] || 'PARTY').replace(/[^A-Za-z]/g, '').slice(0, 3).toUpperCase() + (age ? '-' + I.pad2(age) : '');
  const notes = I.rsvpNotes(r);
  return `
  <section class="sec" id="rsvp">
    <div class="wrap">
      <p ${R('kicker')} style="justify-content:center;display:flex">${esc(r.label || 'Boarding pass')}</p>
      <div ${R('pass')}>
        <div class="pass-head"><span>🚀 ${esc(r.label || 'Boarding pass')}</span><span>${esc(code)}</span></div>
        <div class="pass-route">
          <div><small>From</small><b>Earth</b></div>
          ${PLANE}
          <div><small>To</small><b>Planet ${esc(I.splitNames(name)[0] || 'Party')}</b></div>
        </div>
        <div class="pass-meta">
          <div><small>Date</small><b>${dp ? `${dp.d} ${esc(dp.monthShort)}` : 'TBA'}</b></div>
          <div><small>Boarding</small><b>${cd.time ? esc(I.fmtClock(cd.time)) : 'TBA'}</b></div>
          <div><small>Gate</small><b>${age ? esc(age) : '★'}</b></div>
        </div>
        <div class="tear" aria-hidden="true"></div>
        <div class="pass-body">
          <h2>${esc(r.title || 'Are you coming aboard?')}</h2>
          ${r.description ? `<p class="desc">${I.nl2br(r.description)}</p>` : ''}
          ${notes.map(n => `<p class="pass-notes">${esc(n)}</p>`).join('')}
          ${I.rsvpForm(r, {
            yes: "I'm in! 🚀", no: "Can't make it",
            nameLabel: 'Astronaut name(s)', namePlaceholder: 'Your child\'s name',
            countLabel: 'Crew size', wishesLabel: 'Message for the birthday star (optional)',
            wishesPlaceholder: 'Happy birthday!', button: r.buttonText || 'Confirm my seat',
            doneTitle: 'Seat confirmed!'
          })}
          ${I.contactHtml(r, { intro: 'Mission control' })}
        </div>
      </div>
    </div>
  </section>`;
}

function build(data) {
  const c = data.cover || {};
  const name = c.names || data.title || '';
  document.title = (c.headline || `${name}'s Birthday`) + ' — Invitation';
  document.getElementById('app').innerHTML = [
    c.enabled !== false ? hero(data) : '',
    launch(data), pads(data), missionLog(data), extras(data), crew(data), cargo(data), boardingPass(data),
    `<footer>See you in orbit${I.guestName() ? ', ' + esc(I.guestName()) : ''}! 🪐</footer>`
  ].join('');
}

Invite.boot(build, DEFAULT_DATA);
</script>
</body>
</html>
