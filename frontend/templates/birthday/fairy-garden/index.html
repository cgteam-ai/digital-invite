<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fff7ef">
<title>Birthday Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Fredoka for the rounded, friendly display type; Caveat for handwritten notes; Quicksand for text. -->
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Caveat:wght@600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<script src="../../../shared/config.js"></script>
<style>
  /*
   * FAIRY GARDEN — a little girl's birthday as a storybook garden tea party.
   * Cream paper, an arched window with bunting and a tiered cake, flowers and butterflies,
   * flower-shaped countdown badges, a vine for the party plan and a tea-party ticket to reply.
   */
  :root {
    --cream:  #fff7ef;
    --paper:  #fffdf9;
    --blush:  #f9d3d9;
    --rose:   #ec8aa0;
    --berry:  #b64b6e;
    --lilac:  #d7c8f5;
    --violet: #8b6fc9;
    --sage:   #a9c9a1;
    --leaf:   #6f9a67;
    --butter: #ffe39c;
    --ink:    #5a3848;
    --soft:   #8a6a78;
    --display: 'Fredoka', 'Arial Rounded MT Bold', system-ui, sans-serif;
    --hand: 'Caveat', 'Segoe Print', cursive;
    --body: 'Quicksand', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --pad: clamp(18px, 5.5vw, 40px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { max-width: 100%; overflow-x: hidden; }
  @supports (overflow: clip) { html, body { overflow-x: clip; } }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    color: var(--ink); font-family: var(--body); font-weight: 500; font-size: 16px; line-height: 1.6;
    background: linear-gradient(180deg, #fde9ec 0, var(--cream) 620px) no-repeat, var(--cream);
    -webkit-tap-highlight-color: transparent;
  }
  /* Tiny polka dots over the paper. */
  body::before { content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(circle, rgba(236,138,160,.16) 1.6px, transparent 2px) 0 0 / 26px 26px; }
  img, video, svg { display: block; max-width: 100%; }
  a { color: inherit; }
  button, input, select, textarea { font: inherit; color: inherit; }

  .wrap { width: min(100%, 980px); margin: 0 auto; padding: 0 var(--pad); }
  .sec { position: relative; padding: clamp(52px, 11vw, 96px) 0; text-align: center; }

  .hand { font-family: var(--hand); font-weight: 700; color: var(--rose); font-size: clamp(1.6rem, 6.5vw, 2.2rem); line-height: 1; }
  .h2 { font-family: var(--display); font-weight: 600; color: var(--berry); line-height: 1.05;
        font-size: calc(clamp(2.1rem, 9vw, 3.3rem) * var(--fit, 1)); margin-top: 4px; }
  .lead { color: var(--soft); max-width: 44ch; margin: 10px auto 0; }
  .sprig { width: 120px; margin: 16px auto 0; }

  .rv { opacity: 0; transform: translateY(20px) scale(.98); transition: opacity .8s ease, transform .9s cubic-bezier(.2,.9,.3,1.2); }
  .rv.in { opacity: 1; transform: none; }

  /* ── HERO: the arched garden window ── */
  .hero { padding: calc(env(safe-area-inset-top) + 26px) 0 36px; text-align: center; overflow: hidden; }
  .hero-grid { display: grid; gap: 18px; align-items: center; }
  .arch-wrap { position: relative; width: min(78vw, 360px); margin: 16px auto 0; }
  .arch {
    position: relative; aspect-ratio: 3 / 4; border-radius: 999px 999px 32px 32px; overflow: hidden;
    background: linear-gradient(180deg, #fde6ea 0%, #f9d3d9 55%, #f4c1cc 100%);
    border: 8px solid var(--paper); box-shadow: 0 0 0 3px var(--rose), 0 26px 50px rgba(182,75,110,.22);
  }
  .arch > img, .arch > video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .arch .sun { position: absolute; left: 50%; top: 20%; width: 46%; aspect-ratio: 1; translate: -50% 0; border-radius: 50%; background: radial-gradient(circle, #fff3c9, #ffe39c 60%, transparent 62%); }
  .arch .hill { position: absolute; left: -10%; right: -10%; bottom: -18%; height: 42%; border-radius: 50%; background: var(--sage); }
  .arch .hill.b { left: 30%; right: -30%; bottom: -24%; background: #bcd8b4; }
  .cake { position: absolute; left: 50%; bottom: 7%; width: 64%; translate: -50% 0; }
  .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flick .9s ease-in-out infinite alternate; }
  .flame:nth-child(2n) { animation-delay: -.45s; }
  @keyframes flick { from { transform: scale(.85) rotate(-4deg); } to { transform: scale(1.1) rotate(4deg); } }
  .bunting { position: absolute; left: -4%; right: -4%; top: 12%; z-index: 2; }
  .blooms { position: absolute; bottom: -18px; width: 36%; z-index: 3; }
  .blooms.l { left: -14%; } .blooms.r { right: -14%; transform: scaleX(-1); }
  .has-photo .cake { width: 38%; left: auto; right: 4%; translate: none; }

  .fly { position: absolute; z-index: 4; width: clamp(40px, 13vw, 58px); pointer-events: none; filter: drop-shadow(0 4px 6px rgba(90,56,72,.18)); }
  .fly.a { left: -4%; top: 26%; animation: drift-a 11s ease-in-out infinite; }
  .fly.b { right: -2%; top: 56%; width: clamp(32px, 10vw, 46px); animation: drift-b 13s ease-in-out infinite; }
  .fly .wing { transform-box: fill-box; transform-origin: 100% 50%; animation: flap .35s ease-in-out infinite alternate; }
  .fly .wing.r { transform-origin: 0 50%; }
  @keyframes flap { to { transform: scaleX(.35); } }
  @keyframes drift-a { 0%,100% { transform: translate(0,0) rotate(-8deg); } 30% { transform: translate(40px,-50px) rotate(6deg); } 60% { transform: translate(90px,-10px) rotate(-4deg); } }
  @keyframes drift-b { 0%,100% { transform: translate(0,0) rotate(8deg); } 40% { transform: translate(-60px,-70px) rotate(-6deg); } 70% { transform: translate(-20px,-30px) rotate(4deg); } }

  .invited { font-family: var(--hand); font-weight: 700; font-size: clamp(1.8rem, 7.5vw, 2.4rem); color: var(--violet); line-height: 1; }
  .name {
    font-family: var(--display); font-weight: 700; color: var(--berry); line-height: .95;
    font-size: calc(clamp(3.6rem, 18vw, 6.6rem) * var(--fit, 1));
    text-shadow: 3px 3px 0 var(--paper), 6px 6px 0 var(--blush); margin: 4px 0 6px;
  }
  .turning { display: inline-flex; align-items: center; gap: 12px; font-family: var(--display); font-weight: 600; font-size: 1.3rem; color: var(--ink); }
  .badge { position: relative; width: 74px; height: 74px; display: grid; place-items: center; }
  .badge svg { position: absolute; inset: 0; width: 100%; height: 100%; animation: spin 16s linear infinite; }
  .badge b { position: relative; font-family: var(--display); font-weight: 700; font-size: 2.1rem; color: #fff; line-height: 1; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tag { max-width: 32ch; margin: 10px auto 0; color: var(--soft); font-size: 1.05rem; }
  .ribbon {
    position: relative; display: inline-block; margin: 22px auto 0; padding: 10px 30px; max-width: calc(100% - 30px);
    background: var(--rose); color: #fff; font-family: var(--display); font-weight: 600; font-size: 1.05rem; line-height: 1.3;
  }
  .ribbon::before, .ribbon::after { content: ''; position: absolute; top: 6px; bottom: -6px; width: 22px; background: var(--berry); z-index: -1; }
  .ribbon::before { left: -14px; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 40% 50%); }
  .ribbon::after  { right: -14px; clip-path: polygon(0 0, 100% 0, 60% 50%, 100% 100%, 0 100%); }
  .ribbon { isolation: isolate; }
  .cta { display: inline-flex; align-items: center; gap: 8px; margin-top: 22px; min-height: 50px; padding: 0 26px; border-radius: 999px;
         background: var(--paper); border: 2.5px solid var(--berry); color: var(--berry); font-family: var(--display); font-weight: 600; font-size: 1.1rem; text-decoration: none; }
  @media (min-width: 860px) {
    .hero-grid { grid-template-columns: .95fr 1.05fr; text-align: left; gap: 50px; }
    .hero-grid .arch-wrap { order: 2; width: min(100%, 400px); }
    .tag { margin-left: 0; }
  }

  /* ── COUNTDOWN: flower badges ── */
  .blooms-cd { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(4px, 2.5vw, 22px); max-width: 620px; margin: 26px auto 0; }
  .fl { position: relative; aspect-ratio: 1; display: grid; place-items: center; }
  .fl svg { position: absolute; inset: 0; width: 100%; height: 100%; transition: transform .6s cubic-bezier(.2,1.5,.4,1); }
  .fl:hover svg { transform: rotate(30deg); }
  .fl div { position: relative; text-align: center; line-height: 1; }
  .fl .cd-num { display: block; font-family: var(--display); font-weight: 700; font-size: clamp(1.25rem, 6.4vw, 2.5rem); color: var(--ink); font-variant-numeric: tabular-nums; }
  .fl .cd-unit { display: block; margin-top: 3px; font-size: clamp(.52rem, 2.2vw, .76rem); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--soft); }
  .cd-note { grid-column: 1 / -1; font-family: var(--hand); font-weight: 700; font-size: 2.2rem; color: var(--berry); }
  .when { margin-top: 18px; font-family: var(--display); font-weight: 600; font-size: 1.15rem; }

  /* ── CARDS with a scalloped top edge and stitched border ── */
  .cards { display: grid; gap: 34px; margin-top: 40px; text-align: left; }
  @media (min-width: 760px) { .cards { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); } }
  .card { position: relative; background: var(--paper); border-radius: 0 0 26px 26px; padding: 22px 22px 24px; box-shadow: 0 16px 34px rgba(90,56,72,.08); }
  .card::before { content: ''; position: absolute; left: 0; right: 0; top: -12px; height: 13px;
    background: radial-gradient(circle at 13px 13px, var(--paper) 12.5px, transparent 13px) -1px 0 / 26px 13px repeat-x; }
  .card::after { content: ''; position: absolute; inset: 8px; border: 2px dashed rgba(236,138,160,.4); border-radius: 0 0 20px 20px; pointer-events: none; }
  .card figure { margin: -4px -4px 14px; border-radius: 18px; overflow: hidden; aspect-ratio: 16 / 10; background: var(--blush); }
  .card figure img { width: 100%; height: 100%; object-fit: cover; }
  .pill { display: inline-block; padding: 3px 12px; border-radius: 999px; background: var(--lilac); color: #4d3b80; font-weight: 700; font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; }
  .card h3 { font-family: var(--display); font-weight: 600; font-size: 1.55rem; line-height: 1.15; color: var(--berry); margin-top: 8px; overflow-wrap: anywhere; }
  .card p { color: var(--soft); overflow-wrap: anywhere; }
  .card .time { color: var(--ink); font-weight: 700; }
  .btn-soft { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; min-height: 44px; padding: 0 18px;
              border-radius: 999px; background: var(--sage); color: #2f4a2b; font-weight: 700; text-decoration: none; }

  /* ── PARTY PLAN: a vine ── */
  .vine { list-style: none; position: relative; max-width: 620px; margin: 34px auto 0; text-align: left; }
  .vine::before { content: ''; position: absolute; left: 27px; top: 10px; bottom: 10px; width: 4px; border-radius: 2px; background: var(--sage); }
  .vine li { position: relative; display: grid; grid-template-columns: 58px 1fr; gap: 14px; padding: 8px 0; }
  .bud { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; background: var(--paper); border: 3px solid var(--rose); font-size: 1.5rem;
         font-family: 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif; box-shadow: 0 8px 18px rgba(182,75,110,.12); }
  .vine li:nth-child(2n) .bud { border-color: var(--violet); }
  .vine li:nth-child(3n) .bud { border-color: var(--leaf); }
  .vine .box { background: var(--paper); border-radius: 22px; padding: 12px 16px; box-shadow: 0 10px 22px rgba(90,56,72,.06); min-width: 0; }
  .vine .t { font-family: var(--hand); font-weight: 700; font-size: 1.5rem; color: var(--rose); line-height: 1; }
  .vine h3 { font-family: var(--display); font-weight: 600; font-size: 1.25rem; line-height: 1.2; overflow-wrap: anywhere; }
  .vine p { color: var(--soft); }
  .vine a { color: var(--leaf); font-weight: 700; }
  @media (min-width: 760px) {
    .vine { max-width: 820px; }
    .vine::before { left: 50%; margin-left: -2px; }
    .vine li { grid-template-columns: 1fr 58px 1fr; }
    .vine li .bud { grid-column: 2; grid-row: 1; }
    .vine li .box { grid-column: 3; grid-row: 1; }
    .vine li:nth-child(2n) .box { grid-column: 1; text-align: right; }
  }

  /* ── NOTES / GIFTS ── */
  .note { max-width: 620px; margin: 26px auto 0; padding: 24px; border-radius: 30px; background: rgba(215,200,245,.35); }
  .note h3 { font-family: var(--display); font-weight: 600; font-size: 1.4rem; color: var(--berry); }
  .note p { color: var(--soft); margin-top: 4px; }
  .note b { color: var(--ink); }
  .wish { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; text-align: left; margin-top: 12px; padding: 12px 16px; border-radius: 18px; background: var(--paper); }
  .wish span { overflow-wrap: anywhere; }
  .copy { min-height: 40px; padding: 0 16px; border: 0; border-radius: 999px; background: var(--rose); color: #fff; font-weight: 700; cursor: pointer; }

  /* ── GALLERY: little arches ── */
  .arches { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(12px, 4vw, 22px); margin-top: 30px; }
  @media (min-width: 760px) { .arches { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .arches figure { aspect-ratio: 3 / 4; border-radius: 999px 999px 18px 18px; overflow: hidden; border: 6px solid var(--paper); box-shadow: 0 0 0 2px var(--blush); background: var(--blush); }
  .arches figure:nth-child(2n) { translate: 0 18px; }
  .arches img { width: 100%; height: 100%; object-fit: cover; }

  /* ── TEA PARTY TICKET (RSVP) ── */
  .ticket { position: relative; max-width: 540px; margin: 30px auto 0; text-align: left; background: var(--paper); border-radius: 28px; padding: 26px 22px;
            box-shadow: 0 26px 50px rgba(182,75,110,.16); }
  .ticket::before, .ticket::after { content: ''; position: absolute; top: 86px; width: 30px; height: 30px; border-radius: 50%; background: var(--cream); }
  .ticket::before { left: -15px; } .ticket::after { right: -15px; }
  .admit { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-bottom: 18px; border-bottom: 2.5px dashed var(--blush); }
  .admit span { font-family: var(--display); font-weight: 600; letter-spacing: .14em; text-transform: uppercase; font-size: .82rem; color: var(--rose); }
  .admit b { font-family: var(--hand); font-weight: 700; font-size: 1.6rem; color: var(--violet); line-height: 1; }
  .ticket h2 { font-family: var(--display); font-weight: 600; color: var(--berry); font-size: clamp(1.8rem, 7.5vw, 2.4rem); line-height: 1.05; margin-top: 18px; }
  .ticket .desc { color: var(--soft); margin-top: 6px; }
  .ticket .notes { color: var(--rose); font-weight: 700; margin-top: 6px; font-size: .92rem; }

  .rsvp { display: grid; gap: 14px; margin-top: 18px; }
  .rsvp-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .rsvp-choice { position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px; padding: 8px 10px; text-align: center; line-height: 1.15;
                 border-radius: 999px; border: 2.5px solid var(--blush); background: #fff; cursor: pointer; font-family: var(--display); font-weight: 600; transition: background .25s, color .25s, border-color .25s; }
  .rsvp-choice input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .rsvp-choice::before { content: '✿'; color: var(--rose); transition: transform .4s cubic-bezier(.2,1.6,.4,1); }
  .rsvp-choice.on { background: var(--berry); border-color: var(--berry); color: #fff; }
  .rsvp-choice.on::before { color: var(--butter); transform: rotate(180deg) scale(1.25); }
  .rsvp-choice:focus-within { outline: 3px solid var(--lilac); outline-offset: 2px; }
  .rsvp-field { display: grid; gap: 4px; }
  .rsvp-label { font-family: var(--hand); font-weight: 700; font-size: 1.35rem; color: var(--violet); line-height: 1.1; }
  .rsvp-input { width: 100%; min-height: 52px; padding: 12px 18px; border-radius: 20px; border: 2px solid #f1dfe3; background: #fff; color: var(--ink); font-weight: 600; font-size: 16px; }
  textarea.rsvp-input { resize: none; min-height: 86px; }
  .rsvp-input:focus { outline: none; border-color: var(--rose); box-shadow: 0 0 0 4px rgba(249,211,217,.7); }
  .rsvp-input[readonly] { background: var(--cream); }
  .rsvp-error { color: #b4234f; font-weight: 700; }
  .rsvp-submit { min-height: 56px; border: 0; border-radius: 999px; cursor: pointer; background: var(--berry); color: #fff; font-family: var(--display); font-weight: 600; font-size: 1.15rem;
                 box-shadow: 0 10px 22px rgba(182,75,110,.3); transition: transform .2s; }
  .rsvp-submit:active { transform: scale(.98); }
  .rsvp-done { text-align: center; margin-top: 20px; }
  .rsvp-done::before { content: '🧁'; display: block; font-size: 3rem; font-family: 'Segoe UI Emoji', 'Apple Color Emoji', sans-serif; animation: pop .7s cubic-bezier(.2,1.6,.4,1) both; }
  .rsvp-done.is-no::before { content: '💌'; }
  @keyframes pop { from { transform: scale(.3); opacity: 0; } }
  .rsvp-done-title { font-family: var(--display); font-weight: 600; font-size: 1.6rem; color: var(--berry); }
  .rsvp-done-body { color: var(--soft); }

  .contact { margin-top: 22px; padding-top: 16px; border-top: 2.5px dashed var(--blush); text-align: center; }
  .contact-intro { font-family: var(--hand); font-weight: 700; font-size: 1.35rem; color: var(--violet); }
  .contact-name { font-family: var(--display); font-weight: 600; font-size: 1.2rem; }
  .contact-phone { color: var(--soft); }
  .contact-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 8px; }
  .contact-link { display: inline-flex; align-items: center; min-height: 42px; padding: 0 16px; border-radius: 999px; background: var(--blush); color: var(--berry); font-weight: 700; text-decoration: none; }

  footer { text-align: center; padding: 20px var(--pad) calc(env(safe-area-inset-bottom) + 64px); }
  footer p { font-family: var(--hand); font-weight: 700; font-size: 1.8rem; color: var(--rose); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
    .rv { opacity: 1; transform: none; transition: none; }
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>
<main id="app"></main>

<script src="../../../shared/demo-data.js"></script>
<script src="../../../shared/invitation-core.js"></script>
<script src="../../../shared/invitation-music.js" defer></script>
<script src="../../../shared/rsvp-guest-picker.js" defer></script>
<script>
const DEFAULT_DATA = {
  template: 'fairy-garden',
  title: 'Name',
  cover: {
    enabled: true, headline: '', eventLabel: '5', names: 'Name',
    tagline: 'Join us for tea, cake and a sprinkle of fairy magic in the garden.',
    greeting: 'Dear', hostIntro: '', hostOutro: '', hostText: '', image: '', video: '', buttonText: 'RSVP'
  },
  countdown: { enabled: true, label: 'Counting the sleeps', date: '', time: '', tzOffset: null, description: '', image: '' },
  families:  { enabled: false, label: 'Hosted with love by', title: '', items: [] },
  locations: { enabled: true, label: 'Where', title: 'Come find us', image: '', items: [
    { label: 'The garden party', time: '', name: '', addr: '', url: '', img: '' }
  ] },
  timeline:  { enabled: true, label: 'Party plan', title: 'A magical afternoon', items: [] },
  gallery:   { enabled: false, label: 'Our little flower', title: '', items: [] },
  gifts:     { enabled: false, label: 'Wish list', title: 'Birthday wishes', description: '', image: '', items: [] },
  rsvp: {
    enabled: true, label: 'Admit one', title: 'Will you join the tea party?', description: '',
    deadline: '', maxPeople: 10, buttonText: 'Send my reply', allowWishes: true, image: '',
    contactName: '', contactPhone: '', contactLink: ''
  },
  memories: { enabled: false, title: '', description: '', url: '', buttonText: '' },
  music:    { enabled: false, url: '', autoplay: true },
  customSections: []
};

const I = Invite, esc = I.esc;
const R = (cls, extra) => `class="${cls ? cls + ' ' : ''}rv"${extra ? ' ' + extra : ''}`;

// ── ARTWORK ─────────────────────────────────────────────
function flowerSvg(fill, center, petals) {
  const n = petals || 8, r = 26, out = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    out.push(`<circle cx="${(50 + Math.cos(a) * r).toFixed(1)}" cy="${(50 + Math.sin(a) * r).toFixed(1)}" r="21" fill="${fill}"/>`);
  }
  return `<svg viewBox="0 0 100 100" aria-hidden="true">${out.join('')}<circle cx="50" cy="50" r="30" fill="${center}"/></svg>`;
}
function cakeSvg(candles) {
  const n = Math.max(1, Math.min(9, candles || 1));
  const gap = 110 / (n + 1);
  let c = '';
  for (let i = 1; i <= n; i++) {
    const x = 45 + gap * i;
    c += `<rect x="${(x - 3).toFixed(1)}" y="22" width="6" height="22" rx="2" fill="${i % 2 ? '#d7c8f5' : '#a9c9a1'}"/>`
       + `<path class="flame" d="M${x} 6 C${x + 6} 14 ${x + 5} 20 ${x} 21 C${x - 5} 20 ${x - 6} 14 ${x} 6 Z" fill="#ffb84d"/>`;
  }
  return `<svg class="cake" viewBox="0 0 200 190" aria-hidden="true">
    ${c}
    <rect x="40" y="44" width="120" height="44" rx="12" fill="#fffdf9"/>
    <path d="M40 60 q10 14 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 V56 H40 Z" fill="#ec8aa0"/>
    <rect x="22" y="86" width="156" height="50" rx="14" fill="#f9d3d9"/>
    <path d="M22 100 q13 16 26 0 t26 0 t26 0 t26 0 t26 0 t26 0 V96 H22 Z" fill="#fffdf9"/>
    <circle cx="52" cy="120" r="5" fill="#b64b6e"/><circle cx="100" cy="120" r="5" fill="#8b6fc9"/><circle cx="148" cy="120" r="5" fill="#6f9a67"/>
    <rect x="8" y="134" width="184" height="46" rx="14" fill="#fffdf9"/>
    <path d="M8 148 q14 16 28 0 t28 0 t28 0 t28 0 t28 0 t28 0 t28 0 V144 H8 Z" fill="#d7c8f5"/>
    <rect x="0" y="178" width="200" height="10" rx="5" fill="#ec8aa0"/>
  </svg>`;
}
const BUNTING = (() => {
  const colors = ['#ec8aa0', '#ffe39c', '#d7c8f5', '#a9c9a1', '#fffdf9'];
  let f = '';
  for (let i = 0; i < 9; i++) {
    const x = 6 + i * 21;
    const y = 10 + Math.sin((i / 8) * Math.PI) * 12;
    f += `<path d="M${x} ${y.toFixed(1)} L${x + 21} ${(10 + Math.sin(((i + 1) / 8) * Math.PI) * 12).toFixed(1)} L${x + 10.5} ${(y + 26).toFixed(1)} Z" fill="${colors[i % colors.length]}"/>`;
  }
  return `<svg class="bunting" viewBox="0 0 200 50" aria-hidden="true"><path d="M2 8 Q100 36 198 8" fill="none" stroke="#b64b6e" stroke-width="2"/>${f}</svg>`;
})();
const BLOOMS = side => `<svg class="blooms ${side}" viewBox="0 0 120 120" aria-hidden="true">
  <path d="M60 120 C58 90 40 70 30 50 M60 120 C64 96 80 80 92 60 M60 120 C60 100 60 80 58 62" stroke="#6f9a67" stroke-width="4" fill="none" stroke-linecap="round"/>
  <ellipse cx="40" cy="88" rx="12" ry="6" fill="#a9c9a1" transform="rotate(-40 40 88)"/><ellipse cx="80" cy="96" rx="12" ry="6" fill="#a9c9a1" transform="rotate(30 80 96)"/>
  <g transform="translate(14 26) scale(.34)">${flowerSvg('#ec8aa0', '#ffe39c', 6).replace(/<\/?svg[^>]*>/g, '')}</g>
  <g transform="translate(74 36) scale(.3)">${flowerSvg('#d7c8f5', '#fffdf9', 6).replace(/<\/?svg[^>]*>/g, '')}</g>
  <g transform="translate(42 44) scale(.3)">${flowerSvg('#fffdf9', '#ec8aa0', 6).replace(/<\/?svg[^>]*>/g, '')}</g>
</svg>`;
const BUTTERFLY = (cls, a, b) => `<svg class="fly ${cls}" viewBox="0 0 40 32" aria-hidden="true">
  <g class="wing l"><path d="M20 16 C10 0 0 4 3 14 C0 22 10 28 20 16 Z" fill="${a}"/></g>
  <g class="wing r"><path d="M20 16 C30 0 40 4 37 14 C40 22 30 28 20 16 Z" fill="${b}"/></g>
  <rect x="19" y="8" width="2.4" height="16" rx="1.2" fill="#5a3848"/>
</svg>`;
const SPRIG = `<svg class="sprig" viewBox="0 0 120 24" aria-hidden="true"><path d="M4 12 H116" stroke="#a9c9a1" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="34" cy="7" rx="8" ry="4" fill="#a9c9a1" transform="rotate(-25 34 7)"/><ellipse cx="86" cy="17" rx="8" ry="4" fill="#a9c9a1" transform="rotate(-25 86 17)"/>
  <circle cx="60" cy="12" r="7" fill="#ec8aa0"/><circle cx="60" cy="12" r="3" fill="#ffe39c"/></svg>`;

// ── SECTIONS ────────────────────────────────────────────
function hero(data) {
  const c = data.cover || {}, cd = data.countdown || {};
  const name = c.names || data.title || '';
  const age = I.numberIn(c.eventLabel);
  const dp = I.dateParts(cd);
  const place = ((data.locations || {}).items || []).find(x => x && x.name);
  const guest = I.guestName();
  const photo = I.media(c.image, c.video, name, true);
  const ribbon = [dp ? `${dp.weekday}, ${dp.d} ${dp.month}` : '', cd.time ? I.fmtClock(cd.time) : '', place ? place.name : ''].filter(Boolean).join(' · ');
  return `
  <section class="hero">
    <div class="wrap hero-grid">
      <div class="arch-wrap${photo ? ' has-photo' : ''}">
        <div class="arch">
          ${photo || '<span class="sun"></span><span class="hill"></span><span class="hill b"></span>'}
          ${cakeSvg(Number(age) || 3)}
        </div>
        ${BUNTING}
        ${BLOOMS('l')}${BLOOMS('r')}
        ${BUTTERFLY('a', '#e0628a', '#9b7ee0')}${BUTTERFLY('b', '#f5b83d', '#e0628a')}
      </div>
      <div>
        <p class="invited">${guest ? `${esc(c.greeting || 'Dear')} ${esc(guest)}, you're invited!` : "You're invited to"}</p>
        ${c.headline ? `<p class="lead" style="margin-top:6px;font-weight:700;color:var(--violet)">${esc(c.headline)}</p>` : ''}
        <h1 class="name" data-fit>${esc(name)}</h1>
        ${age ? `<p class="turning">is turning <span class="badge">${flowerSvg('#ec8aa0', '#b64b6e', 8)}<b>${esc(age)}</b></span></p>` : ''}
        ${c.tagline ? `<p class="tag">${esc(c.tagline)}</p>` : ''}
        ${ribbon ? `<div><span class="ribbon">${esc(ribbon)}</span></div>` : ''}
        <a class="cta" href="#rsvp">${esc(c.buttonText || 'RSVP')} <span aria-hidden="true">✿</span></a>
      </div>
    </div>
  </section>`;
}

function countdown(data) {
  const cd = data.countdown || {};
  if (cd.enabled === false) return '';
  const target = I.eventInstant(cd);
  const dp = I.dateParts(cd);
  const colors = [['#f9d3d9', '#fffdf9'], ['#d7c8f5', '#fffdf9'], ['#ffe39c', '#fffdf9'], ['#bcd8b4', '#fffdf9']];
  const units = [['d', 'Days'], ['h', 'Hours'], ['m', 'Minutes'], ['s', 'Seconds']];
  return `
  <section class="sec">
    <div class="wrap">
      <p ${R('hand')}>${esc(cd.label || 'Counting the sleeps')}</p>
      <h2 ${R('h2')} data-fit>${dp ? `${esc(dp.weekday)}, ${dp.d} ${esc(dp.month)}` : 'Date coming soon'}</h2>
      ${target !== null ? `<div ${R('blooms-cd')} data-countdown="${target}" data-past-today="It's party day! 🎀" data-past-after="Thank you for celebrating with us!">
        ${units.map(([k, t], i) => `<div class="fl">${flowerSvg(colors[i][0], colors[i][1], 8)}<div><span class="cd-num" data-cd="${k}">–</span><span class="cd-unit">${t}</span></div></div>`).join('')}
      </div>` : ''}
      ${cd.time || cd.description ? `<p ${R('when')}>${[cd.time ? 'Starting at ' + esc(I.fmtClock(cd.time)) : '', esc(cd.description || '')].filter(Boolean).join(' · ')}</p>` : ''}
      ${SPRIG}
    </div>
  </section>`;
}

function places(data) {
  const l = data.locations || {};
  const items = (l.items || []).filter(x => x && (x.name || x.addr || x.label));
  if (l.enabled === false || !items.length) return '';
  return `
  <section class="sec">
    <div class="wrap">
      <p ${R('hand')}>${esc(l.label || 'Where')}</p>
      <h2 ${R('h2')} data-fit>${esc(l.title || 'Come find us')}</h2>
      <div class="cards">
        ${items.map(x => `
          <article ${R('card')}>
            ${x.img ? `<figure>${I.img(x.img, x.name)}</figure>` : ''}
            ${x.label ? `<span class="pill">${esc(x.label)}</span>` : ''}
            ${x.name ? `<h3>${esc(x.name)}</h3>` : ''}
            ${x.addr ? `<p>${I.nl2br(x.addr)}</p>` : ''}
            ${x.time ? `<p class="time">${esc(x.time)}</p>` : ''}
            ${x.url ? `<a class="btn-soft" href="${esc(I.mapHref(x.url))}" target="_blank" rel="noopener">🗺️ Show me the way</a>` : ''}
          </article>`).join('')}
      </div>
    </div>
  </section>`;
}

function plan(data) {
  const t = data.timeline || {};
  const items = (t.items || []).filter(x => x && (x.time || x.title));
  if (t.enabled === false || !items.length) return '';
  return `
  <section class="sec">
    <div class="wrap">
      <p ${R('hand')}>${esc(t.label || 'Party plan')}</p>
      <h2 ${R('h2')} data-fit>${esc(t.title || 'A magical afternoon')}</h2>
      <ol class="vine">
        ${items.map(x => `
          <li ${R()}>
            <span class="bud" aria-hidden="true">${esc(I.stepIcon(x) || '🌸')}</span>
            <div class="box">
              ${x.time ? `<p class="t">${esc(x.time)}</p>` : ''}
              ${x.title ? `<h3>${esc(x.title)}</h3>` : ''}
              ${x.subtitle ? `<p>${esc(x.subtitle)}</p>` : ''}
              ${x.url ? `<p><a href="${esc(I.mapHref(x.url))}" target="_blank" rel="noopener">Map ↗</a></p>` : ''}
            </div>
          </li>`).join('')}
      </ol>
    </div>
  </section>`;
}

function notes(data) {
  const c = data.cover || {}, f = data.families || {}, g = data.gifts || {};
  const fams = (f.enabled !== false ? (f.items || []) : []).filter(x => x && (x.names || x.label));
  const blocks = [];
  if (c.hostText || fams.length || c.hostOutro) {
    blocks.push(`<div ${R('note')}>
      ${c.hostText || fams.length ? `<p class="hand" style="font-size:1.6rem">${esc(f.label || 'Hosted with love by')}</p>` : ''}
      ${c.hostText ? `<h3>${I.nl2br(c.hostText)}</h3>` : ''}
      ${fams.map(x => `<p>${x.label ? esc(x.label) + ' · ' : ''}<b>${esc(x.names || '')}</b></p>`).join('')}
      ${c.hostOutro ? `<p style="margin-top:8px">${I.nl2br(c.hostOutro)}</p>` : ''}
    </div>`);
  }
  (data.customSections || []).filter(s => s && s.enabled !== false && (s.title || s.body)).forEach(s => {
    blocks.push(`<div ${R('note')}>
      ${s.label ? `<p class="hand" style="font-size:1.5rem">${esc(s.label)}</p>` : ''}
      ${s.title ? `<h3>${esc(s.title)}</h3>` : ''}
      ${s.image ? `<figure style="margin:12px 0;border-radius:20px;overflow:hidden">${I.img(s.image, s.title)}</figure>` : ''}
      ${s.body ? `<p>${I.nl2br(s.body)}</p>` : ''}
    </div>`);
  });
  const accounts = (g.items || []).filter(x => x && x.account);
  if (g.enabled !== false && (accounts.length || g.description)) {
    blocks.push(`<div ${R('note')}>
      <p class="hand" style="font-size:1.6rem">${esc(g.label || 'Wish list')}</p>
      <h3>${esc(g.title || 'Birthday wishes')}</h3>
      ${g.description ? `<p>${I.nl2br(g.description)}</p>` : ''}
      ${accounts.map(x => `<div class="wish"><span><b>${esc(x.bank || 'Account')}</b><br>${esc(x.account)}</span><button type="button" class="copy" data-copy="${esc(x.account)}">Copy</button></div>`).join('')}
    </div>`);
  }
  const photos = ((data.gallery || {}).enabled !== false ? ((data.gallery || {}).items || []) : []).filter(x => x && x.url).slice(0, 8);
  if (!blocks.length && !photos.length) return '';
  return `<section class="sec" style="padding-top:0">
    <div class="wrap">
      ${blocks.join('')}
      ${photos.length ? `
        <p ${R('hand')} style="margin-top:40px">${esc(data.gallery.label || 'Our little flower')}</p>
        ${data.gallery.title ? `<h2 ${R('h2')} data-fit>${esc(data.gallery.title)}</h2>` : ''}
        <div class="arches" style="padding-bottom:18px">${photos.map(x => `<figure ${R()}>${I.img(x.url, x.caption || 'Photo')}</figure>`).join('')}</div>` : ''}
    </div>
  </section>`;
}

function ticket(data) {
  const r = data.rsvp || {}, c = data.cover || {};
  if (r.enabled === false) return '';
  const name = I.splitNames(c.names || data.title || '')[0] || '';
  return `
  <section class="sec" id="rsvp">
    <div class="wrap">
      <p ${R('hand')}>Kindly reply</p>
      <div ${R('ticket')}>
        <div class="admit"><span>✿ ${esc(r.label || 'Admit one')}</span><b>${esc(name)}'s party</b></div>
        <h2>${esc(r.title || 'Will you join the tea party?')}</h2>
        ${r.description ? `<p class="desc">${I.nl2br(r.description)}</p>` : ''}
        ${I.rsvpNotes(r).map(n => `<p class="notes">${esc(n)}</p>`).join('')}
        ${I.rsvpForm(r, {
          yes: 'Yes, I’ll be there', no: 'Sadly, no',
          nameLabel: 'Your name', namePlaceholder: 'Your child’s name',
          countLabel: 'How many are coming?', wishesLabel: 'A birthday wish',
          wishesPlaceholder: 'Happy birthday, little one…', button: r.buttonText || 'Send my reply',
          doneTitle: 'Thank you!'
        })}
        ${I.contactHtml(r, { intro: 'Any questions? Ask' })}
      </div>
    </div>
  </section>`;
}

function build(data) {
  const c = data.cover || {};
  const name = c.names || data.title || '';
  document.title = (c.headline || `${name}'s Birthday`) + ' — Invitation';
  document.getElementById('app').innerHTML = [
    c.enabled !== false ? hero(data) : '',
    countdown(data), places(data), plan(data), notes(data), ticket(data),
    `<footer>${SPRIG}<p>Can't wait to celebrate with you!</p></footer>`
  ].join('');
}

Invite.boot(build, DEFAULT_DATA);
</script>
</body>
</html>
