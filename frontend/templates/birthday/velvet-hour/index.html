<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2a1b2d">
<title>Birthday Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Prata: a warm, high-contrast display serif with a beautiful numeral set. Karla: a quiet
     grotesque for everything else. -->
<link href="https://fonts.googleapis.com/css2?family=Prata&family=Karla:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<script src="../../../shared/config.js"></script>
<style>
  /*
   * VELVET HOUR — an adult birthday as a candle-lit dinner or cocktail evening.
   * Aubergine velvet, oxblood and brass. A moody photograph with a huge serif age numeral, a brass
   * ribbon timeline, coaster-style countdown, a reservation card to reply. Elegant and unisex:
   * no glitter, no cartoons, just warm light and good typography.
   */
  :root {
    --velvet:  #2a1b2d;
    --velvet-2:#352339;
    --oxblood: #6c2233;
    --brass:   #c08a4b;
    --brass-2: #e3bd88;
    --blush:   #f3e9e4;
    --cream:   #faf4f0;
    --muted:   rgba(243,233,228,.66);
    --line:    rgba(192,138,75,.35);
    --display: 'Prata', 'Playfair Display', Georgia, serif;
    --sans:    'Karla', 'Helvetica Neue', Arial, sans-serif;
    --pad: clamp(20px, 6vw, 48px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { max-width: 100%; overflow-x: hidden; }
  @supports (overflow: clip) { html, body { overflow-x: clip; } }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body { background: var(--velvet); color: var(--blush); font-family: var(--sans); font-size: 16px; line-height: 1.6; -webkit-tap-highlight-color: transparent; }
  img, video, svg { display: block; max-width: 100%; }
  a { color: inherit; }
  button, input, select, textarea { font: inherit; color: inherit; }

  .wrap { width: min(100%, 940px); margin: 0 auto; padding: 0 var(--pad); }
  .sec { position: relative; padding: clamp(56px, 12vw, 108px) 0; }
  .caps { font-size: .7rem; font-weight: 700; letter-spacing: .28em; text-transform: uppercase; color: var(--brass); }
  .h2 { font-family: var(--display); font-weight: 400; line-height: 1.12; font-size: calc(clamp(1.9rem, 7.5vw, 3rem) * var(--fit, 1)); margin-top: 10px; }
  .h2 i { font-style: italic; color: var(--brass-2); }
  .lead { color: var(--muted); max-width: 46ch; margin-top: 10px; font-size: 1.05rem; }
  .hair { height: 1px; width: 64px; margin: 20px 0; background: linear-gradient(90deg, var(--brass), transparent); }
  .center { text-align: center; } .center .hair, .center .lead { margin-inline: auto; } .center .hair { background: linear-gradient(90deg, transparent, var(--brass), transparent); }

  .rv { opacity: 0; transform: translateY(20px); transition: opacity 1.1s ease, transform 1.2s cubic-bezier(.2,.7,.2,1); }
  .rv.in { opacity: 1; transform: none; }

  /* ── HERO ── */
  .hero { position: relative; min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden;
          padding: calc(env(safe-area-inset-top) + 24px) 0 calc(env(safe-area-inset-bottom) + 40px); }
  .hero-bg { position: absolute; inset: 0; z-index: 0; background: var(--velvet-2); }
  .hero-bg img, .hero-bg video { width: 100%; height: 100%; object-fit: cover; opacity: .85; transform: scale(1.08); transition: transform 5s cubic-bezier(.2,.7,.2,1); }
  .is-ready .hero-bg img, .is-ready .hero-bg video { transform: none; }
  .hero-bg::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(42,27,45,.25) 0%, rgba(42,27,45,.1) 30%, rgba(42,27,45,.7) 60%, var(--velvet) 100%); }
  .hero .wrap { position: relative; z-index: 1; }
  .hero .top { position: absolute; top: calc(env(safe-area-inset-top) + 24px); left: 0; right: 0; z-index: 1; display: flex; justify-content: space-between; gap: 10px; padding: 0 var(--pad); }
  .hero .top .caps { color: var(--brass-2); }
  .age { font-family: var(--display); line-height: .85; font-size: clamp(7rem, 38vw, 14rem); letter-spacing: -.03em; color: var(--blush); }
  .age sup { font-size: .22em; color: var(--brass-2); vertical-align: top; position: relative; top: 1.3em; margin-left: .05em; }
  .name { font-family: var(--display); line-height: 1.05; font-size: calc(clamp(1.9rem, 8vw, 3.4rem) * var(--fit, 1)); margin-top: 8px; }
  .headline { font-style: italic; color: var(--brass-2); font-size: clamp(1.05rem, 4.4vw, 1.3rem); margin-top: 8px; }
  .when { margin-top: 18px; font-size: .78rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--blush); line-height: 1.9; }
  .when span { color: var(--brass); }
  .hero-in > * { opacity: 0; transform: translateY(14px); transition: opacity 1.3s ease, transform 1.3s cubic-bezier(.2,.7,.2,1); }
  .is-ready .hero-in > * { opacity: 1; transform: none; }
  .hero-in > *:nth-child(2) { transition-delay: .25s; } .hero-in > *:nth-child(3) { transition-delay: .45s; } .hero-in > *:nth-child(n+4) { transition-delay: .65s; }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 52px; margin-top: 22px; padding: 0 28px; border-radius: 999px; border: 1px solid var(--brass); color: var(--brass-2);
         font-weight: 700; letter-spacing: .14em; text-transform: uppercase; font-size: .74rem; text-decoration: none; transition: background .4s, color .4s; }
  .btn:hover { background: var(--brass); color: var(--velvet); }
  @media (min-width: 860px) { .hero { justify-content: center; } .hero .wrap { display: grid; grid-template-columns: auto 1fr; gap: 40px; align-items: end; } }

  /* ── THE EVENING (intro) ── */
  .intro-card { max-width: 640px; margin: 0 auto; text-align: center; }
  .intro-card .big { font-family: var(--display); font-size: clamp(1.35rem, 5.4vw, 2rem); line-height: 1.35; }
  .intro-card .big i { color: var(--brass-2); }

  /* ── COASTERS (countdown) on an oxblood band ── */
  .band { background: linear-gradient(135deg, #5b1c2c, var(--oxblood) 45%, #7a2a3c); position: relative; overflow: hidden; }
  .band::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(115deg, rgba(255,255,255,.03) 0 6px, transparent 6px 14px); pointer-events: none; }
  .band .caps { color: var(--brass-2); }
  .coasters { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(8px, 2.6vw, 20px); max-width: 640px; margin: 28px auto 0; }
  .cd-cell { aspect-ratio: 1; min-width: 0; display: grid; place-content: center; text-align: center; border-radius: 50%; border: 1px solid var(--brass); background: rgba(42,27,45,.35);
             box-shadow: inset 0 0 0 5px rgba(42,27,45,.35), inset 0 0 0 6px rgba(192,138,75,.5); }
  .cd-num { display: block; font-family: var(--display); font-size: clamp(1.3rem, 6.4vw, 2.6rem); line-height: 1; color: var(--blush); font-variant-numeric: lining-nums tabular-nums; }
  .cd-unit { display: block; margin-top: 4px; font-size: clamp(.48rem, 2vw, .64rem); font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--brass-2); }
  .cd-note { grid-column: 1 / -1; font-family: var(--display); font-style: italic; font-size: 1.8rem; text-align: center; }
  .band .lead { color: rgba(243,233,228,.8); }

  /* ── THE TABLE (venue) ── */
  .tables { display: grid; gap: 22px; margin-top: 30px; }
  @media (min-width: 760px) { .tables { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); } }
  .table { border-radius: 22px; overflow: hidden; background: var(--velvet-2); border: 1px solid var(--line); }
  .table figure { aspect-ratio: 16 / 9; overflow: hidden; }
  .table figure img { width: 100%; height: 100%; object-fit: cover; }
  .table-body { padding: 22px 22px 26px; }
  .table h3 { font-family: var(--display); font-weight: 400; font-size: clamp(1.4rem, 6vw, 1.8rem); line-height: 1.15; margin-top: 6px; overflow-wrap: anywhere; }
  .table p { color: var(--muted); overflow-wrap: anywhere; }
  .table .time { color: var(--brass-2); font-style: italic; margin-top: 4px; }
  .link { display: inline-flex; align-items: center; min-height: 44px; margin-top: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; font-size: .68rem; color: var(--brass-2); text-decoration: none; border-bottom: 1px solid var(--brass); }

  /* ── RIBBON TIMELINE ── */
  .ribbon { list-style: none; position: relative; max-width: 620px; margin: 30px auto 0; padding-left: 26px; }
  .ribbon::before { content: ''; position: absolute; left: 6px; top: 8px; bottom: 8px; width: 1px; background: linear-gradient(var(--brass), rgba(192,138,75,.2)); }
  .ribbon li { position: relative; padding: 0 0 26px; }
  .ribbon li::before { content: ''; position: absolute; left: -24px; top: 8px; width: 9px; height: 9px; border-radius: 50%; background: var(--brass); box-shadow: 0 0 0 4px var(--velvet); }
  .ribbon .t { font-size: .72rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--brass-2); }
  .ribbon h3 { font-family: var(--display); font-weight: 400; font-size: 1.35rem; line-height: 1.25; margin-top: 2px; overflow-wrap: anywhere; }
  .ribbon p { color: var(--muted); }
  .ribbon a { color: var(--brass-2); }

  /* ── NOTES / GALLERY ── */
  .notes { display: grid; gap: 18px; margin-top: 30px; }
  @media (min-width: 760px) { .notes { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); } }
  .note { padding: 26px 24px; border-radius: 22px; background: linear-gradient(160deg, rgba(108,34,51,.45), rgba(53,35,57,.6)); border: 1px solid var(--line); }
  .note h3 { font-family: var(--display); font-weight: 400; font-size: 1.5rem; line-height: 1.2; margin-top: 6px; overflow-wrap: anywhere; }
  .note p { color: var(--muted); margin-top: 8px; }
  .note figure { margin: 12px 0; border-radius: 14px; overflow: hidden; }
  .acct { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  .acct span { overflow-wrap: anywhere; }
  .copy { min-height: 40px; padding: 0 16px; border: 1px solid var(--brass); border-radius: 999px; background: transparent; color: var(--brass-2); font-weight: 700; font-size: .8rem; cursor: pointer; }
  .years { columns: 2; column-gap: 12px; margin-top: 30px; }
  @media (min-width: 760px) { .years { columns: 3; } }
  .years figure { break-inside: avoid; margin-bottom: 12px; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
  .years img { width: 100%; height: auto; }

  /* ── RESERVATION CARD (RSVP) ── */
  .card { max-width: 580px; margin: 30px auto 0; border-radius: 22px; overflow: hidden; background: var(--cream); color: #2b1d2e; box-shadow: 0 40px 80px rgba(0,0,0,.35); }
  .card-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 24px; background: var(--oxblood); color: var(--blush); }
  .card-top .caps { color: var(--brass-2); }
  .card-top .ini { font-family: var(--display); font-size: 1.1rem; letter-spacing: .06em; }
  .card-body { padding: clamp(24px, 6vw, 36px); }
  .card h2 { font-family: var(--display); font-weight: 400; font-size: clamp(1.7rem, 7vw, 2.4rem); line-height: 1.12; }
  .card .desc { color: rgba(43,29,46,.7); margin-top: 8px; }
  .card .notes-line { margin-top: 8px; font-size: .7rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--oxblood); }
  .rsvp { display: grid; gap: 16px; margin-top: 22px; }
  .rsvp-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .rsvp-choice { position: relative; display: flex; align-items: center; justify-content: center; text-align: center; min-height: 54px; padding: 8px 10px; border-radius: 999px; cursor: pointer;
                 border: 1px solid var(--oxblood); color: var(--oxblood); font-weight: 700; font-size: .9rem; line-height: 1.15; transition: background .3s, color .3s; }
  .rsvp-choice input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .rsvp-choice.on { background: var(--oxblood); color: var(--blush); }
  .rsvp-choice:focus-within { outline: 2px solid var(--brass); outline-offset: 3px; }
  .rsvp-field { display: grid; gap: 2px; }
  .rsvp-label { font-size: .68rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: rgba(43,29,46,.6); }
  .rsvp-input { width: 100%; min-height: 48px; padding: 8px 0; border: 0; border-bottom: 1px solid rgba(43,29,46,.35); border-radius: 0; background: transparent; color: #2b1d2e; font-size: 16px; }
  textarea.rsvp-input { resize: none; min-height: 72px; }
  .rsvp-input::placeholder { color: rgba(43,29,46,.4); }
  .rsvp-input:focus { outline: none; border-bottom-color: var(--oxblood); }
  .rsvp-error { color: #a12b3f; font-weight: 700; }
  .rsvp-submit { min-height: 56px; margin-top: 6px; border: 0; border-radius: 999px; cursor: pointer; background: var(--velvet); color: var(--brass-2); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; font-size: .76rem; transition: background .3s; }
  .rsvp-submit:hover { background: var(--oxblood); }
  .rsvp-done { margin-top: 22px; text-align: center; }
  .rsvp-done-title { font-family: var(--display); font-size: 1.9rem; color: var(--oxblood); }
  .rsvp-done-body { color: rgba(43,29,46,.7); margin-top: 6px; }
  .contact { margin-top: 26px; padding-top: 18px; border-top: 1px solid rgba(43,29,46,.15); text-align: center; }
  .contact-intro { font-size: .68rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: rgba(43,29,46,.6); }
  .contact-name { font-family: var(--display); font-size: 1.25rem; color: #2b1d2e; }
  .contact-phone { color: rgba(43,29,46,.7); }
  .contact-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 10px; }
  .contact-link { display: inline-flex; align-items: center; min-height: 42px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--oxblood); color: var(--oxblood); font-weight: 700; font-size: .8rem; text-decoration: none; }

  footer { text-align: center; padding: 30px var(--pad) calc(env(safe-area-inset-bottom) + 70px); }
  footer .ini { display: inline-grid; place-items: center; width: 64px; height: 64px; border-radius: 50%; border: 1px solid var(--brass); font-family: var(--display); color: var(--brass-2); font-size: 1.2rem; }
  footer p { color: var(--muted); margin-top: 12px; font-style: italic; }

  @media (prefers-reduced-motion: reduce) {
    .rv, .hero-in > * { opacity: 1; transform: none; transition: none; }
    .hero-bg img, .hero-bg video { transform: none; transition: none; }
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>
<main id="app"></main>

<script src="../../../shared/demo-data.js"></script>
<script src="../../../shared/invitation-core.js"></script>
<script src="../../../shared/invitation-music.js" defer></script>
<script src="../../../shared/rsvp-guest-picker.js" defer></script>
<script>
const A = '/assets/velvet-hour/';
const DEFAULT_DATA = {
  template: 'velvet-hour',
  title: 'Name',
  cover: {
    enabled: true, headline: 'An evening to celebrate', eventLabel: '50', names: 'Name',
    tagline: 'Good food, low light and the people who matter.', greeting: 'Dear',
    hostIntro: 'You are invited to', hostOutro: '', hostText: '', image: A + 'candles.jpg', video: '', buttonText: 'Reserve your seat'
  },
  countdown: { enabled: true, label: 'Until we raise a glass', date: '', time: '', tzOffset: null, description: '', image: '' },
  families:  { enabled: false, label: 'Hosted by', title: '', items: [] },
  locations: { enabled: true, label: 'The table', title: 'Where we gather', image: '', items: [
    { label: 'Dinner', time: '', name: '', addr: '', url: '', img: A + 'table.jpg' }
  ] },
  timeline:  { enabled: true, label: 'The evening', title: 'How the night unfolds', items: [] },
  gallery:   { enabled: false, label: 'Through the years', title: 'A few favourites', items: [] },
  gifts:     { enabled: false, label: 'Gifts', title: 'No gifts, please', description: '', image: '', items: [] },
  rsvp: {
    enabled: true, label: 'Reservation', title: 'Will you join the table?', description: '',
    deadline: '', maxPeople: 2, buttonText: 'Confirm reservation', allowWishes: true, image: '',
    contactName: '', contactPhone: '', contactLink: ''
  },
  memories: { enabled: false, title: '', description: '', url: '', buttonText: '' },
  music:    { enabled: false, url: '', autoplay: true },
  customSections: []
};

const I = Invite, esc = I.esc;
const R = (cls, extra) => `class="${cls ? cls + ' ' : ''}rv"${extra ? ' ' + extra : ''}`;

function hero(data) {
  const c = data.cover || {}, cd = data.countdown || {};
  const name = c.names || data.title || '';
  const age = I.numberIn(c.eventLabel);
  const suffix = age ? I.ordinal(age).slice(age.length) : '';
  const dp = I.dateParts(cd);
  const place = ((data.locations || {}).items || []).find(x => x && x.name);
  const guest = I.guestName();
  const bg = I.media(c.image, c.video, '', true);
  return `
  <section class="hero">
    ${bg ? `<div class="hero-bg">${bg}</div>` : ''}
    <div class="top"><span class="caps">${guest ? `${esc(c.greeting || 'Dear')} ${esc(guest)}` : esc(c.hostIntro || 'You are invited to')}</span><span class="caps">${dp ? `${I.pad2(dp.d)} · ${I.pad2(dp.mo)} · ${dp.y}` : ''}</span></div>
    <div class="wrap">
      ${age ? `<p class="age" aria-label="${esc(I.ordinal(age))} birthday">${esc(age)}<sup>${esc(suffix)}</sup></p>` : ''}
      <div class="hero-in">
        <h1 class="name" data-fit=".45">${esc(name)}</h1>
        ${c.headline ? `<p class="headline">${esc(c.headline)}</p>` : ''}
        <p class="when">${dp ? `${esc(dp.weekday)}, ${dp.d} ${esc(dp.month)}` : 'Date to follow'}${cd.time ? ` <span>·</span> ${esc(I.fmtClock(cd.time))}` : ''}${place ? `<br><span>${esc(place.name)}</span>` : ''}</p>
        <div><a class="btn" href="#rsvp">${esc(c.buttonText || 'Reserve your seat')}</a></div>
      </div>
    </div>
  </section>`;
}

function intro(data) {
  const c = data.cover || {}, f = data.families || {};
  const fams = (f.enabled !== false ? (f.items || []) : []).filter(x => x && (x.names || x.label));
  if (!c.tagline && !c.hostText && !fams.length && !c.hostOutro) return '';
  return `
  <section class="sec center">
    <div class="wrap intro-card">
      ${c.tagline ? `<p ${R('big')}>${esc(c.tagline)}</p>` : ''}
      ${c.hostText ? `<p ${R('lead')}>${I.nl2br(c.hostText)}</p>` : ''}
      ${fams.length ? `<div ${R()} style="margin-top:18px"><p class="caps">${esc(f.label || 'Hosted by')}</p>${fams.map(x => `<p style="font-family:var(--display);font-size:1.2rem;margin-top:6px">${esc(x.names || '')}${x.label ? ` <span style="color:var(--muted);font-family:var(--sans);font-size:.9rem">· ${esc(x.label)}</span>` : ''}</p>`).join('')}</div>` : ''}
      ${c.hostOutro ? `<p ${R('lead')} style="margin-top:14px">${I.nl2br(c.hostOutro)}</p>` : ''}
      <div class="hair" aria-hidden="true"></div>
    </div>
  </section>`;
}

function countdown(data) {
  const cd = data.countdown || {};
  if (cd.enabled === false) return '';
  const target = I.eventInstant(cd);
  const dp = I.dateParts(cd);
  return `
  <section class="sec band center">
    <div class="wrap">
      <p ${R('caps')}>${esc(cd.label || 'Until we raise a glass')}</p>
      <h2 ${R('h2')} data-fit>${dp ? `${esc(dp.weekday)}, <i>${esc(I.ordinal(dp.d))} ${esc(dp.month)}</i>` : 'A date to <i>remember</i>'}</h2>
      ${target !== null ? `<div ${R('coasters')} data-countdown="${target}" data-past-today="Tonight. See you at the table." data-past-after="What a night. Thank you.">${I.countdownCells({ m: 'Mins', s: 'Secs' })}</div>` : ''}
      ${cd.time || cd.description ? `<p ${R('lead')} style="margin-top:22px">${[cd.time ? 'From ' + esc(I.fmtClock(cd.time)) : '', esc(cd.description || '')].filter(Boolean).join(' · ')}</p>` : ''}
    </div>
  </section>`;
}

function tables(data) {
  const l = data.locations || {};
  const items = (l.items || []).filter(x => x && (x.name || x.addr || x.label));
  if (l.enabled === false || !items.length) return '';
  return `
  <section class="sec">
    <div class="wrap">
      <p ${R('caps')}>${esc(l.label || 'The table')}</p>
      <h2 ${R('h2')} data-fit>${esc(l.title || 'Where we gather')}</h2>
      <div class="tables">
        ${items.map(x => `
          <article ${R('table')}>
            ${x.img ? `<figure>${I.img(x.img, x.name)}</figure>` : ''}
            <div class="table-body">
              ${x.label ? `<p class="caps">${esc(x.label)}</p>` : ''}
              ${x.name ? `<h3>${esc(x.name)}</h3>` : ''}
              ${x.addr ? `<p>${I.nl2br(x.addr)}</p>` : ''}
              ${x.time ? `<p class="time">${esc(x.time)}</p>` : ''}
              ${x.url ? `<a class="link" href="${esc(I.mapHref(x.url))}" target="_blank" rel="noopener">Directions</a>` : ''}
            </div>
          </article>`).join('')}
      </div>
    </div>
  </section>`;
}

function evening(data) {
  const t = data.timeline || {};
  const items = (t.items || []).filter(x => x && (x.time || x.title));
  if (t.enabled === false || !items.length) return '';
  return `
  <section class="sec" style="padding-top:0">
    <div class="wrap">
      <p ${R('caps')}>${esc(t.label || 'The evening')}</p>
      <h2 ${R('h2')} data-fit>${esc(t.title || 'How the night unfolds')}</h2>
      <ol class="ribbon">
        ${items.map(x => `
          <li ${R()}>
            ${x.time ? `<p class="t">${esc(x.time)}</p>` : ''}
            <h3>${esc(x.title || '')}</h3>
            ${x.subtitle ? `<p>${esc(x.subtitle)}</p>` : ''}
            ${x.url ? `<p><a href="${esc(I.mapHref(x.url))}" target="_blank" rel="noopener">Directions</a></p>` : ''}
          </li>`).join('')}
      </ol>
    </div>
  </section>`;
}

function notes(data) {
  const g = data.gifts || {}, gl = data.gallery || {};
  const cards = [];
  (data.customSections || []).filter(s => s && s.enabled !== false && (s.title || s.body)).forEach(s => cards.push(`
    <div ${R('note')}>
      ${s.label ? `<p class="caps">${esc(s.label)}</p>` : ''}
      ${s.title ? `<h3>${esc(s.title)}</h3>` : ''}
      ${s.image ? `<figure>${I.img(s.image, s.title)}</figure>` : ''}
      ${s.body ? `<p>${I.nl2br(s.body)}</p>` : ''}
    </div>`));
  const accounts = (g.items || []).filter(x => x && x.account);
  if (g.enabled !== false && (accounts.length || g.description)) cards.push(`
    <div ${R('note')}>
      <p class="caps">${esc(g.label || 'Gifts')}</p>
      <h3>${esc(g.title || 'Gifts')}</h3>
      ${g.description ? `<p>${I.nl2br(g.description)}</p>` : ''}
      ${accounts.map(x => `<div class="acct"><span><b>${esc(x.bank || 'Account')}</b> · ${esc(x.account)}</span><button type="button" class="copy" data-copy="${esc(x.account)}">Copy</button></div>`).join('')}
    </div>`);
  const photos = (gl.enabled !== false ? (gl.items || []) : []).filter(x => x && x.url).slice(0, 9);
  if (!cards.length && !photos.length) return '';
  return `
  <section class="sec" style="padding-top:0">
    <div class="wrap">
      ${cards.length ? `<div class="notes">${cards.join('')}</div>` : ''}
      ${photos.length ? `
        <div style="margin-top:${cards.length ? 60 : 0}px"><p ${R('caps')}>${esc(gl.label || 'Through the years')}</p>
        ${gl.title ? `<h2 ${R('h2')} data-fit>${esc(gl.title)}</h2>` : ''}</div>
        <div class="years">${photos.map(x => `<figure ${R()}>${I.img(x.url, x.caption || 'Photo')}</figure>`).join('')}</div>` : ''}
    </div>
  </section>`;
}

function reservation(data) {
  const r = data.rsvp || {}, c = data.cover || {};
  if (r.enabled === false) return '';
  return `
  <section class="sec" id="rsvp" style="padding-top:0">
    <div class="wrap">
      <div ${R('card')}>
        <div class="card-top"><span class="caps">${esc(r.label || 'Reservation')}</span><span class="ini">${esc(I.initials(c.names || data.title) || '')}</span></div>
        <div class="card-body">
          <h2>${esc(r.title || 'Will you join the table?')}</h2>
          ${r.description ? `<p class="desc">${I.nl2br(r.description)}</p>` : ''}
          ${I.rsvpNotes(r).map(n => `<p class="notes-line">${esc(n)}</p>`).join('')}
          ${I.rsvpForm(r, {
            yes: 'Reserve my seat', no: 'Send my regrets',
            nameLabel: 'Reservation under', namePlaceholder: 'Your full name',
            countLabel: 'Seats', wishesLabel: 'A message (optional)',
            wishesPlaceholder: 'Many happy returns…', button: r.buttonText || 'Confirm reservation',
            doneTitle: 'Reservation received'
          })}
          ${I.contactHtml(r, { intro: 'Questions' })}
        </div>
      </div>
    </div>
  </section>`;
}

function build(data) {
  const c = data.cover || {};
  const name = c.names || data.title || '';
  document.title = (c.headline ? `${name} — ${c.headline}` : `${name}'s Birthday`) + ' — Invitation';
  document.getElementById('app').innerHTML = [
    c.enabled !== false ? hero(data) : '',
    intro(data), countdown(data), tables(data), evening(data), notes(data), reservation(data),
    `<footer><span class="ini">${esc(I.initials(name) || '✦')}</span><p>Thank you for celebrating with ${esc(I.splitNames(name)[0] || name)}.</p></footer>`
  ].join('');
}

Invite.boot(build, DEFAULT_DATA);
</script>
</body>
</html>
