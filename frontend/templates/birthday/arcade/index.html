<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#141230">
<title>Birthday Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Press Start 2P: the 8-bit arcade face, used sparingly for labels and scores. Rubik: a round,
     friendly sans that stays readable at speed. -->
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="../../../shared/config.js"></script>
<style>
  /*
   * ARCADE — a retro video-game birthday party.
   * A midnight cabinet screen with pixel stars and faint scanlines, the age as a LEVEL, a pixel
   * cake, a high-score countdown, "stage select" venue cards, the plan as levels with a progress
   * bar, and an INSERT COIN reply panel with arcade buttons. Loud, fast and fun.
   */
  :root {
    --night:  #141230;
    --panel:  #1e1b45;
    --panel-2:#26235a;
    --magenta:#ff2fb3;
    --cyan:   #22e6ff;
    --yellow: #ffe14d;
    --lime:   #7dff5a;
    --white:  #f6f4ff;
    --muted:  rgba(246,244,255,.68);
    --pixel:  'Press Start 2P', 'Courier New', monospace;
    --sans:   'Rubik', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --pad: clamp(18px, 5.5vw, 44px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { max-width: 100%; overflow-x: hidden; }
  @supports (overflow: clip) { html, body { overflow-x: clip; } }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body { background: var(--night); color: var(--white); font-family: var(--sans); font-size: 16px; line-height: 1.55; -webkit-tap-highlight-color: transparent; }
  img, video, svg { display: block; max-width: 100%; }
  a { color: inherit; }
  button, input, select, textarea { font: inherit; color: inherit; }

  /* Screen: pixel stars (one small tiled gradient) and faint scanlines, both static. */
  .screen { position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(2px 2px at 20px 30px, rgba(255,255,255,.7) 50%, transparent 51%),
      radial-gradient(2px 2px at 90px 120px, rgba(34,230,255,.7) 50%, transparent 51%),
      radial-gradient(2px 2px at 160px 60px, rgba(255,255,255,.5) 50%, transparent 51%),
      radial-gradient(2px 2px at 220px 170px, rgba(255,47,179,.7) 50%, transparent 51%),
      radial-gradient(2px 2px at 60px 200px, rgba(255,225,77,.7) 50%, transparent 51%),
      radial-gradient(2px 2px at 260px 20px, rgba(255,255,255,.5) 50%, transparent 51%);
    background-size: 300px 240px; }
  .screen::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(0,0,0,.14) 0 2px, transparent 2px 4px); }

  .wrap { width: min(100%, 1000px); margin: 0 auto; padding: 0 var(--pad); }
  .sec { position: relative; padding: clamp(50px, 11vw, 96px) 0; }
  .px { font-family: var(--pixel); font-size: clamp(.58rem, 2.6vw, .78rem); line-height: 1.9; letter-spacing: .02em; }
  .px.c { color: var(--cyan); } .px.m { color: var(--magenta); } .px.y { color: var(--yellow); } .px.l { color: var(--lime); }
  .h2 { font-family: var(--pixel); line-height: 1.35; font-size: calc(clamp(1.05rem, 5vw, 1.9rem) * var(--fit, 1)); color: var(--white); margin-top: 10px; text-shadow: 3px 3px 0 var(--magenta); }
  .blink { animation: blink 1.1s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }
  .box { background: var(--panel); border: 4px solid var(--white); box-shadow: 6px 6px 0 var(--magenta); }
  .box.c { box-shadow: 6px 6px 0 var(--cyan); } .box.y { box-shadow: 6px 6px 0 var(--yellow); } .box.l { box-shadow: 6px 6px 0 var(--lime); }

  .rv { opacity: 0; transform: translateY(20px); transition: opacity .5s steps(5), transform .5s steps(5); }
  .rv.in { opacity: 1; transform: none; }

  /* ── HERO ── */
  .hero { position: relative; min-height: 100vh; min-height: 100svh; display: grid; align-items: center; overflow: hidden; padding: calc(env(safe-area-inset-top) + 26px) 0 40px; }
  .hero-grid { display: grid; gap: 26px; text-align: center; }
  .ready { display: inline-flex; gap: 10px; align-items: center; }
  .level { font-family: var(--pixel); color: var(--yellow); font-size: clamp(1.3rem, 7vw, 2.8rem); line-height: 1.3; text-shadow: 4px 4px 0 var(--magenta); margin-top: 14px; }
  .name { font-family: var(--sans); font-weight: 900; text-transform: uppercase; letter-spacing: -.01em; line-height: .95; font-size: calc(clamp(2.8rem, 14vw, 6.4rem) * var(--fit, 1)); margin-top: 10px;
          background: linear-gradient(180deg, #fff 0 45%, var(--cyan) 46% 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero-tag { color: var(--muted); max-width: 34ch; margin: 12px auto 0; font-size: 1.05rem; }
  .facts { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 20px; }
  .facts span { display: inline-flex; align-items: center; min-height: 38px; padding: 0 12px; background: var(--panel-2); border: 2px solid var(--cyan); font-family: var(--pixel); font-size: .55rem; max-width: 100%; }
  .start { display: inline-flex; align-items: center; justify-content: center; min-height: 56px; margin-top: 24px; padding: 0 26px; background: var(--magenta); color: var(--white); text-decoration: none;
           font-family: var(--pixel); font-size: .72rem; border: 4px solid var(--white); box-shadow: 6px 6px 0 var(--cyan); transition: transform .1s, box-shadow .1s; }
  .start:active { transform: translate(4px, 4px); box-shadow: 2px 2px 0 var(--cyan); }
  .cake { width: min(56vw, 250px); margin: 0 auto; image-rendering: pixelated; animation: bob 2.4s steps(4) infinite; }
  @keyframes bob { 50% { transform: translateY(-8px); } }
  .cake .flame { animation: flick .5s steps(2) infinite; transform-origin: center bottom; }
  @keyframes flick { 50% { transform: scaleY(.7) translateY(2px); } }
  .photo { position: relative; width: min(56vw, 250px); margin: 0 auto; aspect-ratio: 1; overflow: hidden; border: 4px solid var(--white); box-shadow: 8px 8px 0 var(--cyan); }
  .photo img, .photo video { width: 100%; height: 100%; object-fit: cover; }
  .photo::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 2px, transparent 2px 4px); pointer-events: none; }
  .hero-in > * { opacity: 0; transition: opacity .3s steps(3); }
  .is-ready .hero-in > * { opacity: 1; }
  .hero-in > *:nth-child(2) { transition-delay: .25s; } .hero-in > *:nth-child(3) { transition-delay: .5s; } .hero-in > *:nth-child(n+4) { transition-delay: .75s; }
  @media (min-width: 860px) { .hero-grid { grid-template-columns: 1fr 1fr; text-align: left; align-items: center; } .hero-grid .art { order: 2; } .hero-tag { margin-left: 0; } .facts { justify-content: flex-start; } }

  /* ── HIGH SCORE (countdown) ── */
  .score { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(6px, 2vw, 14px); margin-top: 26px; }
  .cd-cell { min-width: 0; padding: clamp(12px, 3.5vw, 22px) 4px; text-align: center; background: var(--panel); border: 3px solid var(--cyan); }
  .cd-cell:nth-child(2) { border-color: var(--magenta); } .cd-cell:nth-child(3) { border-color: var(--yellow); } .cd-cell:nth-child(4) { border-color: var(--lime); }
  .cd-num { display: block; font-family: var(--pixel); font-size: clamp(.95rem, 5.4vw, 2.2rem); line-height: 1.2; color: var(--white); }
  .cd-unit { display: block; margin-top: 8px; font-family: var(--pixel); font-size: clamp(.4rem, 1.8vw, .6rem); color: var(--muted); }
  .cd-note { grid-column: 1 / -1; font-family: var(--pixel); font-size: clamp(.9rem, 4vw, 1.5rem); color: var(--yellow); line-height: 1.5; text-align: center; }
  .cd-meta { margin-top: 16px; color: var(--muted); }

  /* ── STAGE SELECT (venues) ── */
  .stages { display: grid; gap: 26px; margin-top: 30px; }
  @media (min-width: 760px) { .stages { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); } }
  .stage { padding: 22px 20px 24px; }
  .stage figure { margin: -22px -20px 18px; aspect-ratio: 16 / 9; overflow: hidden; border-bottom: 4px solid var(--white); }
  .stage figure img { width: 100%; height: 100%; object-fit: cover; }
  .stage h3 { font-weight: 900; text-transform: uppercase; font-size: clamp(1.4rem, 6vw, 1.9rem); line-height: 1.05; margin-top: 8px; overflow-wrap: anywhere; }
  .stage p { color: var(--muted); overflow-wrap: anywhere; }
  .stage .time { color: var(--yellow); font-weight: 700; }
  .go { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; margin-top: 12px; padding: 0 14px; background: var(--cyan); color: var(--night); font-family: var(--pixel); font-size: .55rem; text-decoration: none; border: 3px solid var(--white); }

  /* ── LEVELS (plan) ── */
  .levels { list-style: none; display: grid; gap: 14px; margin-top: 30px; }
  .lvl { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; align-items: center; padding: 16px 18px; background: var(--panel); border-left: 6px solid var(--lime); }
  .lvl:nth-child(4n+2) { border-color: var(--cyan); } .lvl:nth-child(4n+3) { border-color: var(--magenta); } .lvl:nth-child(4n) { border-color: var(--yellow); }
  .lvl .n { font-family: var(--pixel); font-size: .6rem; color: var(--yellow); line-height: 1.6; }
  .lvl .t { font-family: var(--pixel); font-size: .6rem; color: var(--cyan); }
  .lvl h3 { font-weight: 700; font-size: 1.15rem; line-height: 1.2; overflow-wrap: anywhere; }
  .lvl h3 .ic { font-family: 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif; margin-right: 6px; }
  .lvl p { color: var(--muted); font-size: .95rem; grid-column: 2; }
  .lvl a { color: var(--cyan); }
  .bar { grid-column: 1 / -1; height: 10px; background: var(--night); border: 2px solid var(--white); }
  .bar i { display: block; height: 100%; width: var(--w); background: repeating-linear-gradient(90deg, var(--lime) 0 8px, transparent 8px 10px); }

  /* ── POWER-UPS (notes, gifts) & GALLERY ── */
  .notes { display: grid; gap: 26px; margin-top: 30px; }
  @media (min-width: 760px) { .notes { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); } }
  .note { padding: 22px 20px; }
  .note h3 { font-weight: 900; text-transform: uppercase; font-size: 1.4rem; line-height: 1.1; margin-top: 6px; overflow-wrap: anywhere; }
  .note p { color: var(--muted); margin-top: 8px; }
  .note figure { margin: 12px 0; border: 3px solid var(--white); }
  .acct { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-top: 12px; padding-top: 10px; border-top: 2px dashed rgba(246,244,255,.3); }
  .acct span { overflow-wrap: anywhere; }
  .copy { min-height: 38px; padding: 0 12px; border: 3px solid var(--white); background: var(--yellow); color: var(--night); font-family: var(--pixel); font-size: .5rem; cursor: pointer; }
  .frames { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(12px, 3vw, 22px); margin-top: 30px; }
  @media (min-width: 760px) { .frames { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .frames figure { aspect-ratio: 1; overflow: hidden; border: 4px solid var(--white); box-shadow: 6px 6px 0 var(--magenta); }
  .frames figure:nth-child(2n) { box-shadow: 6px 6px 0 var(--cyan); }
  .frames img { width: 100%; height: 100%; object-fit: cover; }

  /* ── INSERT COIN (RSVP) ── */
  .coin-sec { background: linear-gradient(180deg, transparent, rgba(255,47,179,.12)); }
  .cabinet { max-width: 600px; margin: 30px auto 0; padding: clamp(22px, 6vw, 36px); background: var(--panel); border: 4px solid var(--white); box-shadow: 8px 8px 0 var(--yellow); }
  .cabinet h2 { font-family: var(--pixel); font-size: clamp(1rem, 4.6vw, 1.5rem); line-height: 1.4; color: var(--yellow); }
  .cabinet .desc { color: var(--muted); margin-top: 10px; }
  .cabinet .notes-line { margin-top: 8px; font-family: var(--pixel); font-size: .52rem; color: var(--cyan); line-height: 1.8; }
  .rsvp { display: grid; gap: 16px; margin-top: 22px; }
  .rsvp-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .rsvp-choice { position: relative; display: flex; align-items: center; justify-content: center; gap: 10px; text-align: center; min-height: 64px; padding: 8px 10px; cursor: pointer;
                 background: var(--panel-2); border: 3px solid var(--white); font-weight: 700; line-height: 1.15; transition: background .15s, transform .1s; }
  .rsvp-choice::before { content: ''; flex: none; width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ff8ad1, var(--magenta) 60%); box-shadow: 0 3px 0 #8a0f5c, inset 0 -3px 0 rgba(0,0,0,.3); }
  .rsvp-choice:nth-child(2)::before { background: radial-gradient(circle at 35% 30%, #9af1ff, var(--cyan) 60%); box-shadow: 0 3px 0 #0c8ea3, inset 0 -3px 0 rgba(0,0,0,.3); }
  .rsvp-choice input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .rsvp-choice.on { background: var(--white); color: var(--night); }
  .rsvp-choice.on::before { transform: translateY(2px); box-shadow: 0 1px 0 #8a0f5c, inset 0 -2px 0 rgba(0,0,0,.3); }
  .rsvp-choice:focus-within { outline: 3px solid var(--yellow); outline-offset: 3px; }
  .rsvp-field { display: grid; gap: 6px; }
  .rsvp-label { font-family: var(--pixel); font-size: .52rem; color: var(--cyan); line-height: 1.6; }
  .rsvp-input { width: 100%; min-height: 52px; padding: 12px 14px; border: 3px solid var(--white); border-radius: 0; background: var(--night); color: var(--white); font-size: 16px; }
  textarea.rsvp-input { resize: none; min-height: 90px; }
  .rsvp-input::placeholder { color: rgba(246,244,255,.4); }
  .rsvp-input:focus { outline: none; border-color: var(--yellow); box-shadow: 4px 4px 0 var(--yellow); }
  .rsvp-error { color: var(--yellow); font-weight: 700; }
  .rsvp-submit { min-height: 60px; border: 4px solid var(--white); cursor: pointer; background: var(--lime); color: var(--night); font-family: var(--pixel); font-size: .74rem; box-shadow: 6px 6px 0 var(--magenta); transition: transform .1s, box-shadow .1s; }
  .rsvp-submit:active { transform: translate(4px, 4px); box-shadow: 2px 2px 0 var(--magenta); }
  .rsvp-done { margin-top: 22px; text-align: center; }
  .rsvp-done-title { font-family: var(--pixel); font-size: clamp(.95rem, 4.4vw, 1.4rem); line-height: 1.5; color: var(--lime); }
  .rsvp-done-body { color: var(--muted); margin-top: 8px; }
  .contact { margin-top: 24px; padding-top: 18px; border-top: 2px dashed rgba(246,244,255,.3); text-align: center; }
  .contact-intro { font-family: var(--pixel); font-size: .5rem; color: var(--cyan); line-height: 1.8; }
  .contact-name { font-weight: 900; font-size: 1.3rem; }
  .contact-phone { color: var(--muted); }
  .contact-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 10px; }
  .contact-link { display: inline-flex; align-items: center; min-height: 42px; padding: 0 14px; border: 3px solid var(--white); background: var(--panel-2); font-family: var(--pixel); font-size: .5rem; text-decoration: none; }

  footer { text-align: center; padding: 30px var(--pad) calc(env(safe-area-inset-bottom) + 70px); }
  footer p { font-family: var(--pixel); font-size: .62rem; line-height: 2; color: var(--muted); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
    .rv, .hero-in > * { opacity: 1; transform: none; transition: none; }
    .blink { visibility: visible; }
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>
<div class="screen" aria-hidden="true"></div>
<main id="app"></main>

<script src="../../../shared/demo-data.js"></script>
<script src="../../../shared/invitation-core.js"></script>
<script src="../../../shared/invitation-music.js" defer></script>
<script src="../../../shared/rsvp-guest-picker.js" defer></script>
<script>
const DEFAULT_DATA = {
  template: 'arcade',
  title: 'Name',
  cover: {
    enabled: true, headline: '', eventLabel: '9', names: 'Name',
    tagline: 'Insert coin for the most fun birthday party ever!', greeting: 'Hey',
    hostIntro: '', hostOutro: '', hostText: '', image: '', video: '', buttonText: 'Press start'
  },
  countdown: { enabled: true, label: 'High score', date: '', time: '', tzOffset: null, description: '', image: '' },
  families:  { enabled: false, label: 'Player 2', title: '', items: [] },
  locations: { enabled: true, label: 'Stage select', title: 'Where we play', image: '', items: [
    { label: 'The party', time: '', name: '', addr: '', url: '', img: '' }
  ] },
  timeline:  { enabled: true, label: 'Levels', title: 'How the game goes', items: [] },
  gallery:   { enabled: false, label: 'Gallery', title: 'Best screenshots', items: [] },
  gifts:     { enabled: false, label: 'Power-ups', title: 'Gift ideas', description: '', image: '', items: [] },
  rsvp: {
    enabled: true, label: 'Insert coin', title: 'Are you playing?', description: '',
    deadline: '', maxPeople: 10, buttonText: 'Start', allowWishes: true, image: '',
    contactName: '', contactPhone: '', contactLink: ''
  },
  memories: { enabled: false, title: '', description: '', url: '', buttonText: '' },
  music:    { enabled: false, url: '', autoplay: true },
  customSections: []
};

const I = Invite, esc = I.esc;
const R = (cls, extra) => `class="${cls ? cls + ' ' : ''}rv"${extra ? ' ' + extra : ''}`;

/** A pixel-art cake on a 16 x 16 grid: each character is one pixel. */
const CAKE = (() => {
  const P = { w: '#fff', p: '#ff2fb3', y: '#ffe14d', c: '#22e6ff', b: '#6b3a2a', k: '#141230', l: '#7dff5a', o: '#ff8c42' };
  const rows = [
    '......y..y......', '......o..o......', '......w..w......',
    '....pppppppp....', '...pwpwpwpwpp...', '...pppppppppp...',
    '..wwwwwwwwwwww..', '..wcwcwcwcwcww..', '..wwwwwwwwwwww..',
    '.pppppppppppppp.', '.pwpwpwpwpwpwpp.', '.pppppppppppppp.',
    '.pppppppppppppp.', 'bbbbbbbbbbbbbbbb', '.bbbbbbbbbbbbbb.', '................'
  ];
  let s = '';
  rows.forEach((r, y) => [...r].forEach((ch, x) => { if (ch !== '.') s += `<rect class="${y < 2 ? 'flame' : ''}" x="${x}" y="${y}" width="1" height="1" fill="${P[ch]}"/>`; }));
  return `<svg class="cake" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">${s}</svg>`;
})();
const COIN = `<svg viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges" aria-hidden="true"><rect x="4" y="1" width="8" height="1" fill="#ffe14d"/><rect x="2" y="2" width="12" height="1" fill="#ffe14d"/><rect x="1" y="3" width="14" height="10" fill="#ffe14d"/><rect x="2" y="13" width="12" height="1" fill="#ffe14d"/><rect x="4" y="14" width="8" height="1" fill="#ffe14d"/><rect x="6" y="4" width="4" height="8" fill="#d9a500"/><rect x="7" y="5" width="2" height="6" fill="#ffe14d"/></svg>`;

function hero(data) {
  const c = data.cover || {}, cd = data.countdown || {};
  const name = c.names || data.title || '';
  const age = I.numberIn(c.eventLabel);
  const dp = I.dateParts(cd);
  const place = ((data.locations || {}).items || []).find(x => x && x.name);
  const guest = I.guestName();
  const photo = I.media(c.image, c.video, name, true);
  return `
  <section class="hero">
    <div class="wrap hero-grid">
      <div class="art">${photo ? `<div class="photo">${photo}</div>` : CAKE}</div>
      <div class="hero-in">
        <p class="ready px c">${COIN} <span class="blink">${guest ? esc(`${c.greeting || 'Hey'} ${guest}`) : 'Player 1 ready'}</span></p>
        <p class="level">${age ? `LEVEL ${esc(age)}` : esc(c.eventLabel || 'GAME ON')}</p>
        <h1 class="name" data-fit=".4">${esc(name)}</h1>
        ${c.headline ? `<p class="px y" style="margin-top:10px">${esc(c.headline)}</p>` : ''}
        ${c.tagline ? `<p class="hero-tag">${esc(c.tagline)}</p>` : ''}
        <div class="facts">
          ${dp ? `<span>${esc(dp.weekdayShort)} ${dp.d} ${esc(dp.monthShort)}</span>` : ''}
          ${cd.time ? `<span>${esc(I.fmtClock(cd.time))}</span>` : ''}
          ${place ? `<span>${esc(place.name)}</span>` : ''}
        </div>
        <a class="start" href="#rsvp">${esc(c.buttonText || 'Press start')}</a>
      </div>
    </div>
  </section>`;
}

function countdown(data) {
  const cd = data.countdown || {};
  if (cd.enabled === false) return '';
  const target = I.eventInstant(cd);
  const dp = I.dateParts(cd);
  return `
  <section class="sec">
    <div class="wrap">
      <p ${R('px m')}>${esc(cd.label || 'High score')}</p>
      <h2 ${R('h2')} data-fit>${dp ? `${esc(dp.weekday)} ${dp.d} ${esc(dp.month)}` : 'Date coming soon'}</h2>
      ${target !== null ? `<div ${R('score')} data-countdown="${target}" data-past-today="GAME ON — IT'S TODAY!" data-past-after="GAME OVER — THANKS FOR PLAYING!">${I.countdownCells({ d: 'DAYS', h: 'HRS', m: 'MIN', s: 'SEC' })}</div>` : ''}
      ${cd.time || cd.description ? `<p ${R('cd-meta')}>${[cd.time ? 'Doors open at ' + esc(I.fmtClock(cd.time)) : '', esc(cd.description || '')].filter(Boolean).join(' · ')}</p>` : ''}
    </div>
  </section>`;
}

function stages(data) {
  const l = data.locations || {};
  const items = (l.items || []).filter(x => x && (x.name || x.addr || x.label));
  if (l.enabled === false || !items.length) return '';
  return `
  <section class="sec" style="padding-top:0">
    <div class="wrap">
      <p ${R('px c')}>${esc(l.label || 'Stage select')}</p>
      <h2 ${R('h2')} data-fit>${esc(l.title || 'Where we play')}</h2>
      <div class="stages">
        ${items.map((x, i) => `
          <article ${R('stage box' + (i % 2 ? ' c' : ''))}>
            ${x.img ? `<figure>${I.img(x.img, x.name)}</figure>` : ''}
            ${x.label ? `<p class="px y">${esc(x.label)}</p>` : ''}
            ${x.name ? `<h3>${esc(x.name)}</h3>` : ''}
            ${x.addr ? `<p>${I.nl2br(x.addr)}</p>` : ''}
            ${x.time ? `<p class="time">${esc(x.time)}</p>` : ''}
            ${x.url ? `<a class="go" href="${esc(I.mapHref(x.url))}" target="_blank" rel="noopener">▶ Map</a>` : ''}
          </article>`).join('')}
      </div>
    </div>
  </section>`;
}

function levels(data) {
  const t = data.timeline || {};
  const items = (t.items || []).filter(x => x && (x.time || x.title));
  if (t.enabled === false || !items.length) return '';
  return `
  <section class="sec" style="padding-top:0">
    <div class="wrap">
      <p ${R('px l')}>${esc(t.label || 'Levels')}</p>
      <h2 ${R('h2')} data-fit>${esc(t.title || 'How the game goes')}</h2>
      <ol class="levels">
        ${items.map((x, i) => `
          <li ${R('lvl')}>
            <span class="n">LV ${i + 1}</span>
            <div>${x.time ? `<span class="t">${esc(x.time)}</span>` : ''}<h3>${I.stepIcon(x) ? `<span class="ic" aria-hidden="true">${esc(I.stepIcon(x))}</span>` : ''}${esc(x.title || '')}</h3></div>
            ${x.subtitle ? `<p>${esc(x.subtitle)}${x.url ? ` · <a href="${esc(I.mapHref(x.url))}" target="_blank" rel="noopener">Map</a>` : ''}</p>` : ''}
            <span class="bar" aria-hidden="true"><i style="--w:${Math.round(((i + 1) / items.length) * 100)}%"></i></span>
          </li>`).join('')}
      </ol>
    </div>
  </section>`;
}

function notes(data) {
  const c = data.cover || {}, f = data.families || {}, g = data.gifts || {}, gl = data.gallery || {};
  const fams = (f.enabled !== false ? (f.items || []) : []).filter(x => x && (x.names || x.label));
  const cards = [];
  (data.customSections || []).filter(s => s && s.enabled !== false && (s.title || s.body)).forEach((s, i) => cards.push(`
    <div ${R('note box' + (i % 2 ? ' y' : ' c'))}>
      ${s.label ? `<p class="px m">${esc(s.label)}</p>` : ''}
      ${s.title ? `<h3>${esc(s.title)}</h3>` : ''}
      ${s.image ? `<figure>${I.img(s.image, s.title)}</figure>` : ''}
      ${s.body ? `<p>${I.nl2br(s.body)}</p>` : ''}
    </div>`));
  if (c.hostText || fams.length || c.hostOutro) cards.push(`
    <div ${R('note box l')}>
      <p class="px m">${esc(f.label || 'Player 2')}</p>
      ${c.hostText ? `<h3>${I.nl2br(c.hostText)}</h3>` : ''}
      ${fams.map(x => `<p>${x.label ? esc(x.label) + ' · ' : ''}<b>${esc(x.names || '')}</b></p>`).join('')}
      ${c.hostOutro ? `<p>${I.nl2br(c.hostOutro)}</p>` : ''}
    </div>`);
  const accounts = (g.items || []).filter(x => x && x.account);
  if (g.enabled !== false && (accounts.length || g.description)) cards.push(`
    <div ${R('note box y')}>
      <p class="px m">${esc(g.label || 'Power-ups')}</p>
      <h3>${esc(g.title || 'Gift ideas')}</h3>
      ${g.description ? `<p>${I.nl2br(g.description)}</p>` : ''}
      ${accounts.map(x => `<div class="acct"><span><b>${esc(x.bank || 'Account')}</b> · ${esc(x.account)}</span><button type="button" class="copy" data-copy="${esc(x.account)}">Copy</button></div>`).join('')}
    </div>`);
  const photos = (gl.enabled !== false ? (gl.items || []) : []).filter(x => x && x.url).slice(0, 8);
  if (!cards.length && !photos.length) return '';
  return `
  <section class="sec" style="padding-top:0">
    <div class="wrap">
      ${cards.length ? `<p ${R('px y')}>Bonus stage</p><div class="notes">${cards.join('')}</div>` : ''}
      ${photos.length ? `
        <div style="margin-top:${cards.length ? 60 : 0}px"><p ${R('px c')}>${esc(gl.label || 'Gallery')}</p>
        ${gl.title ? `<h2 ${R('h2')} data-fit>${esc(gl.title)}</h2>` : ''}</div>
        <div class="frames">${photos.map(x => `<figure ${R()}>${I.img(x.url, x.caption || 'Photo')}</figure>`).join('')}</div>` : ''}
    </div>
  </section>`;
}

function rsvp(data) {
  const r = data.rsvp || {};
  if (r.enabled === false) return '';
  return `
  <section class="sec coin-sec" id="rsvp">
    <div class="wrap">
      <p ${R('px y')} style="text-align:center"><span class="blink">${esc(r.label || 'Insert coin')}</span></p>
      <div ${R('cabinet')}>
        <h2>${esc(r.title || 'Are you playing?')}</h2>
        ${r.description ? `<p class="desc">${I.nl2br(r.description)}</p>` : ''}
        ${I.rsvpNotes(r).map(n => `<p class="notes-line">${esc(n)}</p>`).join('')}
        ${I.rsvpForm(r, {
          yes: "I'm in!", no: "Can't play",
          nameLabel: 'PLAYER NAME', namePlaceholder: 'First and last name',
          countLabel: 'HOW MANY PLAYERS', wishesLabel: 'MESSAGE (OPTIONAL)',
          wishesPlaceholder: 'Happy birthday!', button: r.buttonText || 'Start',
          doneTitle: 'LEVEL COMPLETE!'
        })}
        ${I.contactHtml(r, { intro: 'QUESTIONS? ASK' })}
      </div>
    </div>
  </section>`;
}

function build(data) {
  const c = data.cover || {};
  const name = c.names || data.title || '';
  document.title = (c.headline || `${name}'s Birthday`) + ' — Invitation';
  document.getElementById('app').innerHTML = [
    c.enabled !== false ? hero(data) : '',
    countdown(data), stages(data), levels(data), notes(data), rsvp(data),
    `<footer><p>THANKS FOR PLAYING<br>© ${esc(I.splitNames(name)[0] || name)}</p></footer>`
  ].join('');
}

Invite.boot(build, DEFAULT_DATA);
</script>
</body>
</html>
