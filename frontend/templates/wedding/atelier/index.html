<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Wedding Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Gloock: a high-contrast contemporary display serif. Sora: a precise geometric sans for the
     structure and small type. -->
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="../../../shared/config.js"></script>
<style>
  /*
   * ATELIER — a modern, gallery-like wedding invitation.
   * Bone and ink, one photograph at a time. On wide screens the left half is a sticky stage where
   * the photograph changes as each numbered chapter scrolls past on the right; on phones each
   * chapter opens with its own full-bleed photo band. Oversized serif names, metallic numerals,
   * ruled lists, and a black reply chapter to finish.
   */
  :root {
    --bone:  #efede8;
    --bone-2:#e6e2da;
    --ink:   #111111;
    --ink-2: #1c1c1c;
    --stone: #8d877d;
    --line:  rgba(17,17,17,.14);
    --chrome: linear-gradient(160deg, #f4f2ee 0%, #a9a49b 40%, #f0ede7 55%, #7e7972 100%);
    --display: 'Gloock', 'Didot', 'Bodoni MT', Georgia, serif;
    --sans:    'Sora', 'Helvetica Neue', Arial, sans-serif;
    --pad: clamp(20px, 6vw, 56px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { max-width: 100%; overflow-x: hidden; }
  @supports (overflow: clip) { html, body { overflow-x: clip; } }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body { background: var(--bone); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.6; font-weight: 300; -webkit-tap-highlight-color: transparent; }
  img, video { display: block; max-width: 100%; }
  a { color: inherit; }
  button, input, select, textarea { font: inherit; color: inherit; }
  b, strong { font-weight: 500; }

  .mono { font-size: .68rem; letter-spacing: .22em; text-transform: uppercase; font-weight: 500; color: var(--stone); }
  .display { font-family: var(--display); font-weight: 400; letter-spacing: -.01em; line-height: .98; }
  .rv { opacity: 0; transform: translateY(26px); transition: opacity .9s ease, transform 1.1s cubic-bezier(.2,.8,.2,1); }
  .rv.in { opacity: 1; transform: none; }

  /* ── LAYOUT: content column + (desktop) sticky photo stage ── */
  .layout { display: grid; grid-template-columns: 1fr; }
  .stage { display: none; }
  .content { min-width: 0; }
  @media (min-width: 920px) {
    .layout { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .stage { display: block; position: sticky; top: 0; height: 100vh; height: 100svh; overflow: hidden; background: var(--ink); }
    .stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.2s ease; }
    .stage img.on { opacity: 1; }
    .stage .idx { position: absolute; left: 30px; bottom: 26px; color: var(--bone); font-family: var(--display); font-size: 4.5rem; line-height: 1; mix-blend-mode: difference; }
    .band-img { display: none; }
    .hero { min-height: 100vh; min-height: 100svh; }
  }

  /* ── HERO ── */
  .hero { position: relative; min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; color: var(--bone); background: var(--ink); padding: calc(env(safe-area-inset-top) + 20px) var(--pad) 32px; }
  .hero-bg { position: absolute; inset: 0; z-index: 0; }
  .hero-bg img, .hero-bg video { width: 100%; height: 100%; object-fit: cover; filter: saturate(.85); transform: scale(1.06); transition: transform 4s cubic-bezier(.2,.7,.2,1); }
  .is-ready .hero-bg img, .is-ready .hero-bg video { transform: none; }
  .hero-bg::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(17,17,17,.35) 0%, rgba(17,17,17,0) 35%, rgba(17,17,17,.15) 60%, rgba(17,17,17,.82) 100%); }
  .hero > * { position: relative; z-index: 1; }
  .topbar { display: flex; justify-content: space-between; gap: 12px; }
  .topbar .mono { color: rgba(239,237,232,.8); }
  .hero-names { font-family: var(--display); line-height: .9; letter-spacing: -.02em; font-size: calc(clamp(3.4rem, 17vw, 8rem) * var(--fit, 1)); }
  .hero-names span { display: block; }
  .hero-names .amp { font-size: .42em; color: rgba(239,237,232,.7); line-height: 1.4; font-style: italic; }
  .hero-sub { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(239,237,232,.3); }
  .hero-sub .l { font-size: clamp(.9rem, 3.6vw, 1.05rem); max-width: 30ch; }
  .hero-sub .l b { display: block; font-weight: 500; }
  .cta { display: inline-flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 22px; border: 1px solid rgba(239,237,232,.7); border-radius: 999px; color: var(--bone); text-decoration: none; font-weight: 500; font-size: .86rem; transition: background .3s, color .3s; }
  .cta:hover { background: var(--bone); color: var(--ink); }
  .hero-in > * { opacity: 0; transform: translateY(18px); transition: opacity 1.2s ease, transform 1.2s cubic-bezier(.2,.8,.2,1); }
  .is-ready .hero-in > * { opacity: 1; transform: none; }
  .hero-in > *:nth-child(2) { transition-delay: .3s; }
  @media (min-width: 920px) { .hero-bg { display: none; } .hero { background: var(--bone); color: var(--ink); }
    .hero .topbar .mono, .hero-names .amp { color: var(--stone); } .hero-sub { border-top-color: var(--line); }
    .cta { border-color: var(--ink); color: var(--ink); } .cta:hover { background: var(--ink); color: var(--bone); } }

  /* ── CHAPTERS ── */
  .chapter { position: relative; padding: clamp(50px, 10vw, 90px) var(--pad); border-top: 1px solid var(--line); }
  .chapter.dark { background: var(--ink); color: var(--bone); border-top: 0; }
  .band-img { margin: calc(clamp(50px, 10vw, 90px) * -1) calc(var(--pad) * -1) 30px; aspect-ratio: 4 / 3; overflow: hidden; background: var(--ink-2); position: relative; }
  .band-img img { width: 100%; height: 100%; object-fit: cover; filter: saturate(.85); }
  .band-img .n { position: absolute; left: var(--pad); bottom: 14px; color: var(--bone); font-family: var(--display); font-size: 3rem; line-height: 1; mix-blend-mode: difference; }
  .ch-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 26px; }
  .ch-head .n { font-family: var(--display); font-size: 1.1rem; color: var(--stone); }
  .ch-head h2 { font-family: var(--display); font-weight: 400; letter-spacing: -.01em; line-height: 1; font-size: calc(clamp(2.2rem, 9vw, 3.8rem) * var(--fit, 1)); }
  .intro { font-size: clamp(1.05rem, 4.2vw, 1.25rem); line-height: 1.55; max-width: 38ch; }
  .intro b { font-weight: 500; }

  /* Countdown: metallic numerals. */
  .cd { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 12px; margin-top: 26px; }
  .cd-cell { min-width: 0; border-top: 1px solid var(--line); padding-top: 12px; }
  .cd-num { display: block; font-family: var(--display); font-size: clamp(3rem, 15vw, 5.2rem); line-height: .95; letter-spacing: -.02em; font-variant-numeric: lining-nums tabular-nums;
            background: var(--chrome); -webkit-background-clip: text; background-clip: text; color: transparent; }
  @media (min-width: 560px) { .cd { grid-template-columns: repeat(4, minmax(0, 1fr)); } .cd-num { font-size: clamp(2.4rem, 7vw, 4rem); } }
  /* On the split layout the column is half the screen, so the numerals scale with that. */
  @media (min-width: 920px) { .cd-num { font-size: clamp(2.4rem, 4.6vw, 4rem); } }
  .cd-unit { display: block; margin-top: 4px; font-size: .66rem; letter-spacing: .2em; text-transform: uppercase; font-weight: 500; color: var(--stone); }
  .cd-note { font-family: var(--display); font-size: clamp(2rem, 8vw, 3.2rem); grid-column: 1 / -1; }
  .date-big { font-family: var(--display); font-size: clamp(1.5rem, 6.5vw, 2.4rem); line-height: 1.1; margin-top: 8px; }

  /* Ruled lists: venues and programme. */
  .rows { border-top: 1px solid var(--line); margin-top: 6px; }
  .row { display: grid; grid-template-columns: 1fr; gap: 6px 20px; padding: 18px 0; border-bottom: 1px solid var(--line); }
  @media (min-width: 560px) { .row { grid-template-columns: 110px 1fr; } .row.venue { grid-template-columns: 1fr 1fr; } }
  .row .k { font-size: .7rem; letter-spacing: .18em; text-transform: uppercase; font-weight: 500; color: var(--stone); }
  .row h3 { font-family: var(--display); font-weight: 400; font-size: clamp(1.5rem, 6.5vw, 2.2rem); line-height: 1.05; overflow-wrap: anywhere; }
  .row p { color: var(--stone); overflow-wrap: anywhere; }
  .row .time { color: var(--ink); font-weight: 500; }
  .dark .row p { color: rgba(239,237,232,.7); } .dark .row .time { color: var(--bone); } .dark .rows, .dark .row { border-color: rgba(239,237,232,.2); }
  .row figure { aspect-ratio: 16 / 10; overflow: hidden; margin-top: 8px; }
  .row figure img { width: 100%; height: 100%; object-fit: cover; }
  .arrow { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-weight: 500; text-decoration: none; border-bottom: 1px solid currentColor; }
  .arrow::after { content: '↗'; }
  .prog .t { font-family: var(--display); font-size: 1.35rem; line-height: 1.3; }

  /* Families / notes */
  .fams { display: grid; gap: 18px; margin-top: 20px; }
  @media (min-width: 560px) { .fams { grid-template-columns: 1fr 1fr; } }
  .fam b { display: block; font-family: var(--display); font-weight: 400; font-size: 1.3rem; line-height: 1.2; margin-top: 4px; overflow-wrap: anywhere; }
  .note + .note { margin-top: 26px; padding-top: 26px; border-top: 1px solid var(--line); }
  .note h3 { font-family: var(--display); font-weight: 400; font-size: 1.6rem; line-height: 1.1; margin-top: 4px; }
  .note p { color: var(--stone); margin-top: 8px; max-width: 46ch; }
  .note figure { max-width: 340px; margin-top: 14px; }
  .acct { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .acct span { overflow-wrap: anywhere; }
  .copy, .btn-o { min-height: 40px; padding: 0 16px; border: 1px solid var(--ink); border-radius: 999px; background: transparent; font-weight: 500; font-size: .8rem; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
  .copy:hover, .btn-o:hover { background: var(--ink); color: var(--bone); }

  /* Gallery: two columns, offset. */
  .pics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 24px calc(var(--pad) * -1) 0; }
  .pics figure { overflow: hidden; background: var(--bone-2); aspect-ratio: 3 / 4; }
  .pics figure:nth-child(4n+1) { grid-column: 1 / -1; aspect-ratio: 16 / 10; }
  .pics figure:nth-child(4n+3) { translate: 0 20px; }
  .pics img { width: 100%; height: 100%; object-fit: cover; filter: saturate(.85); }
  @media (min-width: 920px) { .pics { margin-inline: 0; } }

  /* ── RSVP (dark chapter) ── */
  .rsvp-intro { font-size: clamp(1.05rem, 4.2vw, 1.25rem); max-width: 38ch; color: rgba(239,237,232,.85); }
  .rsvp-notes { color: var(--stone); margin-top: 8px; font-size: .9rem; }
  .rsvp { display: grid; gap: 18px; margin-top: 28px; max-width: 520px; }
  .rsvp-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .rsvp-choice { position: relative; display: flex; align-items: center; justify-content: center; text-align: center; min-height: 54px; padding: 8px 10px; border-radius: 999px; cursor: pointer;
                 border: 1px solid rgba(239,237,232,.45); font-weight: 500; font-size: .9rem; line-height: 1.15; transition: background .3s, color .3s, border-color .3s; }
  .rsvp-choice input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .rsvp-choice.on { background: var(--bone); border-color: var(--bone); color: var(--ink); }
  .rsvp-choice:focus-within { outline: 1px solid var(--bone); outline-offset: 3px; }
  .rsvp-field { display: grid; gap: 4px; }
  .rsvp-label { font-size: .66rem; letter-spacing: .2em; text-transform: uppercase; font-weight: 500; color: var(--stone); }
  .rsvp-input { width: 100%; min-height: 50px; padding: 10px 0; border: 0; border-bottom: 1px solid rgba(239,237,232,.4); border-radius: 0; background: transparent; color: var(--bone); font-size: 16px; }
  textarea.rsvp-input { resize: none; min-height: 78px; }
  .rsvp-input::placeholder { color: rgba(239,237,232,.4); }
  .rsvp-input:focus { outline: none; border-bottom-color: var(--bone); }
  .rsvp-error { color: #ff8a80; }
  .rsvp-submit { display: flex; align-items: center; justify-content: space-between; min-height: 58px; padding: 0 24px; border: 0; border-radius: 999px; cursor: pointer; background: var(--bone); color: var(--ink); font-weight: 500; font-size: .95rem; transition: opacity .3s; }
  .rsvp-submit::after { content: '→'; }
  .rsvp-submit:hover { opacity: .88; }
  .rsvp-done { margin-top: 28px; }
  .rsvp-done-title { font-family: var(--display); font-size: clamp(2.2rem, 9vw, 3.4rem); line-height: 1; }
  .rsvp-done-body { color: rgba(239,237,232,.8); margin-top: 10px; max-width: 40ch; }
  .contact { margin-top: 34px; padding-top: 18px; border-top: 1px solid rgba(239,237,232,.2); }
  .contact-intro { font-size: .66rem; letter-spacing: .2em; text-transform: uppercase; font-weight: 500; color: var(--stone); }
  .contact-name { font-family: var(--display); font-size: 1.4rem; margin-top: 2px; }
  .contact-phone { color: rgba(239,237,232,.7); }
  .contact-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .contact-link { display: inline-flex; align-items: center; min-height: 42px; padding: 0 16px; border: 1px solid rgba(239,237,232,.5); border-radius: 999px; text-decoration: none; font-weight: 500; font-size: .84rem; }
  .contact-link:hover { background: var(--bone); color: var(--ink); }

  footer { padding: 34px var(--pad) calc(env(safe-area-inset-bottom) + 70px); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; border-top: 1px solid var(--line); }
  footer .display { font-size: 1.4rem; }

  @media (prefers-reduced-motion: reduce) {
    .rv, .hero-in > * { opacity: 1; transform: none; transition: none; }
    .hero-bg img, .hero-bg video { transform: none; transition: none; }
    .stage img { transition: none; }
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>
<main id="app"></main>

<script src="../../../shared/demo-data.js"></script>
<script src="../../../shared/invitation-core.js"></script>
<script src="../../../shared/invitation-music.js" defer></script>
<script src="../../../shared/rsvp-guest-picker.js" defer></script>
<script>
const A = '/assets/atelier/';
const DEFAULT_DATA = {
  template: 'atelier',
  title: 'Name & Name',
  cover: {
    enabled: true, headline: 'The wedding of', eventLabel: '', names: 'Name & Name',
    tagline: 'Join us as we begin our life together.', greeting: 'Dear', hostIntro: 'With their families',
    hostText: '', hostOutro: '', image: A + 'cover.jpg', video: '', buttonText: 'Reply'
  },
  // Chapter photographs: the sticky stage on desktop, a full-bleed band on phones. Editable per
  // section: countdown.image, locations.image, gifts.image, rsvp.image.
  countdown: { enabled: true, label: 'The date', date: '', time: '', tzOffset: null, description: '', image: A + 'beach.jpg' },
  families:  { enabled: true, label: 'With their families', title: '', items: [] },
  locations: { enabled: true, label: 'The places', title: 'Where', image: A + 'aisle.jpg', items: [
    { label: 'Ceremony', time: '', name: '', addr: '', url: '', img: '' },
    { label: 'Reception', time: '', name: '', addr: '', url: '', img: A + 'table.jpg' }
  ] },
  timeline:  { enabled: true, label: 'The day', title: 'The day', items: [] },
  gallery:   { enabled: true, label: 'Us', title: 'Us', items: [ { url: A + 'hands.jpg', caption: '' }, { url: A + 'portrait.jpg', caption: '' }, { url: A + 'sunset.jpg', caption: '' } ] },
  gifts:     { enabled: false, label: 'Gifts', title: 'Gifts', description: '', image: '', items: [] },
  rsvp: {
    enabled: true, label: 'RSVP', title: 'Will you be there?', description: '',
    deadline: '', maxPeople: 2, buttonText: 'Send reply', allowWishes: true, image: A + 'veil.jpg',
    contactName: '', contactPhone: '', contactLink: ''
  },
  memories: { enabled: false, title: 'Share your photos', description: '', url: '', buttonText: 'Open the album' },
  music:    { enabled: false, url: '', autoplay: true },
  customSections: []
};

const I = Invite, esc = I.esc;
const R = (cls, extra) => `class="${cls ? cls + ' ' : ''}rv"${extra ? ' ' + extra : ''}`;
const pad2 = I.pad2;

let stageImgs = [];            // [{ src, alt }] in chapter order; index 0 is the cover
const stageIndex = src => { if (!src) return -1; let i = stageImgs.findIndex(s => s.src === src); if (i < 0) { stageImgs.push({ src }); i = stageImgs.length - 1; } return i; };

/** One numbered chapter. `img` becomes the stage photo on desktop and a photo band on phones. */
function chapter(n, title, body, opts) {
  const o = opts || {};
  const k = o.img ? stageIndex(o.img) : (o.stage == null ? -1 : o.stage);
  return `
  <section class="chapter${o.dark ? ' dark' : ''}"${o.id ? ` id="${o.id}"` : ''} data-stage="${k}">
    ${o.img ? `<div class="band-img">${I.img(o.img, title)}<span class="n" aria-hidden="true">${pad2(n)}</span></div>` : ''}
    <div class="ch-head rv"><span class="n">${pad2(n)}</span><h2 data-fit>${esc(title)}</h2></div>
    ${body}
  </section>`;
}

function hero(data) {
  const c = data.cover || {}, cd = data.countdown || {};
  const parts = I.splitNames(c.names || data.title || '');
  const dp = I.dateParts(cd);
  const place = ((data.locations || {}).items || []).find(x => x && x.name);
  const guest = I.guestName();
  const bg = I.media(c.image, c.video, c.names, true);
  if (c.image || c.video) stageIndex(c.image || c.video);
  return `
  <section class="hero" data-stage="0">
    ${bg ? `<div class="hero-bg">${bg}</div>` : ''}
    <div class="topbar"><span class="mono">${guest ? `${esc(c.greeting || 'Dear')} ${esc(guest)}` : esc(c.headline || 'The wedding of')}</span><span class="mono">${dp ? `${pad2(dp.d)}.${pad2(dp.mo)}.${dp.y}` : ''}</span></div>
    <div class="hero-in">
      <h1 class="hero-names" data-fit=".4"><span>${esc(parts[0] || '')}</span>${parts.length > 1 ? `<span class="amp">and</span><span>${esc(parts.slice(1).join(' & '))}</span>` : ''}</h1>
      <div class="hero-sub">
        <p class="l">${dp ? `<b>${esc(dp.weekday)}, ${dp.d} ${esc(dp.month)} ${dp.y}${cd.time ? ' · ' + esc(I.fmtClock(cd.time)) : ''}</b>` : ''}${place ? esc(place.name) : esc(c.tagline || '')}</p>
        <a class="cta" href="#rsvp">${esc(c.buttonText || 'Reply')} <span aria-hidden="true">→</span></a>
      </div>
    </div>
  </section>`;
}

function build(data) {
  const c = data.cover || {}, cd = data.countdown || {}, l = data.locations || {}, t = data.timeline || {};
  const f = data.families || {}, g = data.gallery || {}, gf = data.gifts || {}, r = data.rsvp || {}, m = data.memories || {};
  document.title = (c.names || data.title || 'Wedding') + ' — Wedding Invitation';
  stageImgs = [];
  const heroHtml = c.enabled !== false ? hero(data) : '';
  const ch = [];

  const fams = (f.enabled !== false ? (f.items || []) : []).filter(x => x && (x.names || x.label));
  const custom = (data.customSections || []).filter(s => s && s.enabled !== false && (s.title || s.body));
  if (c.tagline || c.hostText || fams.length || custom.length) ch.push([f.label || c.hostIntro || 'With their families', `
    ${c.tagline ? `<p ${R('intro')}>${esc(c.tagline)}</p>` : ''}
    ${c.hostText ? `<p ${R('intro')} style="margin-top:14px">${I.nl2br(c.hostText)}</p>` : ''}
    ${fams.length ? `<div ${R('fams')}>${fams.map(x => `<div class="fam"><span class="mono">${esc(x.label || '')}</span><b>${esc(x.names || '')}</b></div>`).join('')}</div>` : ''}
    ${c.hostOutro ? `<p ${R()} style="margin-top:18px;color:var(--stone)">${I.nl2br(c.hostOutro)}</p>` : ''}
    ${custom.map(s => `<div ${R('note')} style="margin-top:26px">${s.label ? `<span class="mono">${esc(s.label)}</span>` : ''}${s.title ? `<h3>${esc(s.title)}</h3>` : ''}${s.image ? `<figure>${I.img(s.image, s.title)}</figure>` : ''}${s.body ? `<p>${I.nl2br(s.body)}</p>` : ''}</div>`).join('')}`, {}]);

  if (cd.enabled !== false) {
    const target = I.eventInstant(cd), dp = I.dateParts(cd);
    ch.push([cd.label || 'The date', `
      <p ${R('date-big')}>${dp ? `${esc(dp.weekday)}, ${dp.d} ${esc(dp.month)} ${dp.y}${cd.time ? `<br>${esc(I.fmtClock(cd.time))}` : ''}` : 'To be announced'}</p>
      ${cd.description ? `<p ${R()} style="color:var(--stone);margin-top:6px">${esc(cd.description)}</p>` : ''}
      ${target !== null ? `<div ${R('cd')} data-countdown="${target}" data-past-today="Today." data-past-after="Thank you for being there.">${I.countdownCells()}</div>` : ''}`, { img: cd.image }]);
  }

  const places = (l.items || []).filter(x => x && (x.name || x.addr || x.label));
  if (l.enabled !== false && places.length) ch.push([l.title || l.label || 'Where', `
    <div class="rows">${places.map(x => `
      <div ${R('row venue')}>
        <div>${x.label ? `<p class="k">${esc(x.label)}</p>` : ''}${x.name ? `<h3>${esc(x.name)}</h3>` : ''}${x.time ? `<p class="time">${esc(x.time)}</p>` : ''}</div>
        <div>${x.addr ? `<p>${I.nl2br(x.addr)}</p>` : ''}${x.img ? `<figure>${I.img(x.img, x.name)}</figure>` : ''}${x.url ? `<p style="margin-top:8px"><a class="arrow" href="${esc(I.mapHref(x.url))}" target="_blank" rel="noopener">Directions</a></p>` : ''}</div>
      </div>`).join('')}</div>`, { img: l.image }]);

  const steps = (t.items || []).filter(x => x && (x.time || x.title));
  if (t.enabled !== false && steps.length) ch.push([t.title || t.label || 'The day', `
    <div class="rows prog">${steps.map(x => `
      <div ${R('row')}>
        <span class="t">${esc(x.time || '')}</span>
        <div><h3 style="font-size:clamp(1.2rem,5vw,1.6rem)">${esc(x.title || '')}</h3>${x.subtitle ? `<p>${esc(x.subtitle)}</p>` : ''}${x.url ? `<p><a class="arrow" href="${esc(I.mapHref(x.url))}" target="_blank" rel="noopener">Map</a></p>` : ''}</div>
      </div>`).join('')}</div>`, { img: t.image }]);

  const pics = (g.enabled !== false ? (g.items || []) : []).filter(x => x && x.url).slice(0, 8);
  if (pics.length) ch.push([g.title || g.label || 'Us', `<div class="pics">${pics.map(x => `<figure ${R()}>${I.img(x.url, x.caption || 'Photo')}</figure>`).join('')}</div>`, {}]);

  const accounts = (gf.items || []).filter(x => x && x.account);
  const gifts = gf.enabled !== false && (accounts.length || gf.description);
  const mem = m.enabled !== false && m.url;
  if (gifts || mem) ch.push([gifts ? (gf.title || 'Gifts') : (m.title || 'Memories'), `
    ${gifts ? `<div ${R('note')}>${gf.description ? `<p class="intro">${I.nl2br(gf.description)}</p>` : ''}<div style="margin-top:10px">${accounts.map(x => `<div class="acct"><span><b>${esc(x.bank || 'Account')}</b> · ${esc(x.account)}</span><button type="button" class="copy" data-copy="${esc(x.account)}">Copy</button></div>`).join('')}</div></div>` : ''}
    ${mem ? `<div ${R('note')}>${gifts ? `<h3>${esc(m.title || 'Share your photos')}</h3>` : ''}${m.description ? `<p>${I.nl2br(m.description)}</p>` : ''}<p style="margin-top:14px"><a class="btn-o" href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.buttonText || 'Open the album')}</a></p></div>` : ''}`, { img: gf.image }]);

  if (r.enabled !== false) ch.push([r.title || 'Will you be there?', `
    ${r.description ? `<p ${R('rsvp-intro')}>${I.nl2br(r.description)}</p>` : ''}
    ${I.rsvpNotes(r).map(n => `<p ${R('rsvp-notes')}>${esc(n)}</p>`).join('')}
    <div ${R()}>${I.rsvpForm(r, {
      yes: 'Yes, with joy', no: 'Sadly, no',
      nameLabel: 'Name', namePlaceholder: 'Your full name',
      countLabel: 'Guests', wishesLabel: 'A few words (optional)',
      wishesPlaceholder: 'For the two of you…', button: r.buttonText || 'Send reply',
      doneTitle: 'Thank you.'
    })}</div>
    ${I.contactHtml(r, { intro: 'Questions' })}`, { img: r.image, dark: true, id: 'rsvp' }]);

  const parts = I.splitNames(c.names || data.title || '');
  let lastStage = 0;
  document.getElementById('app').innerHTML = `
    <div class="layout">
      <aside class="stage" aria-hidden="true"><span class="idx" data-idx>01</span></aside>
      <div class="content">
        ${heroHtml}
        ${ch.map(([title, body, o], i) => {
          // A chapter without its own photograph keeps the previous one on the stage.
          if (o.img) lastStage = stageIndex(o.img); else o.stage = lastStage;
          return chapter(i + 2, title, body, o);
        }).join('')}
        <footer><span class="display">${parts.map(esc).join(' & ')}</span><span class="mono">${I.dateParts(cd) ? `${pad2(I.dateParts(cd).d)}.${pad2(I.dateParts(cd).mo)}.${I.dateParts(cd).y}` : ''}</span></footer>
      </div>
    </div>`;

  // The stage: every chapter photograph stacked; the one for the chapter in view is shown.
  const stage = document.querySelector('.stage');
  stage.insertAdjacentHTML('afterbegin', stageImgs.map((s, i) => I.img(s.src, '', i === 0, i === 0 ? 'on' : '')).join(''));
  const imgs = stage.querySelectorAll('img'), idx = stage.querySelector('[data-idx]');
  const secs = [...document.querySelectorAll('[data-stage]')];
  let current = 0, ticking = 0;
  // Whichever chapter crosses the middle of the screen owns the stage. A scroll listener (one
  // frame at a time) rather than an observer, so it is exact and works after any jump.
  const pick = () => {
    if (stage.offsetParent === null) return;               // the stage is hidden on phones
    const mid = innerHeight / 2;
    const s = secs.find(el => { const r = el.getBoundingClientRect(); return r.top <= mid && r.bottom >= mid; });
    if (!s) return;
    idx.textContent = pad2(secs.indexOf(s) + 1);
    const k = +s.dataset.stage;
    if (k < 0 || k === current) return;
    current = k;
    imgs.forEach((im, i) => im.classList.toggle('on', i === k));
  };
  addEventListener('scroll', () => { if (ticking) return; ticking = setTimeout(() => { ticking = 0; pick(); }, 60); }, { passive: true });
  addEventListener('resize', pick);
  pick();
}

Invite.boot(build, DEFAULT_DATA);
</script>
</body>
</html>
