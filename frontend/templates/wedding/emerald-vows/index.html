<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f7f3ea">
<title>Wedding Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Marcellus: inscriptional Roman letterforms for the names. Lora: a calm, bookish text face whose
     italic carries the invitation wording. -->
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<script src="../../../shared/config.js"></script>
<style>
  /*
   * EMERALD VOWS — a classic, timeless wedding invitation.
   * Ivory paper, deep emerald ink and a gold hairline. Portraits sit in engraved oval cameos ringed
   * by a vine of outline leaves that draws itself in; the wording is set like a letterpress card,
   * the countdown runs along an emerald band, and the reply is a parchment card with a monogram.
   */
  :root {
    --ivory:   #f7f3ea;
    --parch:   #efe8d8;
    --paper:   #fbf8f1;
    --emerald: #114b3c;
    --deep:    #0b3328;
    --gold:    #b79a5c;
    --gold-2:  #d9c48f;
    --ink:     #22302a;
    --muted:   rgba(34,48,42,.66);
    --line:    rgba(17,75,60,.16);
    --display: 'Marcellus', 'Trajan Pro', Georgia, serif;
    --serif:   'Lora', 'Iowan Old Style', Georgia, serif;
    --pad: clamp(20px, 6vw, 48px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { max-width: 100%; overflow-x: hidden; }
  @supports (overflow: clip) { html, body { overflow-x: clip; } }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body { background: var(--ivory); color: var(--ink); font-family: var(--serif); font-size: 17px; line-height: 1.65; -webkit-tap-highlight-color: transparent; }
  img, video, svg { display: block; max-width: 100%; }
  a { color: inherit; }
  button, input, select, textarea { font: inherit; color: inherit; }

  .wrap { width: min(100%, 960px); margin: 0 auto; padding: 0 var(--pad); }
  .sec { position: relative; padding: clamp(60px, 13vw, 116px) 0; text-align: center; }
  .small { font-family: var(--display); font-size: .74rem; letter-spacing: .3em; text-transform: uppercase; color: var(--gold); }
  .h2 { font-family: var(--display); font-weight: 400; color: var(--emerald); line-height: 1.12; font-size: calc(clamp(1.9rem, 7.5vw, 2.9rem) * var(--fit, 1)); margin-top: 10px; }
  .lead { font-style: italic; color: var(--muted); max-width: 44ch; margin: 10px auto 0; font-size: 1.08rem; }
  .rule { display: flex; align-items: center; justify-content: center; gap: 12px; width: min(100%, 260px); margin: 18px auto; color: var(--gold); }
  .rule::before, .rule::after { content: ''; flex: 1; height: 1px; background: currentColor; opacity: .7; }
  .rule svg { width: 20px; }
  .leaf-ic { fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }

  .rv { opacity: 0; transform: translateY(18px); transition: opacity 1.3s ease, transform 1.4s cubic-bezier(.2,.7,.2,1); }
  .rv.in { opacity: 1; transform: none; }

  /* ── HERO ── */
  .hero { position: relative; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; text-align: center; overflow: hidden;
          padding: calc(env(safe-area-inset-top) + 34px) 0 calc(env(safe-area-inset-bottom) + 50px); }
  .hero::before, .hero::after { content: ''; position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%; pointer-events: none;
    background: radial-gradient(closest-side, rgba(17,75,60,.07), transparent); }
  .hero::before { left: -30vmax; top: -30vmax; } .hero::after { right: -30vmax; bottom: -30vmax; }
  .cameo { position: relative; width: min(74vw, 300px); margin: 18px auto 0; }
  .cameo svg.vine { width: 100%; overflow: visible; }
  .vine .ring { fill: none; stroke: var(--gold); stroke-width: 1; }
  .vine .lf { fill: none; stroke: var(--emerald); stroke-width: 1.2; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 1.1s ease; }
  .is-ready .vine .lf { stroke-dashoffset: 0; }
  .oval { position: absolute; left: 50%; top: 50%; width: 69.3%; aspect-ratio: 104 / 134; translate: -50% -50%; border-radius: 50%; overflow: hidden; background: var(--parch); box-shadow: 0 0 0 1px var(--gold), 0 0 0 5px var(--ivory), 0 0 0 6px rgba(183,154,92,.5); }
  .oval img, .oval video { width: 100%; height: 100%; object-fit: cover; transform: scale(1.1); transition: transform 3.5s cubic-bezier(.2,.7,.2,1) .3s; }
  .is-ready .oval img, .is-ready .oval video { transform: none; }
  .oval .mono { display: grid; place-items: center; height: 100%; font-family: var(--display); font-size: clamp(3rem, 14vw, 5rem); color: var(--emerald); }
  .names { font-family: var(--display); font-weight: 400; color: var(--emerald); line-height: 1.05; letter-spacing: .04em; font-size: calc(clamp(2.3rem, 10.5vw, 4.4rem) * var(--fit, 1)); margin-top: 22px; }
  .names > span { display: block; }
  .names i { display: block; font-family: var(--serif); font-style: italic; font-weight: 400; letter-spacing: 0; color: var(--gold); font-size: .5em; line-height: 1.5; }
  .headline { font-style: italic; color: var(--muted); font-size: clamp(1.05rem, 4.4vw, 1.3rem); margin-top: 10px; }
  .when { font-family: var(--display); letter-spacing: .22em; text-transform: uppercase; font-size: clamp(.72rem, 3vw, .88rem); color: var(--ink); line-height: 2; }
  .where { font-style: italic; color: var(--muted); }
  .hero-in > * { opacity: 0; transform: translateY(12px); transition: opacity 1.5s ease, transform 1.5s cubic-bezier(.2,.7,.2,1); }
  .is-ready .hero-in > * { opacity: 1; transform: none; }
  .hero-in > *:nth-child(2) { transition-delay: .2s; } .hero-in > *:nth-child(3) { transition-delay: .9s; } .hero-in > *:nth-child(4) { transition-delay: 1.1s; }
  .hero-in > *:nth-child(5) { transition-delay: 1.25s; } .hero-in > *:nth-child(n+6) { transition-delay: 1.4s; }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 50px; margin-top: 24px; padding: 0 30px; border: 1px solid var(--emerald); color: var(--emerald);
         font-family: var(--display); letter-spacing: .24em; text-transform: uppercase; font-size: .74rem; text-decoration: none; transition: background .45s, color .45s; }
  .btn:hover { background: var(--emerald); color: var(--ivory); }

  /* ── INVITATION CARD ── */
  .card { position: relative; max-width: 640px; margin: 0 auto; padding: clamp(40px, 10vw, 64px) clamp(22px, 7vw, 56px); background: var(--paper); box-shadow: 0 24px 60px rgba(17,75,60,.1); }
  .card::before { content: ''; position: absolute; inset: 10px; border: 1px solid var(--gold); pointer-events: none; }
  .card .corner { position: absolute; width: 44px; color: var(--emerald); }
  .card .corner.tl { left: 16px; top: 16px; } .card .corner.tr { right: 16px; top: 16px; transform: scaleX(-1); }
  .card .corner.bl { left: 16px; bottom: 16px; transform: scaleY(-1); } .card .corner.br { right: 16px; bottom: 16px; transform: scale(-1); }
  .card .fam { font-family: var(--display); font-size: clamp(1.1rem, 4.6vw, 1.4rem); color: var(--emerald); line-height: 1.35; margin-top: 8px; overflow-wrap: anywhere; }
  .card .fam small { display: block; font-family: var(--serif); font-style: italic; font-size: .92rem; color: var(--muted); }
  .card .amp { font-style: italic; color: var(--gold); font-size: 1.4rem; line-height: 1.4; }
  .card .wording { font-style: italic; font-size: clamp(1.05rem, 4.4vw, 1.25rem); color: var(--ink); margin-top: 16px; line-height: 1.7; }

  /* ── EMERALD BAND (countdown) ── */
  .band { background: var(--emerald); color: var(--ivory); position: relative; overflow: hidden; }
  .band::before { content: ''; position: absolute; inset: 14px; border: 1px solid rgba(217,196,143,.35); pointer-events: none; }
  .band .small { color: var(--gold-2); }
  .band .h2 { color: var(--ivory); }
  .cd { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); max-width: 680px; margin: 30px auto 0; border-top: 1px solid rgba(217,196,143,.45); border-bottom: 1px solid rgba(217,196,143,.45); }
  .cd-cell { padding: 20px 2px 16px; min-width: 0; }
  .cd-cell + .cd-cell { border-left: 1px solid rgba(217,196,143,.3); }
  .cd-num { display: block; font-family: var(--display); font-size: clamp(1.8rem, 8.5vw, 3.4rem); line-height: 1; color: var(--gold-2); font-variant-numeric: lining-nums tabular-nums; }
  .cd-unit { display: block; margin-top: 8px; font-family: var(--display); letter-spacing: .18em; text-transform: uppercase; font-size: clamp(.5rem, 2.2vw, .68rem); color: rgba(247,243,234,.75); }
  .cd-note { grid-column: 1 / -1; padding: 20px; font-style: italic; font-size: 1.6rem; color: var(--gold-2); }
  .band .lead { color: rgba(247,243,234,.8); }

  /* ── VENUES ── */
  .venues { display: grid; gap: 46px; margin-top: 36px; }
  @media (min-width: 720px) { .venues { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; } }
  .venue figure { position: relative; width: min(58vw, 230px); aspect-ratio: 3 / 4; margin: 0 auto 18px; border-radius: 50%; overflow: hidden; background: var(--parch); box-shadow: 0 0 0 1px var(--gold), 0 0 0 6px var(--ivory), 0 0 0 7px rgba(183,154,92,.45); }
  .venue figure img { width: 100%; height: 100%; object-fit: cover; }
  .venue h3 { font-family: var(--display); font-weight: 400; font-size: clamp(1.35rem, 5.5vw, 1.7rem); color: var(--emerald); margin-top: 6px; line-height: 1.25; overflow-wrap: anywhere; }
  .venue p { color: var(--muted); overflow-wrap: anywhere; }
  .venue .time { font-style: italic; color: var(--ink); }
  .link { display: inline-flex; align-items: center; min-height: 44px; margin-top: 8px; font-family: var(--display); letter-spacing: .2em; text-transform: uppercase; font-size: .68rem; color: var(--emerald); text-decoration: none; border-bottom: 1px solid var(--gold); }

  /* ── TIMELINE ── */
  .tl { list-style: none; max-width: 560px; margin: 34px auto 0; text-align: left; position: relative; }
  .tl::before { content: ''; position: absolute; left: 15px; top: 14px; bottom: 14px; width: 1px; background: linear-gradient(transparent, var(--gold), var(--gold), transparent); }
  .tl li { position: relative; display: grid; grid-template-columns: 32px 1fr; gap: 16px; padding: 12px 0; }
  .tl .mk { width: 32px; height: 32px; display: grid; place-items: center; background: var(--ivory); color: var(--emerald); }
  .tl .mk svg { width: 20px; }
  .tl .t { font-family: var(--display); letter-spacing: .18em; text-transform: uppercase; font-size: .7rem; color: var(--gold); }
  .tl h3 { font-family: var(--display); font-weight: 400; font-size: 1.25rem; color: var(--emerald); line-height: 1.3; overflow-wrap: anywhere; }
  .tl p { color: var(--muted); font-size: .98rem; }
  .tl a { color: var(--emerald); }

  /* ── CAMEO GALLERY ── */
  .cameos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(10px, 3vw, 24px); align-items: center; margin-top: 40px; padding: 10px 0; }
  .cameos figure { border-radius: 50%; aspect-ratio: 3 / 4; overflow: hidden; background: var(--parch); box-shadow: 0 0 0 1px var(--gold), 0 0 0 5px var(--ivory), 0 0 0 6px rgba(183,154,92,.45); }
  .cameos figure:nth-child(3n+2) { transform: scale(1.12); }
  .cameos img { width: 100%; height: 100%; object-fit: cover; }

  /* ── NOTES: gifts, memories, custom ── */
  .notes { display: grid; gap: 22px; margin-top: 30px; }
  @media (min-width: 760px) { .notes { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); } }
  .note { position: relative; padding: 32px 26px; background: var(--paper); border: 1px solid var(--line); }
  .note::before { content: ''; position: absolute; inset: 6px; border: 1px solid rgba(183,154,92,.4); pointer-events: none; }
  .note h3 { font-family: var(--display); font-weight: 400; font-size: 1.5rem; color: var(--emerald); line-height: 1.2; margin-top: 8px; overflow-wrap: anywhere; }
  .note p { color: var(--muted); margin-top: 8px; }
  .note figure { margin: 14px auto 0; max-width: 240px; border-radius: 50%; aspect-ratio: 1; overflow: hidden; }
  .note figure img { width: 100%; height: 100%; object-fit: cover; }
  .acct { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px; margin-top: 12px; }
  .acct span { overflow-wrap: anywhere; color: var(--ink); }
  .copy, .btn-sm { min-height: 40px; padding: 0 16px; border: 1px solid var(--emerald); background: transparent; color: var(--emerald); font-family: var(--display); letter-spacing: .16em; text-transform: uppercase; font-size: .64rem; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
  .copy:hover, .btn-sm:hover { background: var(--emerald); color: var(--ivory); }

  /* ── REPLY CARD ── */
  .reply { position: relative; max-width: 580px; margin: 50px auto 0; padding: clamp(50px, 11vw, 70px) clamp(22px, 7vw, 52px) clamp(30px, 7vw, 44px); background: var(--paper); text-align: left; box-shadow: 0 30px 60px rgba(17,75,60,.12); }
  .reply::before { content: ''; position: absolute; inset: 10px; border: 1px solid var(--gold); pointer-events: none; }
  .reply::after { content: ''; position: absolute; inset: 14px; border: 1px solid rgba(183,154,92,.35); pointer-events: none; }
  .medal { position: absolute; left: 50%; top: 0; translate: -50% -50%; width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center; background: var(--emerald); color: var(--gold-2);
           font-family: var(--display); font-size: 1.35rem; letter-spacing: .05em; box-shadow: 0 0 0 5px var(--ivory), 0 0 0 6px var(--gold); z-index: 2; }
  .reply > * { position: relative; z-index: 1; }
  .reply h2 { font-family: var(--display); font-weight: 400; text-align: center; color: var(--emerald); font-size: clamp(1.7rem, 7.5vw, 2.4rem); line-height: 1.15; }
  .reply .desc { text-align: center; font-style: italic; color: var(--muted); margin-top: 8px; }
  .reply .notes-line { text-align: center; font-family: var(--display); letter-spacing: .16em; text-transform: uppercase; font-size: .66rem; color: var(--gold); margin-top: 10px; }
  .rsvp { display: grid; gap: 16px; margin-top: 26px; }
  .rsvp-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .rsvp-choice { position: relative; display: flex; align-items: center; justify-content: center; text-align: center; min-height: 52px; padding: 8px 10px; cursor: pointer;
                 border: 1px solid var(--emerald); color: var(--emerald); font-family: var(--display); letter-spacing: .08em; font-size: .88rem; line-height: 1.2; transition: background .45s, color .45s; }
  .rsvp-choice input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .rsvp-choice.on { background: var(--emerald); color: var(--ivory); }
  .rsvp-choice:focus-within { outline: 1px dashed var(--gold); outline-offset: 4px; }
  .rsvp-field { display: grid; gap: 2px; }
  .rsvp-label { font-family: var(--display); letter-spacing: .18em; text-transform: uppercase; font-size: .64rem; color: var(--gold); }
  .rsvp-input { width: 100%; min-height: 48px; padding: 8px 0; border: 0; border-bottom: 1px solid rgba(34,48,42,.35); border-radius: 0; background: transparent; color: var(--ink); font-size: 1.05rem; }
  textarea.rsvp-input { resize: none; min-height: 70px; }
  .rsvp-input::placeholder { color: rgba(34,48,42,.4); font-style: italic; }
  .rsvp-input:focus { outline: none; border-bottom-color: var(--emerald); }
  .rsvp-error { color: #9b2b22; font-style: italic; }
  .rsvp-submit { min-height: 56px; margin-top: 6px; border: 0; cursor: pointer; background: var(--emerald); color: var(--ivory); font-family: var(--display); letter-spacing: .24em; text-transform: uppercase; font-size: .78rem; transition: background .4s; }
  .rsvp-submit:hover { background: var(--deep); }
  .rsvp-done { margin-top: 26px; text-align: center; }
  .rsvp-done-title { font-family: var(--display); font-size: 1.7rem; color: var(--emerald); }
  .rsvp-done-body { font-style: italic; color: var(--muted); margin-top: 6px; }
  .contact { margin-top: 28px; padding-top: 20px; border-top: 1px solid rgba(183,154,92,.5); text-align: center; }
  .contact-intro { font-family: var(--display); letter-spacing: .16em; text-transform: uppercase; font-size: .64rem; color: var(--gold); }
  .contact-name { font-family: var(--display); font-size: 1.2rem; color: var(--emerald); }
  .contact-phone { color: var(--muted); }
  .contact-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 10px; }
  .contact-link { display: inline-flex; align-items: center; min-height: 42px; padding: 0 16px; border: 1px solid var(--emerald); color: var(--emerald); font-family: var(--display); letter-spacing: .14em; text-transform: uppercase; font-size: .64rem; text-decoration: none; }

  footer { text-align: center; padding: 30px var(--pad) calc(env(safe-area-inset-bottom) + 70px); }
  footer .medal { position: static; translate: none; margin: 0 auto 14px; }
  footer p { font-style: italic; color: var(--muted); }

  @media (prefers-reduced-motion: reduce) {
    .rv, .hero-in > * { opacity: 1; transform: none; transition: none; }
    .vine .lf { stroke-dashoffset: 0; transition: none; }
    .oval img, .oval video { transform: none; transition: none; }
    html { scroll-behavior: auto; }
  }
</style>
</head>

<main id="app"></main>

<script src="../../../shared/demo-data.js"></script>
<script src="../../../shared/invitation-core.js"></script>
<script src="../../../shared/invitation-music.js" defer></script>
<script src="../../../shared/rsvp-guest-picker.js" defer></script>
<script>
const A = '/assets/emerald-vows/';
const DEFAULT_DATA = {
  template: 'emerald-vows',
  title: 'Name & Name',
  cover: {
    enabled: true, headline: 'are getting married', eventLabel: 'Together with their families', names: 'Name & Name',
    tagline: '', greeting: 'Dear', hostIntro: 'Together with their families',
    hostText: 'request the honour of your presence at the celebration of their marriage', hostOutro: '',
    image: A + 'hero.jpg', video: '', buttonText: 'Kindly reply'
  },
  countdown: { enabled: true, label: 'Until we say I do', date: '', time: '', tzOffset: null, description: '', image: '' },
  families:  { enabled: true, label: 'With the blessing of', title: '', items: [] },
  locations: { enabled: true, label: 'The day', title: 'Ceremony & celebration', image: '', items: [
    { label: 'The ceremony', time: '', name: '', addr: '', url: '', img: A + 'church.jpg' },
    { label: 'The reception', time: '', name: '', addr: '', url: '', img: A + 'reception.jpg' }
  ] },
  timeline:  { enabled: true, label: 'Order of the day', title: 'How the day unfolds', items: [] },
  gallery:   { enabled: true, label: 'Our story', title: 'Moments', items: [
    { url: A + 'gallery-1.jpg', caption: '' }, { url: A + 'gallery-2.jpg', caption: '' }, { url: A + 'gallery-3.jpg', caption: '' }
  ] },
  gifts:     { enabled: false, label: 'With love', title: 'Gift registry', description: '', image: '', items: [] },
  rsvp: {
    enabled: true, label: 'Kindly reply', title: 'Will you join us?', description: '',
    deadline: '', maxPeople: 4, buttonText: 'Send reply', allowWishes: true, image: A + 'rsvp.jpg',
    contactName: '', contactPhone: '', contactLink: ''
  },
  memories: { enabled: false, title: 'Share your memories', description: '', url: '', buttonText: 'Share photos' },
  music:    { enabled: false, url: '', autoplay: true },
  customSections: []
};

const I = Invite, esc = I.esc;
const R = (cls, extra) => `class="${cls ? cls + ' ' : ''}rv"${extra ? ' ' + extra : ''}`;
const LEAF = `<svg viewBox="0 0 24 24" aria-hidden="true"><path class="leaf-ic" d="M3 21 C6 12 12 6 21 3 C19 12 13 18 3 21 Z M3 21 C9 15 13 11 19 5"/></svg>`;
const CORNER = cls => `<svg class="corner ${cls}" viewBox="0 0 44 44" aria-hidden="true"><g class="leaf-ic"><path d="M2 42 C2 22 14 8 42 2"/><path d="M8 30 C6 24 8 19 13 17 C14 22 12 27 8 30 Z"/><path d="M17 20 C15 14 18 9 23 8 C23 13 21 18 17 20 Z"/><path d="M13 27 C18 26 22 28 24 32 C19 33 15 31 13 27 Z"/><path d="M22 17 C27 16 31 18 33 22 C28 23 24 21 22 17 Z"/></g></svg>`;

/** A ring of outline leaves around an oval, each leaf drawing in a little after the last. */
const VINE = (() => {
  const cx = 150, cy = 170, rx = 128, ry = 160, n = 34;
  let s = '';
  for (let i = 0; i < n; i++) {
    const t = (i / n) * Math.PI * 2;
    const x = cx + rx * Math.cos(t), y = cy + ry * Math.sin(t);
    const tangent = Math.atan2(ry * Math.cos(t), -rx * Math.sin(t)) * 180 / Math.PI;
    const out = i % 2 ? 1 : -1;                       // alternate leaves leaning in and out
    const rot = tangent + out * 38;
    s += `<path class="lf" pathLength="1" style="transition-delay:${(.3 + i * .05).toFixed(2)}s" transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot.toFixed(1)})" d="M0 0 C4 -6 11 -6 15 0 C11 6 4 6 0 0 Z M0 0 L15 0"/>`;
  }
  return `<svg class="vine" viewBox="-10 -10 320 360" aria-hidden="true"><ellipse class="ring" cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}"/>${s}</svg>`;
})();

function hero(data) {
  const c = data.cover || {}, cd = data.countdown || {};
  const parts = I.splitNames(c.names || data.title || '');
  const dp = I.dateParts(cd);
  const place = ((data.locations || {}).items || []).find(x => x && x.name);
  const guest = I.guestName();
  const photo = I.media(c.image, c.video, c.names, true);
  return `
  <section class="hero">
    <div class="wrap hero-in">
      <p class="small">${guest ? `${esc(c.greeting || 'Dear')} ${esc(guest)}` : esc(c.eventLabel || 'Together with their families')}</p>
      <div class="cameo">${VINE}<div class="oval">${photo || `<div class="mono">${esc(I.initials(c.names))}</div>`}</div></div>
      <h1 class="names" data-fit=".45"><span>${esc(parts[0] || '')}</span>${parts.length > 1 ? `<i>and</i><span>${esc(parts.slice(1).join(' & '))}</span>` : ''}</h1>
      ${c.headline ? `<p class="headline">${esc(c.headline)}</p>` : ''}
      <div class="rule" aria-hidden="true">${LEAF}</div>
      <p class="when">${dp ? `${esc(dp.weekday)} · ${dp.d} ${esc(dp.month)} ${dp.y}${cd.time ? '<br>' + esc(I.fmtClock(cd.time)) : ''}` : 'Date to be announced'}</p>
      ${place ? `<p class="where">${esc(place.name)}</p>` : ''}
      <div><a class="btn" href="#rsvp">${esc(c.buttonText || 'Kindly reply')}</a></div>
    </div>
  </section>`;
}

function invitation(data) {
  const c = data.cover || {}, f = data.families || {};
  const fams = (f.enabled !== false ? (f.items || []) : []).filter(x => x && (x.names || x.label));
  if (!fams.length && !c.hostText && !c.hostOutro) return '';
  return `
  <section class="sec">
    <div class="wrap">
      <div ${R('card')}>
        ${CORNER('tl')}${CORNER('tr')}${CORNER('bl')}${CORNER('br')}
        <p class="small">${esc(fams.length ? (f.label || c.hostIntro || 'Together with their families') : (c.hostIntro || 'With joy'))}</p>
        ${fams.map((x, i) => `${i > 0 ? '<p class="amp">and</p>' : ''}<p class="fam">${esc(x.names || '')}${x.label ? `<small>${esc(x.label)}</small>` : ''}</p>`).join('')}
        ${c.hostText ? `<p class="wording">${I.nl2br(c.hostText)}</p>` : ''}
        ${c.hostOutro ? `<p class="wording" style="margin-top:8px;font-size:1rem;color:var(--muted)">${I.nl2br(c.hostOutro)}</p>` : ''}
      </div>
    </div>
  </section>`;
}

function countdown(data) {
  const cd = data.countdown || {};
  if (cd.enabled === false) return '';
  const target = I.eventInstant(cd);
  const dp = I.dateParts(cd);
  return `
  <section class="sec band">
    <div class="wrap">
      <p ${R('small')}>${esc(cd.label || 'Until we say I do')}</p>
      <h2 ${R('h2')} data-fit>${dp ? `${esc(dp.weekday)}, the ${esc(I.ordinal(dp.d))} of ${esc(dp.month)}` : 'A date to remember'}</h2>
      ${target !== null ? `<div ${R('cd')} data-countdown="${target}" data-past-today="Today we say I do" data-past-after="Thank you for sharing our day">${I.countdownCells()}</div>` : ''}
      ${cd.time || cd.description ? `<p ${R('lead')}>${[cd.time ? 'From ' + esc(I.fmtClock(cd.time)) : '', esc(cd.description || '')].filter(Boolean).join(' · ')}</p>` : ''}
    </div>
  </section>`;
}

function venues(data) {
  const l = data.locations || {};
  const items = (l.items || []).filter(x => x && (x.name || x.addr));
  if (l.enabled === false || !items.length) return '';
  return `
  <section class="sec">
    <div class="wrap">
      <p ${R('small')}>${esc(l.label || 'The day')}</p>
      <h2 ${R('h2')} data-fit>${esc(l.title || 'Ceremony & celebration')}</h2>
      <div class="venues">
        ${items.map(x => `
          <article ${R('venue')}>
            ${x.img ? `<figure>${I.img(x.img, x.name)}</figure>` : ''}
            ${x.label ? `<p class="small">${esc(x.label)}</p>` : ''}
            ${x.name ? `<h3>${esc(x.name)}</h3>` : ''}
            ${x.addr ? `<p>${I.nl2br(x.addr)}</p>` : ''}
            ${x.time ? `<p class="time">${esc(x.time)}</p>` : ''}
            ${x.url ? `<a class="link" href="${esc(I.mapHref(x.url))}" target="_blank" rel="noopener">Directions</a>` : ''}
          </article>`).join('')}
      </div>
    </div>
  </section>`;
}

function timeline(data) {
  const t = data.timeline || {};
  const items = (t.items || []).filter(x => x && (x.time || x.title));
  if (t.enabled === false || !items.length) return '';
  return `
  <section class="sec" style="padding-top:0">
    <div class="wrap">
      <p ${R('small')}>${esc(t.label || 'Order of the day')}</p>
      <h2 ${R('h2')} data-fit>${esc(t.title || 'How the day unfolds')}</h2>
      <ol class="tl">
        ${items.map(x => `
          <li ${R()}>
            <span class="mk" aria-hidden="true">${LEAF}</span>
            <div>
              ${x.time ? `<p class="t">${esc(x.time)}</p>` : ''}
              <h3>${esc(x.title || '')}</h3>
              ${x.subtitle ? `<p>${esc(x.subtitle)}</p>` : ''}
              ${x.url ? `<p><a href="${esc(I.mapHref(x.url))}" target="_blank" rel="noopener">Directions</a></p>` : ''}
            </div>
          </li>`).join('')}
      </ol>
    </div>
  </section>`;
}

function gallery(data) {
  const g = data.gallery || {};
  const photos = (g.enabled !== false ? (g.items || []) : []).filter(x => x && x.url).slice(0, 6);
  if (!photos.length) return '';
  return `
  <section class="sec" style="padding-top:0">
    <div class="wrap">
      <p ${R('small')}>${esc(g.label || 'Our story')}</p>
      ${g.title ? `<h2 ${R('h2')} data-fit>${esc(g.title)}</h2>` : ''}
      <div class="cameos">${photos.map(x => `<figure ${R()}>${I.img(x.url, x.caption || 'Photo')}</figure>`).join('')}</div>
    </div>
  </section>`;
}

function notes(data) {
  const g = data.gifts || {}, m = data.memories || {};
  const cards = [];
  (data.customSections || []).filter(s => s && s.enabled !== false && (s.title || s.body)).forEach(s => cards.push(`
    <div ${R('note')}>
      ${s.label ? `<p class="small">${esc(s.label)}</p>` : ''}
      ${s.title ? `<h3>${esc(s.title)}</h3>` : ''}
      ${s.image ? `<figure>${I.img(s.image, s.title)}</figure>` : ''}
      ${s.body ? `<p>${I.nl2br(s.body)}</p>` : ''}
    </div>`));
  const accounts = (g.items || []).filter(x => x && x.account);
  if (g.enabled !== false && (accounts.length || g.description)) cards.push(`
    <div ${R('note')}>
      <p class="small">${esc(g.label || 'With love')}</p>
      <h3>${esc(g.title || 'Gift registry')}</h3>
      ${g.description ? `<p>${I.nl2br(g.description)}</p>` : ''}
      ${accounts.map(x => `<div class="acct"><span>${esc(x.bank || 'Account')} · ${esc(x.account)}</span><button type="button" class="copy" data-copy="${esc(x.account)}">Copy</button></div>`).join('')}
    </div>`);
  if (m.enabled !== false && m.url) cards.push(`
    <div ${R('note')}>
      <p class="small">Memories</p>
      <h3>${esc(m.title || 'Share your memories')}</h3>
      ${m.description ? `<p>${I.nl2br(m.description)}</p>` : ''}
      <p><a class="btn-sm" href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.buttonText || 'Share photos')}</a></p>
    </div>`);
  if (!cards.length) return '';
  return `<section class="sec" style="padding-top:0"><div class="wrap"><div class="notes">${cards.join('')}</div></div></section>`;
}

function reply(data) {
  const r = data.rsvp || {}, c = data.cover || {};
  if (r.enabled === false) return '';
  return `
  <section class="sec band" id="rsvp" style="padding-top:calc(clamp(60px, 13vw, 116px) + 30px)">
    <div class="wrap">
      <div ${R('reply')}>
        <div class="medal" aria-hidden="true">${esc(I.initials(c.names) || '♥')}</div>
        <h2>${esc(r.title || 'Will you join us?')}</h2>
        ${r.description ? `<p class="desc">${I.nl2br(r.description)}</p>` : ''}
        ${I.rsvpNotes(r).map(n => `<p class="notes-line">${esc(n)}</p>`).join('')}
        ${I.rsvpForm(r, {
          yes: 'Joyfully accepts', no: 'Regretfully declines',
          nameLabel: 'Name(s)', namePlaceholder: 'As written on your invitation',
          countLabel: 'Number of guests', wishesLabel: 'A note for the couple',
          wishesPlaceholder: 'With all our love…', button: r.buttonText || 'Send reply',
          doneTitle: 'With thanks'
        })}
        ${I.contactHtml(r, { intro: 'For any questions' })}
      </div>
    </div>
  </section>`;
}

function build(data) {
  const c = data.cover || {};
  document.title = (c.names || data.title || 'Wedding') + ' — Wedding Invitation';
  document.getElementById('app').innerHTML = [
    c.enabled !== false ? hero(data) : '',
    invitation(data), countdown(data), venues(data), timeline(data), gallery(data), notes(data), reply(data),
    `<footer><div class="medal" aria-hidden="true">${esc(I.initials(c.names) || '♥')}</div><p>With love, ${esc(c.names || '')}</p></footer>`
  ].join('');
}

Invite.boot(build, DEFAULT_DATA);
</script>
</body>
</html>
