<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fbf7f0">
<title>Engagement Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Italiana: an airy, hand-lettered Italian display face. Mulish: a soft, open sans for text. -->
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Mulish:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<script src="../../../shared/config.js"></script>
<style>
  /*
   * AMALFI — a romantic engagement on the Mediterranean.
   * Stucco white, lemon, azure and olive: a sea photograph with a postcard laid over it,
   * hand-drawn lemon branches, majolica tile strips between sections, a postcard-back reply
   * card with a lemon stamp. Sunny, elegant and warm.
   */
  :root {
    --stucco: #fbf7f0;
    --stucco-2: #f3ecdf;
    --lemon:  #f2c94c;
    --lemon-2:#f8dd86;
    --azure:  #2b6fb0;
    --sea:    #6fb6d9;
    --olive:  #7a8a4a;
    --olive-2:#a8b578;
    --tile:   #c8714f;
    --ink:    #1f2a33;
    --muted:  rgba(31,42,51,.66);
    --display: 'Italiana', 'Didot', Georgia, serif;
    --sans:    'Mulish', 'Helvetica Neue', Arial, sans-serif;
    --pad: clamp(20px, 6vw, 48px);
    /* A majolica tile pattern drawn with gradients: azure quatrefoils on white with lemon dots. */
    --majolica:
      radial-gradient(circle at 50% 50%, var(--lemon) 0 4px, transparent 5px),
      radial-gradient(circle at 0 0, var(--azure) 0 10px, transparent 11px),
      radial-gradient(circle at 100% 0, var(--azure) 0 10px, transparent 11px),
      radial-gradient(circle at 0 100%, var(--azure) 0 10px, transparent 11px),
      radial-gradient(circle at 100% 100%, var(--azure) 0 10px, transparent 11px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { max-width: 100%; overflow-x: hidden; }
  @supports (overflow: clip) { html, body { overflow-x: clip; } }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body { background: var(--stucco); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.65; -webkit-tap-highlight-color: transparent; }
  img, video, svg { display: block; max-width: 100%; }
  a { color: inherit; }
  button, input, select, textarea { font: inherit; color: inherit; }

  .wrap { width: min(100%, 960px); margin: 0 auto; padding: 0 var(--pad); }
  .sec { position: relative; padding: clamp(56px, 12vw, 108px) 0; text-align: center; }
  .small { font-size: .72rem; font-weight: 700; letter-spacing: .26em; text-transform: uppercase; color: var(--azure); }
  .h2 { font-family: var(--display); font-weight: 400; line-height: 1.08; color: var(--ink); font-size: calc(clamp(2.3rem, 9vw, 3.8rem) * var(--fit, 1)); margin-top: 8px; }
  .lead { color: var(--muted); max-width: 46ch; margin: 10px auto 0; font-size: 1.05rem; }
  .tiles { height: 28px; background: var(--majolica) 0 0 / 28px 28px, #fff; border-top: 2px solid var(--azure); border-bottom: 2px solid var(--azure); }

  .rv { opacity: 0; transform: translateY(20px); transition: opacity 1s ease, transform 1.1s cubic-bezier(.2,.8,.2,1); }
  .rv.in { opacity: 1; transform: none; }

  /* Lemon branch line art: olive leaves and two lemons. */
  .branch { width: 100%; }
  .branch .leaf { fill: var(--olive-2); stroke: var(--olive); stroke-width: 1; }
  .branch .lemon { fill: var(--lemon); stroke: #d9ad2a; stroke-width: 1; }
  .branch .stem { fill: none; stroke: var(--olive); stroke-width: 1.6; stroke-linecap: round; }

  /* ── HERO: the sea, then a postcard laid over it ── */
  .hero { position: relative; padding: 0 0 40px; overflow: hidden; }
  .sea { position: relative; height: min(64vh, 560px); min-height: 320px; background: var(--sea); }
  .sea img, .sea video { width: 100%; height: 100%; object-fit: cover; transform: scale(1.06); transition: transform 4s cubic-bezier(.2,.7,.2,1); }
  .is-ready .sea img, .is-ready .sea video { transform: none; }
  .sea::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(31,42,51,.15), transparent 40%, rgba(251,247,240,.2)); }
  .sea .tag { position: absolute; top: calc(env(safe-area-inset-top) + 18px); left: var(--pad); right: var(--pad); display: flex; justify-content: space-between; gap: 10px; color: #fff; font-size: .72rem; font-weight: 700; letter-spacing: .24em; text-transform: uppercase; text-shadow: 0 1px 8px rgba(0,0,0,.4); }
  .card { position: relative; width: min(calc(100% - var(--pad) * 2), 620px); margin: -110px auto 0; padding: clamp(30px, 8vw, 50px) clamp(22px, 7vw, 50px) clamp(26px, 7vw, 40px); background: #fff; text-align: center; box-shadow: 0 30px 60px rgba(31,42,51,.14); }
  .card::before { content: ''; position: absolute; inset: 8px; border: 1px solid var(--lemon); pointer-events: none; }
  .card .branch { position: absolute; width: clamp(90px, 26vw, 150px); right: -14px; top: -34px; rotate: 12deg; }
  .card .branch.l { right: auto; left: -14px; bottom: -30px; top: auto; rotate: 190deg; }
  .card > * { position: relative; }
  .names { font-family: var(--display); font-weight: 400; line-height: 1; font-size: calc(clamp(2.8rem, 12vw, 5rem) * var(--fit, 1)); margin-top: 10px; }
  .names .amp { display: block; color: var(--azure); font-size: .55em; line-height: 1.5; }
  .headline { font-style: italic; color: var(--muted); font-size: clamp(1.05rem, 4.4vw, 1.3rem); margin-top: 8px; }
  .when { margin-top: 18px; font-family: var(--display); font-size: clamp(1.2rem, 5vw, 1.6rem); color: var(--azure); line-height: 1.3; }
  .where { color: var(--muted); }
  .card-in > * { opacity: 0; transform: translateY(12px); transition: opacity 1.2s ease, transform 1.2s cubic-bezier(.2,.7,.2,1); }
  .is-ready .card-in > * { opacity: 1; transform: none; }
  .card-in > *:nth-child(2) { transition-delay: .2s; } .card-in > *:nth-child(3) { transition-delay: .4s; } .card-in > *:nth-child(n+4) { transition-delay: .6s; }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 50px; margin-top: 22px; padding: 0 28px; border-radius: 999px; background: var(--azure); color: #fff;
         font-weight: 700; letter-spacing: .1em; text-transform: uppercase; font-size: .74rem; text-decoration: none; box-shadow: 0 10px 24px rgba(43,111,176,.3); transition: transform .25s; }
  .btn:hover { transform: translateY(-2px); }

  /* ── STORY / FAMILIES ── */
  .story { max-width: 620px; margin: 0 auto; }
  .story .body { font-size: clamp(1.1rem, 4.4vw, 1.35rem); line-height: 1.6; margin-top: 16px; }
  .story figure { width: min(70vw, 320px); margin: 26px auto 0; border-radius: 160px 160px 18px 18px; overflow: hidden; border: 4px solid #fff; box-shadow: 0 18px 40px rgba(31,42,51,.14); }
  .fams { display: grid; gap: 18px; margin-top: 26px; align-items: center; }
  @media (min-width: 700px) { .fams { grid-template-columns: 1fr auto 1fr; gap: 26px; } }
  .fam small { display: block; font-size: .7rem; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: var(--olive); }
  .fam p { font-family: var(--display); font-size: 1.5rem; margin-top: 2px; overflow-wrap: anywhere; }
  .fams .branch { width: 80px; margin: 0 auto; }

  /* ── COUNTDOWN: majolica tiles ── */
  .cd { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(8px, 2.6vw, 18px); max-width: 640px; margin: 30px auto 0; }
  .cd-cell { position: relative; aspect-ratio: 1; min-width: 0; display: grid; place-content: center; background: #fff; border: 2px solid var(--azure); }
  .cd-cell::before { content: ''; position: absolute; inset: 4px; border: 1px solid var(--lemon); pointer-events: none; }
  .cd-cell::after { content: ''; position: absolute; left: 50%; top: 6px; width: 8px; height: 8px; translate: -50% 0; border-radius: 50%; background: var(--lemon); }
  .cd-num { display: block; font-family: var(--display); font-size: clamp(1.5rem, 7vw, 2.8rem); line-height: 1; color: var(--azure); font-variant-numeric: lining-nums tabular-nums; }
  .cd-unit { display: block; margin-top: 4px; font-size: clamp(.5rem, 2vw, .66rem); font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .cd-note { grid-column: 1 / -1; font-family: var(--display); font-size: 2.2rem; color: var(--azure); }

  /* ── VENUE ── */
  .venues { display: grid; gap: 22px; margin-top: 30px; }
  @media (min-width: 760px) { .venues { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); } }
  .venue { background: #fff; border-radius: 22px; overflow: hidden; box-shadow: 0 16px 40px rgba(31,42,51,.1); text-align: left; }
  .venue figure { aspect-ratio: 16 / 10; overflow: hidden; }
  .venue figure img { width: 100%; height: 100%; object-fit: cover; }
  .venue-body { padding: 22px 22px 26px; border-top: 4px solid var(--lemon); }
  .venue h3 { font-family: var(--display); font-weight: 400; font-size: clamp(1.6rem, 6.5vw, 2rem); line-height: 1.1; margin-top: 4px; overflow-wrap: anywhere; }
  .venue p { color: var(--muted); overflow-wrap: anywhere; }
  .venue .time { color: var(--ink); font-weight: 700; margin-top: 4px; }
  .pill { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; margin-top: 12px; padding: 0 18px; border-radius: 999px; background: var(--stucco-2); color: var(--azure); font-weight: 700; text-decoration: none; }

  /* ── TIMELINE: lemon bullets ── */
  .tl { list-style: none; max-width: 560px; margin: 30px auto 0; text-align: left; }
  .tl li { display: grid; grid-template-columns: 34px 1fr; gap: 14px; padding: 12px 0; border-bottom: 1px dashed rgba(43,111,176,.3); }
  .tl li:last-child { border-bottom: 0; }
  .tl .lm { width: 30px; height: 30px; margin-top: 4px; }
  .tl .t { font-size: .72rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--azure); }
  .tl h3 { font-family: var(--display); font-weight: 400; font-size: 1.4rem; line-height: 1.2; overflow-wrap: anywhere; }
  .tl p { color: var(--muted); }
  .tl a { color: var(--azure); font-weight: 700; }

  /* ── GALLERY ── */
  .snaps { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: clamp(8px, 2vw, 14px); margin-top: 30px; }
  .snaps figure { grid-column: span 3; aspect-ratio: 4 / 3; border-radius: 16px; overflow: hidden; border: 3px solid #fff; box-shadow: 0 12px 28px rgba(31,42,51,.12); background: var(--stucco-2); }
  .snaps figure:nth-child(3n+1) { grid-column: span 6; aspect-ratio: 16 / 9; }
  @media (min-width: 760px) { .snaps figure, .snaps figure:nth-child(3n+1) { grid-column: span 2; aspect-ratio: 4 / 5; } .snaps figure:nth-child(3n+1) { grid-column: span 2; } }
  .snaps img { width: 100%; height: 100%; object-fit: cover; }

  /* ── NOTES (gifts, custom) ── */
  .notes { display: grid; gap: 18px; margin-top: 30px; }
  @media (min-width: 760px) { .notes { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); } }
  .note { padding: 26px 24px; background: #fff; border-radius: 18px; border-top: 4px solid var(--lemon); box-shadow: 0 12px 30px rgba(31,42,51,.08); }
  .note h3 { font-family: var(--display); font-weight: 400; font-size: 1.6rem; line-height: 1.15; margin-top: 4px; overflow-wrap: anywhere; }
  .note p { color: var(--muted); margin-top: 8px; }
  .note figure { margin: 12px auto; max-width: 260px; border-radius: 14px; overflow: hidden; }
  .acct { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px; margin-top: 12px; }
  .acct span { overflow-wrap: anywhere; }
  .copy { min-height: 40px; padding: 0 16px; border: 2px solid var(--azure); border-radius: 999px; background: transparent; color: var(--azure); font-weight: 700; font-size: .8rem; cursor: pointer; }

  /* ── POSTCARD (RSVP): message side + address side with a lemon stamp ── */
  .postcard { max-width: 760px; margin: 30px auto 0; background: #fff; border-radius: 6px; box-shadow: 0 30px 60px rgba(31,42,51,.16); text-align: left; overflow: hidden; }
  .postcard-in { display: grid; }
  @media (min-width: 760px) { .postcard-in { grid-template-columns: 1.05fr .95fr; } .pc-l { border-right: 2px dashed rgba(31,42,51,.2); } }
  .pc-l, .pc-r { padding: clamp(22px, 5vw, 34px); }
  .pc-l { background: repeating-linear-gradient(0deg, transparent 0 31px, rgba(43,111,176,.14) 31px 32px) 0 46px / 100% 32px; }
  .pc-l h2 { font-family: var(--display); font-weight: 400; font-size: clamp(1.9rem, 8vw, 2.6rem); line-height: 1.1; }
  .pc-l .desc { color: var(--muted); margin-top: 8px; }
  .pc-l .notes-line { margin-top: 8px; font-size: .7rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--azure); }
  .stamp { position: absolute; right: 18px; top: 18px; width: 64px; height: 76px; padding: 6px; background: var(--lemon); border-radius: 3px;
           box-shadow: 0 0 0 4px #fff, 0 0 0 5px rgba(31,42,51,.08); }
  .stamp svg { width: 100%; height: 100%; }
  .pc-r { position: relative; padding-top: 110px; }
  .rsvp { display: grid; gap: 16px; }
  .rsvp-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .rsvp-choice { position: relative; display: flex; align-items: center; justify-content: center; text-align: center; min-height: 52px; padding: 8px 10px; border-radius: 999px; cursor: pointer;
                 border: 2px solid var(--azure); color: var(--azure); font-weight: 700; font-size: .9rem; line-height: 1.15; transition: background .3s, color .3s; }
  .rsvp-choice input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .rsvp-choice.on { background: var(--azure); color: #fff; }
  .rsvp-choice:focus-within { outline: 2px solid var(--lemon); outline-offset: 3px; }
  .rsvp-field { display: grid; gap: 2px; }
  .rsvp-label { font-size: .68rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  .rsvp-input { width: 100%; min-height: 46px; padding: 8px 0; border: 0; border-bottom: 1.5px solid rgba(31,42,51,.35); border-radius: 0; background: transparent; color: var(--ink); font-size: 16px; }
  textarea.rsvp-input { resize: none; min-height: 72px; }
  .rsvp-input::placeholder { color: rgba(31,42,51,.4); }
  .rsvp-input:focus { outline: none; border-bottom-color: var(--azure); }
  .rsvp-error { color: #b8412f; font-weight: 700; }
  .rsvp-submit { min-height: 54px; margin-top: 4px; border: 0; border-radius: 999px; cursor: pointer; background: var(--azure); color: #fff; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; font-size: .78rem; box-shadow: 0 10px 24px rgba(43,111,176,.3); }
  .rsvp-done { margin-top: 6px; }
  .rsvp-done-title { font-family: var(--display); font-size: 2rem; color: var(--azure); line-height: 1.1; }
  .rsvp-done-body { color: var(--muted); margin-top: 6px; }
  .contact { margin-top: 22px; padding-top: 16px; border-top: 1px dashed rgba(31,42,51,.2); }
  .contact-intro { font-size: .68rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  .contact-name { font-family: var(--display); font-size: 1.3rem; }
  .contact-phone { color: var(--muted); }
  .contact-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .contact-link { display: inline-flex; align-items: center; min-height: 42px; padding: 0 16px; border-radius: 999px; background: var(--stucco-2); color: var(--azure); font-weight: 700; text-decoration: none; }

  footer { text-align: center; padding: 30px var(--pad) calc(env(safe-area-inset-bottom) + 70px); }
  footer .branch { width: 120px; margin: 0 auto 10px; }
  footer p { font-family: var(--display); font-size: 1.6rem; color: var(--azure); }

  @media (prefers-reduced-motion: reduce) {
    .rv, .card-in > * { opacity: 1; transform: none; transition: none; }
    .sea img, .sea video { transform: none; transition: none; }
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>
<main id="app"></main>

<script src="../../../shared/demo-data.js"></script>
<script src="../../../shared/invitation-core.js"></script>
<script src="../../../shared/invitation-music.js" defer></script>
<script src="../../../shared/rsvp-guest-picker.js" defer></script>
<script>
const A = '/assets/amalfi/';
const DEFAULT_DATA = {
  template: 'amalfi',
  title: 'Name & Name',
  cover: {
    enabled: true, headline: 'are engaged', eventLabel: 'Save the date', names: 'Name & Name',
    tagline: 'Join us for an evening by the sea to celebrate our engagement.', greeting: 'Dear',
    hostIntro: '', hostOutro: '', hostText: '', image: A + 'sea.jpg', video: '', buttonText: 'Reply'
  },
  countdown: { enabled: true, label: 'Counting down', date: '', time: '', tzOffset: null, description: '', image: '' },
  families:  { enabled: true, label: 'With the blessing of', title: '', items: [] },
  locations: { enabled: true, label: 'Where', title: 'By the water', image: '', items: [
    { label: 'Engagement party', time: '', name: '', addr: '', url: '', img: A + 'venue.jpg' }
  ] },
  timeline:  { enabled: true, label: 'The evening', title: 'How the evening goes', items: [] },
  gallery:   { enabled: true, label: 'Us', title: 'A few snapshots', items: [
    { url: A + 'gallery-1.jpg', caption: '' }, { url: A + 'gallery-2.jpg', caption: '' }, { url: A + 'gallery-3.jpg', caption: '' }
  ] },
  gifts:     { enabled: false, label: 'Gifts', title: 'Gifts', description: '', image: '', items: [] },
  rsvp: {
    enabled: true, label: 'Write back', title: 'Will you join us?', description: '',
    deadline: '', maxPeople: 4, buttonText: 'Send the postcard', allowWishes: true, image: '',
    contactName: '', contactPhone: '', contactLink: ''
  },
  memories: { enabled: false, title: '', description: '', url: '', buttonText: '' },
  music:    { enabled: false, url: '', autoplay: true },
  customSections: []
};

const I = Invite, esc = I.esc;
const R = (cls, extra) => `class="${cls ? cls + ' ' : ''}rv"${extra ? ' ' + extra : ''}`;
const BRANCH = cls => `<svg class="branch ${cls || ''}" viewBox="0 0 160 110" aria-hidden="true">
  <path class="stem" d="M6 100 C40 70 80 50 150 40"/>
  <path class="leaf" d="M40 76 C34 60 42 48 58 46 C60 62 54 72 40 76 Z"/>
  <path class="leaf" d="M70 60 C84 50 100 54 106 66 C92 74 78 72 70 60 Z"/>
  <path class="leaf" d="M96 48 C92 34 102 22 118 24 C118 40 110 48 96 48 Z"/>
  <path class="leaf" d="M24 90 C18 78 22 66 34 62 C38 74 34 84 24 90 Z"/>
  <ellipse class="lemon" cx="132" cy="56" rx="17" ry="13" transform="rotate(-20 132 56)"/>
  <ellipse class="lemon" cx="112" cy="82" rx="15" ry="11" transform="rotate(15 112 82)"/>
</svg>`;
const LEMON = `<svg class="lm" viewBox="0 0 30 30" aria-hidden="true"><ellipse cx="15" cy="16" rx="12" ry="9" transform="rotate(-25 15 16)" fill="#f2c94c" stroke="#d9ad2a"/><path d="M12 6 C14 2 20 2 22 5" fill="none" stroke="#7a8a4a" stroke-width="1.6" stroke-linecap="round"/><path d="M16 5 C20 1 26 4 24 8 C20 9 17 8 16 5 Z" fill="#a8b578"/></svg>`;
const STAMP = `<svg viewBox="0 0 52 64" aria-hidden="true"><rect x="2" y="2" width="48" height="60" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="3 3"/><ellipse cx="26" cy="30" rx="14" ry="10" transform="rotate(-25 26 30)" fill="#fff" opacity=".9"/><path d="M22 18 C24 14 30 14 32 17" fill="none" stroke="#7a8a4a" stroke-width="1.6"/><text x="26" y="54" text-anchor="middle" font-family="Mulish, sans-serif" font-size="8" font-weight="700" fill="#1f2a33">AMALFI</text></svg>`;

function hero(data) {
  const c = data.cover || {}, cd = data.countdown || {};
  const parts = I.splitNames(c.names || data.title || '');
  const dp = I.dateParts(cd);
  const place = ((data.locations || {}).items || []).find(x => x && x.name);
  const guest = I.guestName();
  const photo = I.media(c.image, c.video, c.names, true);
  return `
  <section class="hero">
    <div class="sea">
      ${photo}
      <div class="tag"><span>${guest ? esc(`${c.greeting || 'Dear'} ${guest}`) : esc(c.eventLabel || 'Save the date')}</span><span>${dp ? `${I.pad2(dp.d)}.${I.pad2(dp.mo)}.${dp.y}` : ''}</span></div>
    </div>
    <div class="card">
      ${BRANCH('')}${BRANCH('l')}
      <div class="card-in">
        <p class="small">${esc(c.eventLabel || 'Save the date')}</p>
        <h1 class="names" data-fit=".45">${esc(parts[0] || '')}${parts.length > 1 ? `<span class="amp">&amp;</span>${esc(parts.slice(1).join(' & '))}` : ''}</h1>
        ${c.headline ? `<p class="headline">${esc(c.headline)}</p>` : ''}
        <p class="when">${dp ? `${esc(dp.weekday)}, ${dp.d} ${esc(dp.month)} ${dp.y}${cd.time ? `<br>${esc(I.fmtClock(cd.time))}` : ''}` : 'Date to be announced'}</p>
        ${place ? `<p class="where">${esc(place.name)}</p>` : ''}
        <div><a class="btn" href="#rsvp">${esc(c.buttonText || 'Reply')}</a></div>
      </div>
    </div>
  </section>`;
}

function story(data) {
  const c = data.cover || {}, f = data.families || {};
  const fams = (f.enabled !== false ? (f.items || []) : []).filter(x => x && (x.names || x.label));
  const custom = (data.customSections || []).filter(s => s && s.enabled !== false && (s.title || s.body));
  if (!c.tagline && !c.hostText && !fams.length && !custom.length) return '';
  return `
  <section class="sec">
    <div class="wrap story">
      ${c.tagline ? `<p ${R('body')} style="font-family:var(--display);font-size:clamp(1.4rem,5.6vw,2rem);line-height:1.3">${esc(c.tagline)}</p>` : ''}
      ${custom.map(s => `
        <div ${R()} style="margin-top:36px">
          ${s.label ? `<p class="small">${esc(s.label)}</p>` : ''}
          ${s.title ? `<h2 class="h2" data-fit>${esc(s.title)}</h2>` : ''}
          ${s.body ? `<p class="body">${I.nl2br(s.body)}</p>` : ''}
          ${s.image ? `<figure>${I.img(s.image, s.title)}</figure>` : ''}
        </div>`).join('')}
      ${fams.length || c.hostText ? `
        <div ${R()} style="margin-top:40px">
          <p class="small">${esc(f.label || 'With the blessing of')}</p>
          ${c.hostText ? `<p class="lead">${I.nl2br(c.hostText)}</p>` : ''}
          <div class="fams">${fams.map((x, i) => `${i > 0 ? BRANCH('') : ''}<div class="fam">${x.label ? `<small>${esc(x.label)}</small>` : ''}<p>${esc(x.names || '')}</p></div>`).join('')}</div>
          ${c.hostOutro ? `<p class="lead">${I.nl2br(c.hostOutro)}</p>` : ''}
        </div>` : ''}
    </div>
  </section>
  <div class="tiles" aria-hidden="true"></div>`;
}

function countdown(data) {
  const cd = data.countdown || {};
  if (cd.enabled === false) return '';
  const target = I.eventInstant(cd);
  const dp = I.dateParts(cd);
  return `
  <section class="sec">
    <div class="wrap">
      <p ${R('small')}>${esc(cd.label || 'Counting down')}</p>
      <h2 ${R('h2')} data-fit>${dp ? `${esc(dp.weekday)}, ${dp.d} ${esc(dp.month)}` : 'Date to be announced'}</h2>
      ${target !== null ? `<div ${R('cd')} data-countdown="${target}" data-past-today="Today, by the sea" data-past-after="Grazie for celebrating with us">${I.countdownCells({ m: 'Mins', s: 'Secs' })}</div>` : ''}
      ${cd.time || cd.description ? `<p ${R('lead')} style="margin-top:20px">${[cd.time ? 'From ' + esc(I.fmtClock(cd.time)) : '', esc(cd.description || '')].filter(Boolean).join(' · ')}</p>` : ''}
    </div>
  </section>`;
}

function venues(data) {
  const l = data.locations || {};
  const items = (l.items || []).filter(x => x && (x.name || x.addr || x.label));
  if (l.enabled === false || !items.length) return '';
  return `
  <section class="sec" style="padding-top:0">
    <div class="wrap">
      <p ${R('small')}>${esc(l.label || 'Where')}</p>
      <h2 ${R('h2')} data-fit>${esc(l.title || 'By the water')}</h2>
      <div class="venues">
        ${items.map(x => `
          <article ${R('venue')}>
            ${x.img ? `<figure>${I.img(x.img, x.name)}</figure>` : ''}
            <div class="venue-body">
              ${x.label ? `<p class="small">${esc(x.label)}</p>` : ''}
              ${x.name ? `<h3>${esc(x.name)}</h3>` : ''}
              ${x.addr ? `<p>${I.nl2br(x.addr)}</p>` : ''}
              ${x.time ? `<p class="time">${esc(x.time)}</p>` : ''}
              ${x.url ? `<a class="pill" href="${esc(I.mapHref(x.url))}" target="_blank" rel="noopener">Directions ↗</a>` : ''}
            </div>
          </article>`).join('')}
      </div>
    </div>
  </section>`;
}

function evening(data) {
  const t = data.timeline || {};
  const items = (t.items || []).filter(x => x && (x.time || x.title));
  if (t.enabled === false || !items.length) return '';
  return `
  <section class="sec" style="padding-top:0">
    <div class="wrap">
      <p ${R('small')}>${esc(t.label || 'The evening')}</p>
      <h2 ${R('h2')} data-fit>${esc(t.title || 'How the evening goes')}</h2>
      <ol class="tl">
        ${items.map(x => `
          <li ${R()}>
            ${LEMON}
            <div>
              ${x.time ? `<p class="t">${esc(x.time)}</p>` : ''}
              <h3>${esc(x.title || '')}</h3>
              ${x.subtitle ? `<p>${esc(x.subtitle)}</p>` : ''}
              ${x.url ? `<p><a href="${esc(I.mapHref(x.url))}" target="_blank" rel="noopener">Map ↗</a></p>` : ''}
            </div>
          </li>`).join('')}
      </ol>
    </div>
  </section>`;
}

function snaps(data) {
  const g = data.gallery || {}, gf = data.gifts || {};
  const photos = (g.enabled !== false ? (g.items || []) : []).filter(x => x && x.url).slice(0, 6);
  const accounts = (gf.items || []).filter(x => x && x.account);
  const gifts = gf.enabled !== false && (accounts.length || gf.description);
  if (!photos.length && !gifts) return '';
  return `
  <div class="tiles" aria-hidden="true"></div>
  <section class="sec">
    <div class="wrap">
      ${photos.length ? `
        <p ${R('small')}>${esc(g.label || 'Us')}</p>
        ${g.title ? `<h2 ${R('h2')} data-fit>${esc(g.title)}</h2>` : ''}
        <div class="snaps">${photos.map(x => `<figure ${R()}>${I.img(x.url, x.caption || 'Photo')}</figure>`).join('')}</div>` : ''}
      ${gifts ? `
        <div class="notes" style="margin-top:${photos.length ? 50 : 0}px">
          <div ${R('note')}>
            <p class="small">${esc(gf.label || 'Gifts')}</p>
            <h3>${esc(gf.title || 'Gifts')}</h3>
            ${gf.description ? `<p>${I.nl2br(gf.description)}</p>` : ''}
            ${accounts.map(x => `<div class="acct"><span><b>${esc(x.bank || 'Account')}</b> · ${esc(x.account)}</span><button type="button" class="copy" data-copy="${esc(x.account)}">Copy</button></div>`).join('')}
          </div>
        </div>` : ''}
    </div>
  </section>`;
}

function postcard(data) {
  const r = data.rsvp || {};
  if (r.enabled === false) return '';
  return `
  <section class="sec" id="rsvp" style="padding-top:0">
    <div class="wrap">
      <p ${R('small')}>${esc(r.label || 'Write back')}</p>
      <div ${R('postcard')}>
        <div class="postcard-in">
          <div class="pc-l">
            <h2>${esc(r.title || 'Will you join us?')}</h2>
            ${r.description ? `<p class="desc">${I.nl2br(r.description)}</p>` : ''}
            ${I.rsvpNotes(r).map(n => `<p class="notes-line">${esc(n)}</p>`).join('')}
            ${I.contactHtml(r, { intro: 'Questions? Write to' })}
          </div>
          <div class="pc-r">
            <div class="stamp" aria-hidden="true">${STAMP}</div>
            ${I.rsvpForm(r, {
              yes: 'Yes, with joy', no: 'Sadly, no',
              nameLabel: 'From', namePlaceholder: 'Your name(s)',
              countLabel: 'How many of you', wishesLabel: 'A message for the couple',
              wishesPlaceholder: 'Auguri…', button: r.buttonText || 'Send the postcard',
              doneTitle: 'Postcard sent'
            })}
          </div>
        </div>
      </div>
    </div>
  </section>`;
}

function build(data) {
  const c = data.cover || {};
  document.title = (c.names || data.title || 'Engagement') + ' — Engagement Invitation';
  document.getElementById('app').innerHTML = [
    c.enabled !== false ? hero(data) : '',
    story(data), countdown(data), venues(data), evening(data), snaps(data), postcard(data),
    `<footer>${BRANCH('')}<p>Con amore, ${esc(c.names || '')}</p></footer>`
  ].join('');
}

Invite.boot(build, DEFAULT_DATA);
</script>
</body>
</html>
