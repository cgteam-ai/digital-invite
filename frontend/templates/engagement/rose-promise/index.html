<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f7e9e5">
<title>Engagement Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Pinyon Script: a delicate copperplate hand for the names. Castoro: a soft, bookish serif with a
     beautiful italic for everything else. -->
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Castoro:ital@0;1&display=swap" rel="stylesheet">
<script src="../../../shared/config.js"></script>
<style>
  /*
   * ROSE PROMISE — a romantic engagement invitation.
   * Blush and ivory like pressed petals, slim cathedral-arch photo windows with a gold hairline,
   * line-drawn botanical sprigs that draw themselves, copperplate names, slow soft reveals and a
   * reply card sealed with the couple's initials.
   */
  :root {
    --ivory: #fdf8f4;
    --blush: #f7e9e5;
    --petal: #efd3cd;
    --rose:  #d69a98;
    --mauve: #9b6b72;
    --wine:  #6b3a45;
    --ink:   #4b3136;
    --soft:  rgba(75,49,54,.68);
    --gold:  #c4a26a;
    --sage:  #a9b69b;
    --script: 'Pinyon Script', 'Snell Roundhand', cursive;
    --serif:  'Castoro', 'Iowan Old Style', Georgia, serif;
    --pad: clamp(20px, 6vw, 48px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { max-width: 100%; overflow-x: hidden; }
  @supports (overflow: clip) { html, body { overflow-x: clip; } }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body { color: var(--ink); font-family: var(--serif); font-size: 17px; line-height: 1.65; -webkit-tap-highlight-color: transparent;
         background: radial-gradient(90% 60% at 100% 0%, #f3dcd6 0%, transparent 60%) no-repeat,
                     radial-gradient(80% 50% at 0% 40%, #f9ece6 0%, transparent 60%) no-repeat, var(--ivory); }
  img, video, svg { display: block; max-width: 100%; }
  a { color: inherit; }
  button, input, select, textarea { font: inherit; color: inherit; }

  .wrap { width: min(100%, 960px); margin: 0 auto; padding: 0 var(--pad); }
  .sec { position: relative; padding: clamp(60px, 13vw, 120px) 0; text-align: center; }
  .small { font-size: .74rem; letter-spacing: .3em; text-transform: uppercase; color: var(--mauve); }
  .script { font-family: var(--script); font-weight: 400; color: var(--wine); line-height: 1.1; }
  .h2 { font-family: var(--script); font-weight: 400; color: var(--wine); line-height: 1.05; font-size: calc(clamp(2.8rem, 12vw, 4.6rem) * var(--fit, 1)); margin-top: 6px; }
  .lead { font-style: italic; color: var(--soft); max-width: 42ch; margin: 10px auto 0; font-size: 1.1rem; }

  /* A slow, soft reveal (opacity and a little movement only). */
  .rv { opacity: 0; transform: translateY(16px) scale(.985); transition: opacity 1.6s ease, transform 1.8s cubic-bezier(.2,.7,.2,1); }
  .rv.in { opacity: 1; transform: none; }

  /* Botanical sprig line art that draws itself. */
  .sprig path { fill: none; stroke: var(--sage); stroke-width: 1.4; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 3s ease .4s; }
  .sprig .bud { fill: var(--rose); stroke: none; opacity: 0; transition: opacity 1.4s ease 2.2s; }
  .is-ready .sprig path, .sprig.in path { stroke-dashoffset: 0; }
  .is-ready .sprig .bud, .sprig.in .bud { opacity: .85; }

  /* ── HERO ── */
  .hero { position: relative; padding: calc(env(safe-area-inset-top) + 34px) 0 60px; text-align: center; overflow: hidden; }
  .hero-grid { display: grid; gap: 20px; align-items: center; }
  .arch { position: relative; width: min(72vw, 360px); margin: 16px auto 0; }
  .arch .win { aspect-ratio: 5 / 7.4; border-radius: 999px 999px 0 0; overflow: hidden; background: var(--petal); }
  .arch .win img, .arch .win video { width: 100%; height: 100%; object-fit: cover; transform: scale(1.08); transition: transform 3.2s cubic-bezier(.2,.7,.2,1); }
  .is-ready .arch .win img, .is-ready .arch .win video { transform: none; }
  .arch::after { content: ''; position: absolute; inset: -12px -12px 12px 12px; border: 1px solid var(--gold); border-radius: 999px 999px 0 0; pointer-events: none; }
  .arch .sprig { position: absolute; width: 58%; left: -22%; bottom: -8%; z-index: 2; }
  .arch .sprig.r { left: auto; right: -20%; top: 8%; bottom: auto; width: 44%; transform: scaleX(-1) rotate(20deg); }
  .arch.empty .win { display: grid; place-items: center; background: linear-gradient(160deg, #f6dcd6, #f9ede8); }
  .arch.empty .win span { font-family: var(--script); font-size: 6rem; color: var(--rose); }
  .together { font-size: .74rem; letter-spacing: .32em; text-transform: uppercase; color: var(--mauve); }
  .names { font-family: var(--script); font-weight: 400; color: var(--wine); line-height: .95; font-size: calc(clamp(3.6rem, 17vw, 6.6rem) * var(--fit, 1)); margin-top: 12px; }
  .names span { display: block; }
  .names .amp { font-family: var(--serif); font-style: italic; font-size: .42em; color: var(--gold); line-height: 1.4; }
  .engaged { font-style: italic; font-size: clamp(1.1rem, 4.4vw, 1.35rem); color: var(--soft); margin-top: 10px; }
  .hero-date { display: inline-flex; align-items: center; gap: 14px; margin-top: 20px; font-size: .9rem; letter-spacing: .32em; color: var(--ink); }
  .hero-date::before, .hero-date::after { content: ''; width: 34px; height: 1px; background: var(--gold); }
  .hero-place { font-style: italic; color: var(--soft); margin-top: 4px; }
  .hero-in > * { opacity: 0; transform: translateY(14px); transition: opacity 1.8s ease, transform 1.8s cubic-bezier(.2,.7,.2,1); }
  .is-ready .hero-in > * { opacity: 1; transform: none; }
  .hero-in > *:nth-child(2) { transition-delay: .35s; } .hero-in > *:nth-child(3) { transition-delay: .7s; } .hero-in > *:nth-child(n+4) { transition-delay: 1s; }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 50px; margin-top: 26px; padding: 0 30px; border-radius: 999px;
         border: 1px solid var(--rose); color: var(--wine); text-decoration: none; letter-spacing: .2em; text-transform: uppercase; font-size: .72rem; transition: background .5s, color .5s; }
  .btn:hover { background: var(--wine); border-color: var(--wine); color: var(--ivory); }
  @media (min-width: 880px) {
    .hero { min-height: 100vh; min-height: 100svh; display: grid; align-items: center; }
    .hero-grid { grid-template-columns: .9fr 1.1fr; gap: 60px; }
    .arch { width: min(100%, 380px); }
  }

  /* ── STORY / QUOTE ── */
  .story { max-width: 640px; margin: 0 auto; }
  .story .body { font-size: clamp(1.15rem, 4.4vw, 1.4rem); line-height: 1.7; color: var(--ink); margin-top: 18px; }
  .story figure { width: min(58vw, 260px); margin: 26px auto 0; aspect-ratio: 4 / 5; border-radius: 999px 999px 0 0; overflow: hidden; }
  .story figure img { width: 100%; height: 100%; object-fit: cover; }

  /* ── FAMILIES ── */
  .fams { display: grid; gap: 14px; align-items: center; margin-top: 26px; }
  @media (min-width: 700px) { .fams { grid-template-columns: 1fr auto 1fr; gap: 30px; } }
  .fam small { display: block; font-size: .7rem; letter-spacing: .26em; text-transform: uppercase; color: var(--mauve); }
  .fam p { font-size: 1.25rem; margin-top: 4px; overflow-wrap: anywhere; }
  .fam-amp { font-family: var(--script); font-size: 3rem; color: var(--gold); line-height: 1; }

  /* ── COUNTDOWN: gold-ringed circles ── */
  .cd { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(8px, 3vw, 26px); max-width: 640px; margin: 30px auto 0; }
  .cd-cell { position: relative; aspect-ratio: 1; display: grid; place-content: center; border-radius: 50%; border: 1px solid var(--gold); background: rgba(255,255,255,.55); min-width: 0; }
  .cd-cell::before { content: ''; position: absolute; inset: 4px; border-radius: 50%; border: 1px solid rgba(196,162,106,.3); }
  .cd-num { font-size: clamp(1.35rem, 6.8vw, 2.6rem); line-height: 1; color: var(--wine); font-variant-numeric: lining-nums tabular-nums; }
  .cd-unit { font-size: clamp(.5rem, 2vw, .66rem); letter-spacing: .16em; text-transform: uppercase; color: var(--mauve); margin-top: 4px; }
  .cd-note { grid-column: 1 / -1; font-family: var(--script); font-size: 3rem; color: var(--wine); }

  /* ── VENUES ── */
  .venues { display: grid; gap: 50px; margin-top: 40px; }
  @media (min-width: 760px) { .venues { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 40px; } }
  .venue figure { position: relative; width: min(64vw, 260px); margin: 0 auto 22px; aspect-ratio: 3 / 4; }
  .venue figure .w { position: absolute; inset: 0; border-radius: 999px 999px 0 0; overflow: hidden; background: var(--petal); }
  .venue figure img { width: 100%; height: 100%; object-fit: cover; }
  .venue figure::after { content: ''; position: absolute; inset: 10px -10px -10px 10px; border: 1px solid var(--gold); border-radius: 999px 999px 0 0; z-index: -1; }
  .venue h3 { font-weight: 400; font-size: clamp(1.5rem, 6vw, 1.9rem); color: var(--wine); margin-top: 8px; line-height: 1.2; overflow-wrap: anywhere; }
  .venue p { color: var(--soft); overflow-wrap: anywhere; }
  .venue .time { font-style: italic; color: var(--ink); }
  .link { display: inline-flex; align-items: center; min-height: 44px; margin-top: 8px; color: var(--mauve); letter-spacing: .2em; text-transform: uppercase; font-size: .7rem; text-decoration: none; border-bottom: 1px solid var(--rose); }

  /* ── TIMELINE ── */
  .tl { list-style: none; position: relative; max-width: 700px; margin: 36px auto 0; }
  .tl::before { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: linear-gradient(transparent, var(--rose), transparent); }
  .tl li { position: relative; display: grid; grid-template-columns: 1fr 30px 1fr; gap: 12px; align-items: start; padding: 14px 0; }
  .tl .dot { grid-column: 2; width: 13px; height: 13px; margin: 9px auto 0; border-radius: 50%; background: var(--ivory); border: 1px solid var(--gold); box-shadow: 0 0 0 5px var(--ivory); }
  .tl .t { grid-column: 1; text-align: right; font-style: italic; color: var(--mauve); font-size: 1.1rem; }
  .tl .what { grid-column: 3; text-align: left; min-width: 0; }
  .tl h3 { font-weight: 400; font-size: 1.2rem; color: var(--wine); line-height: 1.3; overflow-wrap: anywhere; }
  .tl p { color: var(--soft); font-size: .95rem; }
  .tl a { color: var(--mauve); }

  /* ── GALLERY: arches of different heights ── */
  .arches { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(8px, 2.5vw, 18px); align-items: end; margin-top: 36px; }
  .arches figure { border-radius: 999px 999px 0 0; overflow: hidden; aspect-ratio: 3 / 5; background: var(--petal); }
  .arches figure:nth-child(3n+2) { aspect-ratio: 3 / 6; }
  .arches img { width: 100%; height: 100%; object-fit: cover; }

  /* ── GIFTS / HOSTS ── */
  .gift { max-width: 560px; margin: 26px auto 0; }
  .gift .acct { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 12px; margin-top: 12px; }
  .copy { min-height: 40px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--rose); background: transparent; color: var(--wine); letter-spacing: .16em; text-transform: uppercase; font-size: .66rem; cursor: pointer; }

  /* ── REPLY: an envelope card sealed with the initials ── */
  .envelope { position: relative; max-width: 560px; margin: 40px auto 0; padding-top: 46px; }
  .envelope .flap { position: absolute; left: 0; right: 0; top: 0; height: 120px; background: var(--petal); clip-path: polygon(0 0, 100% 0, 50% 100%); border-radius: 18px 18px 0 0; }
  .seal { position: absolute; left: 50%; top: 40px; z-index: 3; translate: -50% 0; width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center;
          background: radial-gradient(circle at 35% 30%, #b86c77, #7d3f4b 70%); box-shadow: 0 8px 18px rgba(107,58,69,.35), inset 0 2px 4px rgba(255,255,255,.25);
          font-family: var(--script); font-size: 1.7rem; color: #f5dfd9; }
  .letter { position: relative; z-index: 2; background: #fffdfb; border-radius: 16px; padding: 86px clamp(20px, 7vw, 50px) clamp(30px, 7vw, 44px); box-shadow: 0 30px 60px rgba(107,58,69,.12); border: 1px solid rgba(214,154,152,.25); }
  .letter h2 { font-family: var(--script); font-weight: 400; font-size: clamp(2.6rem, 11vw, 3.6rem); line-height: 1.05; color: var(--wine); }
  .letter .desc { font-style: italic; color: var(--soft); margin-top: 6px; }
  .letter .notes-line { font-size: .72rem; letter-spacing: .22em; text-transform: uppercase; color: var(--mauve); margin-top: 10px; }
  .rsvp { display: grid; gap: 16px; margin-top: 26px; text-align: left; }
  .rsvp-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .rsvp-choice { position: relative; display: flex; align-items: center; justify-content: center; text-align: center; min-height: 54px; padding: 8px 10px; border-radius: 999px; cursor: pointer;
                 border: 1px solid rgba(214,154,152,.6); font-style: italic; font-size: 1.02rem; line-height: 1.2; color: var(--wine); transition: background .5s, color .5s, border-color .5s; }
  .rsvp-choice input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .rsvp-choice.on { background: var(--wine); border-color: var(--wine); color: var(--ivory); }
  .rsvp-choice:focus-within { outline: 1px solid var(--gold); outline-offset: 3px; }
  .rsvp-field { display: grid; gap: 2px; }
  .rsvp-label { font-size: .68rem; letter-spacing: .24em; text-transform: uppercase; color: var(--mauve); }
  .rsvp-input { width: 100%; min-height: 48px; padding: 8px 2px; border: 0; border-bottom: 1px solid rgba(155,107,114,.4); border-radius: 0; background: transparent; color: var(--ink); font-size: 17px; }
  textarea.rsvp-input { resize: none; min-height: 72px; }
  .rsvp-input::placeholder { color: rgba(75,49,54,.4); font-style: italic; }
  .rsvp-input:focus { outline: none; border-bottom-color: var(--wine); }
  .rsvp-error { color: #9b2c3a; font-style: italic; }
  .rsvp-submit { min-height: 56px; margin-top: 6px; border: 0; border-radius: 999px; cursor: pointer; background: var(--wine); color: var(--ivory); letter-spacing: .24em; text-transform: uppercase; font-size: .76rem; transition: background .5s; }
  .rsvp-submit:hover { background: var(--mauve); }
  .rsvp-done { margin-top: 26px; }
  .rsvp-done-title { font-family: var(--script); font-size: 3rem; color: var(--wine); line-height: 1.1; }
  .rsvp-done-body { font-style: italic; color: var(--soft); }
  .contact { margin-top: 28px; padding-top: 20px; border-top: 1px solid rgba(214,154,152,.35); }
  .contact-intro { font-size: .68rem; letter-spacing: .24em; text-transform: uppercase; color: var(--mauve); }
  .contact-name { font-size: 1.25rem; color: var(--wine); }
  .contact-phone { color: var(--soft); }
  .contact-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 10px; }
  .contact-link { display: inline-flex; align-items: center; min-height: 42px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--rose); color: var(--wine); letter-spacing: .14em; text-transform: uppercase; font-size: .66rem; text-decoration: none; }

  footer { text-align: center; padding: 10px var(--pad) calc(env(safe-area-inset-bottom) + 70px); }
  footer .mono { font-family: var(--script); font-size: 3.4rem; color: var(--wine); line-height: 1; }
  footer p { font-style: italic; color: var(--soft); margin-top: 8px; }

  @media (prefers-reduced-motion: reduce) {
    .rv, .hero-in > * { opacity: 1; transform: none; transition: none; }
    .sprig path { stroke-dashoffset: 0; transition: none; } .sprig .bud { opacity: .85; transition: none; }
    .arch .win img, .arch .win video { transform: none; transition: none; }
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>
<main id="app"></main>

<script src="../../../shared/demo-data.js"></script>
<script src="../../../shared/invitation-core.js"></script>
<script src="../../../shared/invitation-music.js" defer></script>
<script src="../../../shared/rsvp-guest-picker.js" defer></script>
<script>
const A = '/assets/rose-promise/';
const DEFAULT_DATA = {
  template: 'rose-promise',
  title: 'Name & Name',
  cover: {
    enabled: true, headline: 'invite you to celebrate their engagement', eventLabel: 'Together with their families',
    names: 'Name & Name', tagline: '', greeting: 'Dear', hostIntro: '', hostOutro: '', hostText: '',
    image: A + 'cover.jpg', video: '', buttonText: 'Kindly reply'
  },
  countdown: { enabled: true, label: 'Counting down to forever', date: '', time: '', tzOffset: null, description: '', image: '' },
  families:  { enabled: true, label: 'With the blessing of', title: '', items: [] },
  locations: { enabled: true, label: 'Where', title: 'The celebration', image: '', items: [
    { label: 'Engagement party', time: '', name: '', addr: '', url: '', img: A + 'venue.jpg' }
  ] },
  timeline:  { enabled: true, label: 'The evening', title: 'Our evening together', items: [] },
  gallery:   { enabled: true, label: 'Moments', title: 'Us', items: [
    { url: A + 'gallery-1.jpg', caption: '' }, { url: A + 'rings.jpg', caption: '' }, { url: A + 'gallery-2.jpg', caption: '' }
  ] },
  gifts:     { enabled: false, label: 'With love', title: 'Gifts', description: '', image: '', items: [] },
  rsvp: {
    enabled: true, label: 'Kindly reply', title: 'Will you celebrate with us?', description: '',
    deadline: '', maxPeople: 4, buttonText: 'Send reply', allowWishes: true, image: '',
    contactName: '', contactPhone: '', contactLink: ''
  },
  memories: { enabled: false, title: '', description: '', url: '', buttonText: '' },
  music:    { enabled: false, url: '', autoplay: true },
  customSections: []
};

const I = Invite, esc = I.esc;
const R = (cls, extra) => `class="${cls ? cls + ' ' : ''}rv"${extra ? ' ' + extra : ''}`;

const SPRIG = (cls) => `<svg class="sprig ${cls || ''}" viewBox="0 0 160 160" aria-hidden="true">
  <path pathLength="1" d="M10 150 C40 120 70 100 150 20"/>
  <path pathLength="1" d="M52 112 C40 96 42 80 56 72 C62 88 62 100 52 112 Z"/>
  <path pathLength="1" d="M80 88 C96 84 108 90 112 104 C96 106 86 100 80 88 Z"/>
  <path pathLength="1" d="M96 66 C86 52 90 38 104 32 C108 48 106 58 96 66 Z"/>
  <path pathLength="1" d="M122 46 C136 44 146 52 148 64 C134 64 126 58 122 46 Z"/>
  <path pathLength="1" d="M30 132 C20 122 20 110 30 104 C36 116 36 124 30 132 Z"/>
  <circle class="bud" cx="150" cy="20" r="6"/><circle class="bud" cx="104" cy="30" r="4"/>
</svg>`;

function hero(data) {
  const c = data.cover || {}, cd = data.countdown || {};
  const parts = I.splitNames(c.names || data.title || '');
  const dp = I.dateParts(cd);
  const place = ((data.locations || {}).items || []).find(x => x && x.name);
  const guest = I.guestName();
  const photo = I.media(c.image, c.video, c.names, true);
  return `
  <section class="hero">
    <div class="wrap hero-grid">
      <div class="arch${photo ? '' : ' empty'}">
        <div class="win">${photo || `<span>${esc(I.initials(c.names))}</span>`}</div>
        ${SPRIG('l')}${SPRIG('r')}
      </div>
      <div class="hero-in">
        <p class="together">${guest ? `${esc(c.greeting || 'Dear')} ${esc(guest)}` : esc(c.eventLabel || 'Together with their families')}</p>
        <h1 class="names" data-fit=".45">
          <span>${esc(parts[0] || '')}</span>
          ${parts.length > 1 ? `<span class="amp">&amp;</span><span>${esc(parts.slice(1).join(' & '))}</span>` : ''}
        </h1>
        ${c.headline ? `<p class="engaged">${esc(c.headline)}</p>` : ''}
        ${dp ? `<p class="hero-date">${I.pad2(dp.d)} · ${I.pad2(dp.mo)} · ${dp.y}</p>` : ''}
        ${place || cd.description ? `<p class="hero-place">${esc(cd.description || place.name)}</p>` : ''}
        <div><a class="btn" href="#rsvp">${esc(c.buttonText || 'Kindly reply')}</a></div>
      </div>
    </div>
  </section>`;
}

function story(data) {
  const out = [];
  (data.customSections || []).filter(s => s && s.enabled !== false && (s.title || s.body)).forEach(s => out.push(`
    <section class="sec" style="padding-bottom:0">
      <div class="wrap story">
        ${s.label ? `<p ${R('small')}>${esc(s.label)}</p>` : ''}
        ${s.title ? `<h2 ${R('h2')} data-fit>${esc(s.title)}</h2>` : ''}
        ${s.body ? `<p ${R('body')}>${I.nl2br(s.body)}</p>` : ''}
        ${s.image ? `<figure ${R()}>${I.img(s.image, s.title)}</figure>` : ''}
      </div>
    </section>`));
  const f = data.families || {}, c = data.cover || {};
  const fams = (f.enabled !== false ? (f.items || []) : []).filter(x => x && (x.names || x.label));
  if (fams.length || c.hostText) out.push(`
    <section class="sec" style="padding-bottom:0">
      <div class="wrap">
        <p ${R('small')}>${esc(f.label || 'With the blessing of')}</p>
        ${c.hostText ? `<p ${R('lead')}>${I.nl2br(c.hostText)}</p>` : ''}
        ${fams.length ? `<div ${R('fams')}>${fams.map((x, i) => `
          ${i > 0 ? '<span class="fam-amp" aria-hidden="true">&amp;</span>' : ''}
          <div class="fam">${x.label ? `<small>${esc(x.label)}</small>` : ''}<p>${esc(x.names || '')}</p></div>`).join('')}</div>` : ''}
        ${c.hostOutro ? `<p ${R('lead')}>${I.nl2br(c.hostOutro)}</p>` : ''}
      </div>
    </section>`);
  return out.join('');
}

function countdown(data) {
  const cd = data.countdown || {};
  if (cd.enabled === false) return '';
  const target = I.eventInstant(cd);
  const dp = I.dateParts(cd);
  return `
  <section class="sec">
    <div class="wrap">
      <h2 ${R('h2')} data-fit>${esc(cd.label || 'Counting down to forever')}</h2>
      ${dp ? `<p ${R('lead')}>${esc(dp.long)}${cd.time ? ', at ' + esc(I.fmtClock(cd.time)) : ''}</p>` : ''}
      ${target !== null ? `<div ${R('cd')} data-countdown="${target}" data-past-today="Tonight is the night" data-past-after="Thank you for celebrating with us">${I.countdownCells({ m: 'Mins', s: 'Secs' })}</div>` : ''}
    </div>
  </section>`;
}

function venues(data) {
  const l = data.locations || {};
  const items = (l.items || []).filter(x => x && (x.name || x.addr || x.label));
  if (l.enabled === false || !items.length) return '';
  return `
  <section class="sec" style="padding-top:0">
    <div class="wrap">
      <p ${R('small')}>${esc(l.label || 'Where')}</p>
      <h2 ${R('h2')} data-fit>${esc(l.title || 'The celebration')}</h2>
      <div class="venues">
        ${items.map(x => `
          <article ${R('venue')}>
            ${x.img ? `<figure><div class="w">${I.img(x.img, x.name)}</div></figure>` : ''}
            ${x.label ? `<p class="small">${esc(x.label)}</p>` : ''}
            ${x.name ? `<h3>${esc(x.name)}</h3>` : ''}
            ${x.addr ? `<p>${I.nl2br(x.addr)}</p>` : ''}
            ${x.time ? `<p class="time">${esc(x.time)}</p>` : ''}
            ${x.url ? `<a class="link" href="${esc(I.mapHref(x.url))}" target="_blank" rel="noopener">Directions</a>` : ''}
          </article>`).join('')}
      </div>
    </div>
  </section>`;
}

function evening(data) {
  const t = data.timeline || {};
  const items = (t.items || []).filter(x => x && (x.time || x.title));
  if (t.enabled === false || !items.length) return '';
  return `
  <section class="sec" style="padding-top:0">
    <div class="wrap">
      <p ${R('small')}>${esc(t.label || 'The evening')}</p>
      <h2 ${R('h2')} data-fit>${esc(t.title || 'Our evening together')}</h2>
      <ol class="tl">
        ${items.map(x => `
          <li ${R()}>
            <span class="t">${esc(x.time || '')}</span>
            <span class="dot" aria-hidden="true"></span>
            <div class="what">
              <h3>${esc(x.title || '')}</h3>
              ${x.subtitle ? `<p>${esc(x.subtitle)}</p>` : ''}
              ${x.url ? `<p><a href="${esc(I.mapHref(x.url))}" target="_blank" rel="noopener">Directions</a></p>` : ''}
            </div>
          </li>`).join('')}
      </ol>
    </div>
  </section>`;
}

function moments(data) {
  const g = data.gallery || {}, gf = data.gifts || {};
  const photos = (g.enabled !== false ? (g.items || []) : []).filter(x => x && x.url).slice(0, 6);
  const accounts = (gf.items || []).filter(x => x && x.account);
  const gifts = gf.enabled !== false && (accounts.length || gf.description);
  if (!photos.length && !gifts) return '';
  return `
  <section class="sec" style="padding-top:0">
    <div class="wrap">
      ${photos.length ? `
        <p ${R('small')}>${esc(g.label || 'Moments')}</p>
        ${g.title ? `<h2 ${R('h2')} data-fit>${esc(g.title)}</h2>` : ''}
        <div class="arches">${photos.map(x => `<figure ${R()}>${I.img(x.url, x.caption || 'Photo')}</figure>`).join('')}</div>` : ''}
      ${gifts ? `
        <div ${R('gift')} style="margin-top:${photos.length ? 80 : 0}px">
          <p class="small">${esc(gf.label || 'With love')}</p>
          <h2 class="h2" data-fit>${esc(gf.title || 'Gifts')}</h2>
          ${gf.description ? `<p class="lead">${I.nl2br(gf.description)}</p>` : ''}
          ${accounts.map(x => `<div class="acct"><span>${esc(x.bank || 'Account')} · ${esc(x.account)}</span><button type="button" class="copy" data-copy="${esc(x.account)}">Copy</button></div>`).join('')}
        </div>` : ''}
    </div>
  </section>`;
}

function reply(data) {
  const r = data.rsvp || {}, c = data.cover || {};
  if (r.enabled === false) return '';
  return `
  <section class="sec" id="rsvp" style="padding-top:0">
    <div class="wrap">
      <p ${R('small')}>${esc(r.label || 'Kindly reply')}</p>
      <div ${R('envelope')}>
        <div class="flap" aria-hidden="true"></div>
        <div class="seal" aria-hidden="true">${esc(I.initials(c.names) || '♡')}</div>
        <div class="letter">
          <h2>${esc(r.title || 'Will you celebrate with us?')}</h2>
          ${r.description ? `<p class="desc">${I.nl2br(r.description)}</p>` : ''}
          ${I.rsvpNotes(r).map(n => `<p class="notes-line">${esc(n)}</p>`).join('')}
          ${I.rsvpForm(r, {
            yes: 'Joyfully accepts', no: 'Regretfully declines',
            nameLabel: 'Your name(s)', namePlaceholder: 'As written on your invitation',
            countLabel: 'Number of guests', wishesLabel: 'A note for the couple',
            wishesPlaceholder: 'Wishing you a lifetime of love…', button: r.buttonText || 'Send reply',
            doneTitle: 'Thank you'
          })}
          ${I.contactHtml(r, { intro: 'For any questions' })}
        </div>
      </div>
    </div>
  </section>`;
}

function build(data) {
  const c = data.cover || {};
  document.title = (c.names || data.title || 'Engagement') + ' — Engagement Invitation';
  document.getElementById('app').innerHTML = [
    c.enabled !== false ? hero(data) : '',
    story(data), countdown(data), venues(data), evening(data), moments(data), reply(data),
    `<footer>${SPRIG('in')}<p class="mono">${esc(I.initials(c.names) || '')}</p><p>With love and gratitude</p></footer>`
  ].join('');
}

Invite.boot(build, DEFAULT_DATA);
</script>
</body>
</html>
