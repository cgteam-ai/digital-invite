<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#e3edf3">
<title>Baby Shower Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Fraunces with its "soft" axis turned up gives round, gentle serifs; Figtree keeps text friendly and clear. -->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..600,100;1,9..144,300..500,100&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<script src="../../../shared/config.js"></script>
<style>
  /*
   * LITTLE CLOUD — a soft, gender-neutral baby shower invitation.
   * A pale sky with drifting clouds, a nursery mobile (moon, star, cloud) swaying gently above the
   * title, moon-shaped countdown badges and cloud-soft cards. Butter, sage, peach and sky — never
   * pink-or-blue unless the hosts choose it.
   */
  :root {
    --sky:    #e3edf3;
    --cream:  #fffaf2;
    --butter: #f5e2a6;
    --sage:   #cddbc6;
    --peach:  #f4d3c1;
    --moon:   #f2d78a;
    --ink:    #4a4a5c;
    --soft:   rgba(74,74,92,.7);
    --line:   rgba(74,74,92,.14);
    --serif:  'Fraunces', 'Iowan Old Style', Georgia, serif;
    --sans:   'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --pad: clamp(20px, 6vw, 48px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { max-width: 100%; overflow-x: hidden; }
  @supports (overflow: clip) { html, body { overflow-x: clip; } }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body { color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.6; -webkit-tap-highlight-color: transparent;
         background: linear-gradient(180deg, var(--sky) 0, #edf3f2 700px, var(--cream) 1300px) no-repeat, var(--cream); }
  img, video, svg { display: block; max-width: 100%; }
  a { color: inherit; }
  button, input, select, textarea { font: inherit; color: inherit; }

  .wrap { width: min(100%, 940px); margin: 0 auto; padding: 0 var(--pad); }
  .sec { position: relative; padding: clamp(56px, 12vw, 108px) 0; text-align: center; }
  .serif { font-family: var(--serif); font-variation-settings: 'SOFT' 100; }
  .kicker { display: inline-block; padding: 6px 16px; border-radius: 999px; background: rgba(255,255,255,.7); font-size: .76rem; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--soft); }
  .h2 { font-family: var(--serif); font-variation-settings: 'SOFT' 100; font-weight: 400; line-height: 1.08; letter-spacing: -.01em;
        font-size: calc(clamp(2.2rem, 9vw, 3.4rem) * var(--fit, 1)); margin-top: 12px; }
  .h2 i { font-weight: 300; }
  .lead { color: var(--soft); max-width: 42ch; margin: 10px auto 0; font-size: 1.05rem; }

  .rv { opacity: 0; transform: translateY(24px); transition: opacity 1.1s ease, transform 1.2s cubic-bezier(.2,.8,.2,1); }
  .rv.in { opacity: 1; transform: none; }

  /* ── HERO ── */
  .hero { position: relative; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; text-align: center; overflow: hidden;
          padding: calc(env(safe-area-inset-top) + 190px) 0 calc(env(safe-area-inset-bottom) + 50px); }
  .cloud { position: absolute; z-index: 0; pointer-events: none; }
  .cloud path { fill: #fff; }
  .cloud.c1 { width: 190px; top: 22%; left: -60px; opacity: .9; animation: drift 38s linear infinite; }
  .cloud.c2 { width: 130px; top: 58%; right: -30px; opacity: .8; animation: drift 46s linear infinite reverse; }
  .cloud.c3 { width: 240px; bottom: 4%; left: 30%; opacity: .7; animation: drift 54s linear infinite; }
  @keyframes drift { 0% { transform: translateX(0); } 50% { transform: translateX(60px); } 100% { transform: translateX(0); } }

  /* The mobile: strings from the top, each ornament swinging from its own string. */
  .mobile { position: absolute; top: 0; left: 50%; translate: -50% 0; width: min(90vw, 360px); height: 200px; z-index: 1; pointer-events: none; }
  .mobile .bar { position: absolute; top: 56px; left: 8%; right: 8%; height: 3px; border-radius: 2px; background: #d8c8a6; }
  .mobile .hang { position: absolute; top: 0; width: 2px; background: #d8c8a6; transform-origin: 50% 0; }
  .mobile .hang.top { left: 50%; height: 57px; }
  .mobile .drop { position: absolute; top: 57px; width: 2px; transform-origin: 50% 0; animation: swing 5s ease-in-out infinite; }
  .mobile .drop::before { content: ''; position: absolute; left: 0; top: 0; width: 2px; height: var(--len); background: #d8c8a6; }
  .mobile .drop svg { position: absolute; top: var(--len); left: 50%; width: var(--size); max-width: none; translate: -50% -4px; filter: drop-shadow(0 6px 8px rgba(74,74,92,.12)); }
  .mobile .d1 { left: 14%; --len: 54px; --size: 46px; animation-delay: -1s; }
  .mobile .d2 { left: 50%; --len: 86px; --size: 58px; animation-duration: 6s; }
  .mobile .d3 { left: 86%; --len: 44px; --size: 50px; animation-delay: -2.5s; animation-duration: 5.5s; }
  @keyframes swing { 0%, 100% { transform: rotate(5deg); } 50% { transform: rotate(-5deg); } }

  .hero-in { position: relative; z-index: 2; padding: 0 var(--pad); }
  .hero-in > * { opacity: 0; transform: translateY(16px); transition: opacity 1.4s ease, transform 1.4s cubic-bezier(.2,.8,.2,1); }
  .is-ready .hero-in > * { opacity: 1; transform: none; }
  .hero-in > *:nth-child(2) { transition-delay: .2s; } .hero-in > *:nth-child(3) { transition-delay: .4s; } .hero-in > *:nth-child(n+4) { transition-delay: .6s; }
  .title { font-family: var(--serif); font-variation-settings: 'SOFT' 100; font-weight: 400; font-style: italic; line-height: 1; letter-spacing: -.02em;
           font-size: calc(clamp(3rem, 14vw, 6rem) * var(--fit, 1)); margin-top: 16px; }
  .tag { font-family: var(--serif); font-variation-settings: 'SOFT' 100; font-weight: 300; font-size: clamp(1.2rem, 5vw, 1.6rem); margin-top: 8px; color: var(--soft); }
  .honour { margin-top: 18px; font-size: .95rem; color: var(--soft); }
  .honour b { display: block; font-family: var(--serif); font-variation-settings: 'SOFT' 100; font-weight: 500; font-size: clamp(1.35rem, 5.5vw, 1.8rem); color: var(--ink); overflow-wrap: anywhere; }
  .photo-bubble { width: min(46vw, 200px); aspect-ratio: 1; margin: 20px auto 0; border-radius: 50%; overflow: hidden; border: 6px solid #fff; box-shadow: 0 18px 40px rgba(74,74,92,.14); }
  .photo-bubble img, .photo-bubble video { width: 100%; height: 100%; object-fit: cover; }

  /* A cloud-shaped card: a soft rounded body with two round bumps on top. */
  .cloudcard { position: relative; background: #fff; border-radius: 44px; box-shadow: 0 22px 50px rgba(74,74,92,.08); }
  .cloudcard::before, .cloudcard::after { content: ''; position: absolute; z-index: 0; border-radius: 50%; background: #fff; }
  .cloudcard::before { width: 34%; aspect-ratio: 1; top: -12%; left: 14%; max-width: 130px; }
  .cloudcard::after { width: 26%; aspect-ratio: 1; top: -9%; right: 18%; max-width: 100px; }
  .cloudcard > * { position: relative; z-index: 1; }
  .datecard { display: inline-grid; grid-template-columns: auto auto; gap: 4px 22px; margin-top: 30px; padding: 22px 28px; text-align: left; }
  .datecard small { display: block; font-size: .7rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--soft); }
  .datecard b { display: block; font-family: var(--serif); font-variation-settings: 'SOFT' 100; font-weight: 500; font-size: 1.15rem; line-height: 1.25; overflow-wrap: anywhere; }
  .datecard .full { grid-column: 1 / -1; }
  .btn { display: inline-flex; align-items: center; gap: 8px; min-height: 52px; margin-top: 24px; padding: 0 28px; border-radius: 999px; background: var(--ink); color: var(--cream);
         text-decoration: none; font-weight: 600; box-shadow: 0 12px 26px rgba(74,74,92,.2); transition: transform .3s; }
  .btn:hover { transform: translateY(-2px); }

  /* ── COUNTDOWN: little moons ── */
  .moons { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(8px, 3vw, 24px); max-width: 620px; margin: 30px auto 0; }
  .moons .cd-cell { position: relative; aspect-ratio: 1; border-radius: 50%; display: grid; place-content: center; min-width: 0;
                    background: radial-gradient(circle at 36% 32%, #fffbe9, #f7e7b4 60%, #efd68d); box-shadow: inset -8px -10px 0 rgba(216,186,110,.35), 0 12px 26px rgba(216,186,110,.25); animation: bob 5s ease-in-out infinite; }
  .moons .cd-cell:nth-child(2) { animation-delay: -1.2s; } .moons .cd-cell:nth-child(3) { animation-delay: -2.4s; } .moons .cd-cell:nth-child(4) { animation-delay: -3.6s; }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  .moons .cd-num { font-family: var(--serif); font-variation-settings: 'SOFT' 100; font-weight: 500; font-size: clamp(1.3rem, 6.6vw, 2.5rem); line-height: 1; font-variant-numeric: lining-nums tabular-nums; }
  .moons .cd-unit { font-size: clamp(.5rem, 2.1vw, .7rem); font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--soft); margin-top: 3px; }
  .cd-note { grid-column: 1 / -1; font-family: var(--serif); font-style: italic; font-size: 2rem; }

  /* ── DETAILS ── */
  .cards { display: grid; gap: 50px; margin-top: 50px; }
  @media (min-width: 760px) { .cards { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; } }
  .place { padding: 34px 24px 28px; }
  .place figure { width: min(62%, 220px); aspect-ratio: 1; margin: -10px auto 16px; border-radius: 50%; overflow: hidden; border: 5px solid var(--cream); }
  .place figure img { width: 100%; height: 100%; object-fit: cover; }
  .place .k { font-size: .72rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--soft); }
  .place h3 { font-family: var(--serif); font-variation-settings: 'SOFT' 100; font-weight: 500; font-size: clamp(1.5rem, 6vw, 1.9rem); line-height: 1.15; margin-top: 6px; overflow-wrap: anywhere; }
  .place p { color: var(--soft); overflow-wrap: anywhere; }
  .place .time { color: var(--ink); font-weight: 600; margin-top: 4px; }
  .pill-link { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; margin-top: 12px; padding: 0 18px; border-radius: 999px; background: var(--sage); color: #3d4c39; font-weight: 600; text-decoration: none; }

  /* ── THE AFTERNOON: a string of stars ── */
  .stars { list-style: none; position: relative; max-width: 620px; margin: 36px auto 0; text-align: left; }
  .stars::before { content: ''; position: absolute; left: 22px; top: 18px; bottom: 18px; border-left: 2px dashed #e0cf9e; }
  .stars li { position: relative; display: grid; grid-template-columns: 46px 1fr; gap: 14px; padding: 10px 0; }
  .star { width: 46px; height: 46px; display: grid; place-items: center; background: var(--cream); border-radius: 50%; }
  .star svg { width: 34px; animation: twinkle 3s ease-in-out infinite; }
  .stars li:nth-child(2n) .star svg { animation-delay: -1.5s; }
  @keyframes twinkle { 50% { transform: scale(.85) rotate(12deg); } }
  .stars .t { font-weight: 600; font-size: .85rem; letter-spacing: .08em; text-transform: uppercase; color: var(--soft); }
  .stars h3 { font-family: var(--serif); font-variation-settings: 'SOFT' 100; font-weight: 500; font-size: 1.3rem; line-height: 1.25; overflow-wrap: anywhere; }
  .stars p { color: var(--soft); }
  .stars a { color: var(--ink); font-weight: 600; }

  /* ── NOTES / REGISTRY / BUBBLES ── */
  .notes { display: grid; gap: 50px; margin-top: 50px; }
  @media (min-width: 760px) { .notes { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; } }
  .note { padding: 34px 24px 28px; }
  .note h3 { font-family: var(--serif); font-variation-settings: 'SOFT' 100; font-weight: 500; font-size: 1.5rem; line-height: 1.2; margin-top: 6px; overflow-wrap: anywhere; }
  .note p { color: var(--soft); margin-top: 6px; }
  .note figure { width: 60%; margin: 12px auto; border-radius: 24px; overflow: hidden; }
  .acct { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px; margin-top: 12px; padding: 10px 14px; border-radius: 20px; background: var(--cream); }
  .acct span { overflow-wrap: anywhere; }
  .copy { min-height: 40px; padding: 0 16px; border: 0; border-radius: 999px; background: var(--butter); color: var(--ink); font-weight: 600; cursor: pointer; }
  .bubbles { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(12px, 4vw, 26px); margin-top: 34px; }
  .bubbles figure { width: clamp(120px, 38vw, 210px); aspect-ratio: 1; border-radius: 50%; overflow: hidden; border: 6px solid #fff; box-shadow: 0 14px 30px rgba(74,74,92,.12); }
  .bubbles figure:nth-child(2n) { translate: 0 20px; width: clamp(100px, 30vw, 170px); }
  .bubbles img { width: 100%; height: 100%; object-fit: cover; }

  /* ── RSVP ── */
  .reply { max-width: 560px; margin: 60px auto 0; padding: clamp(40px, 9vw, 56px) clamp(20px, 7vw, 46px) clamp(28px, 7vw, 40px); text-align: left; }
  .reply-moon { width: 56px; margin: 0 auto 8px; }
  .reply h2 { text-align: center; font-family: var(--serif); font-variation-settings: 'SOFT' 100; font-weight: 400; font-size: clamp(1.9rem, 8vw, 2.6rem); line-height: 1.1; }
  .reply .desc { text-align: center; color: var(--soft); margin-top: 8px; }
  .reply .notes-line { text-align: center; font-weight: 600; font-size: .85rem; color: #a38745; margin-top: 8px; }
  .rsvp { display: grid; gap: 14px; margin-top: 24px; }
  .rsvp-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .rsvp-choice { position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px; padding: 8px 10px; border-radius: 999px; cursor: pointer; text-align: center; line-height: 1.15;
                 background: var(--cream); border: 2px solid transparent; font-weight: 600; transition: background .3s, border-color .3s; }
  .rsvp-choice input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .rsvp-choice::before { content: ''; flex: none; width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(74,74,92,.3); background: #fff; transition: background .3s, border-color .3s, box-shadow .3s; }
  .rsvp-choice.on { background: #fff6d8; border-color: var(--moon); }
  .rsvp-choice.on::before { background: var(--ink); border-color: var(--ink); box-shadow: inset 0 0 0 3px #fff; }
  .rsvp-choice:focus-within { outline: 2px solid var(--ink); outline-offset: 2px; }
  .rsvp-field { display: grid; gap: 6px; }
  .rsvp-label { font-size: .74rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--soft); }
  .rsvp-input { width: 100%; min-height: 52px; padding: 12px 18px; border-radius: 22px; border: 2px solid var(--cream); background: var(--cream); color: var(--ink); font-size: 16px; }
  textarea.rsvp-input { resize: none; min-height: 88px; }
  .rsvp-input::placeholder { color: rgba(74,74,92,.45); }
  .rsvp-input:focus { outline: none; border-color: var(--sage); background: #fff; }
  .rsvp-error { color: #b0473a; font-weight: 600; text-align: center; }
  .rsvp-submit { min-height: 56px; border: 0; border-radius: 999px; cursor: pointer; background: var(--ink); color: var(--cream); font-weight: 600; font-size: 1.05rem; transition: transform .2s, background .3s; }
  .rsvp-submit:hover { background: #5b5b70; }
  .rsvp-submit:active { transform: scale(.98); }
  .rsvp-done { margin-top: 20px; text-align: center; }
  .rsvp-done-title { font-family: var(--serif); font-variation-settings: 'SOFT' 100; font-style: italic; font-size: 2.2rem; }
  .rsvp-done-body { color: var(--soft); }
  .contact { margin-top: 24px; padding-top: 18px; border-top: 2px dashed var(--line); text-align: center; }
  .contact-intro { font-size: .74rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--soft); }
  .contact-name { font-family: var(--serif); font-variation-settings: 'SOFT' 100; font-size: 1.3rem; }
  .contact-phone { color: var(--soft); }
  .contact-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 10px; }
  .contact-link { display: inline-flex; align-items: center; min-height: 42px; padding: 0 16px; border-radius: 999px; background: var(--sage); color: #3d4c39; font-weight: 600; text-decoration: none; }

  footer { text-align: center; padding: 20px var(--pad) calc(env(safe-area-inset-bottom) + 70px); }
  footer svg { width: 60px; margin: 0 auto 12px; }
  footer p { font-family: var(--serif); font-variation-settings: 'SOFT' 100; font-style: italic; font-size: 1.5rem; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
    .rv, .hero-in > * { opacity: 1; transform: none; transition: none; }
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>
<main id="app"></main>

<script src="../../../shared/demo-data.js"></script>
<script src="../../../shared/invitation-core.js"></script>
<script src="../../../shared/invitation-music.js" defer></script>
<script src="../../../shared/rsvp-guest-picker.js" defer></script>
<script>
const DEFAULT_DATA = {
  template: 'little-cloud',
  title: 'Baby Shower',
  cover: {
    enabled: true, headline: 'A little one is on the way', eventLabel: 'Baby Shower', names: 'Name & Name',
    tagline: 'Please join us for a baby shower', greeting: 'Dear', hostIntro: '', hostOutro: '', hostText: '',
    image: '', video: '', buttonText: 'RSVP'
  },
  countdown: { enabled: true, label: 'Counting down', date: '', time: '', tzOffset: null, description: '', image: '' },
  families:  { enabled: false, label: 'Hosted by', title: '', items: [] },
  locations: { enabled: true, label: 'Where', title: 'Where to find us', image: '', items: [
    { label: 'Baby shower', time: '', name: '', addr: '', url: '', img: '' }
  ] },
  timeline:  { enabled: true, label: 'The plan', title: 'A sweet afternoon', items: [] },
  gallery:   { enabled: false, label: 'Waiting for you', title: '', items: [] },
  gifts:     { enabled: false, label: 'Registry', title: 'Gift registry', description: '', image: '', items: [] },
  rsvp: {
    enabled: true, label: 'RSVP', title: 'Will you join us?', description: '',
    deadline: '', maxPeople: 4, buttonText: 'Send RSVP', allowWishes: true, image: '',
    contactName: '', contactPhone: '', contactLink: ''
  },
  memories: { enabled: false, title: '', description: '', url: '', buttonText: '' },
  music:    { enabled: false, url: '', autoplay: true },
  customSections: []
};

const I = Invite, esc = I.esc;
const R = (cls, extra) => `class="${cls ? cls + ' ' : ''}rv"${extra ? ' ' + extra : ''}`;

const CLOUD = cls => `<svg class="cloud ${cls}" viewBox="0 0 200 90" aria-hidden="true"><path d="M40 86 C12 86 2 66 14 50 C4 28 32 12 52 24 C60 4 96 0 110 20 C128 6 160 14 160 38 C188 36 200 62 184 78 C178 84 170 86 160 86 Z"/></svg>`;
const MOON = `<svg viewBox="0 0 60 60" aria-hidden="true"><path d="M40 6 A26 26 0 1 0 54 44 A20 20 0 1 1 40 6 Z" fill="#f2d78a"/><circle cx="22" cy="30" r="3" fill="#e5c26c"/><circle cx="30" cy="44" r="2" fill="#e5c26c"/></svg>`;
const STAR = color => `<svg viewBox="0 0 60 60" aria-hidden="true"><path d="M30 4 L37 21 L56 23 L41 35 L46 54 L30 44 L14 54 L19 35 L4 23 L23 21 Z" fill="${color}" stroke="${color}" stroke-width="4" stroke-linejoin="round"/></svg>`;
const MINI_CLOUD = `<svg viewBox="0 0 80 50" aria-hidden="true"><path d="M18 46 C4 46 0 34 8 26 C4 14 18 6 28 12 C32 2 50 0 56 12 C68 8 78 18 74 30 C82 34 80 46 70 46 Z" fill="#ffffff" stroke="#d8c8a6" stroke-width="2"/></svg>`;

function hero(data) {
  const c = data.cover || {}, cd = data.countdown || {};
  const dp = I.dateParts(cd);
  const place = ((data.locations || {}).items || []).find(x => x && x.name);
  const guest = I.guestName();
  const photo = I.media(c.image, c.video, c.names, true);
  const facts = [
    dp ? ['Date', `${dp.weekday}, ${dp.d} ${dp.month}`] : null,
    cd.time ? ['Time', I.fmtClock(cd.time)] : null,
    place ? ['Place', place.name, true] : null
  ].filter(Boolean);
  return `
  <section class="hero">
    ${CLOUD('c1')}${CLOUD('c2')}${CLOUD('c3')}
    <div class="mobile" aria-hidden="true">
      <span class="hang top"></span><span class="bar"></span>
      <span class="drop d1">${STAR('#f4d3c1')}</span>
      <span class="drop d2">${MOON}</span>
      <span class="drop d3">${MINI_CLOUD}</span>
    </div>
    <div class="hero-in">
      <span class="kicker">${guest ? `${esc(c.greeting || 'Dear')} ${esc(guest)}` : esc(c.eventLabel || 'Baby Shower')}</span>
      <h1 class="title" data-fit=".45">${esc(c.headline || 'A little one is on the way')}</h1>
      ${c.tagline ? `<p class="tag">${esc(c.tagline)}</p>` : ''}
      ${c.names ? `<p class="honour">in honour of<b>${esc(c.names)}</b></p>` : ''}
      ${photo ? `<div class="photo-bubble">${photo}</div>` : ''}
      ${facts.length ? `<div><div class="datecard cloudcard">${facts.map(([k, v, full]) => `<div${full ? ' class="full"' : ''}><small>${k}</small><b>${esc(v)}</b></div>`).join('')}</div></div>` : ''}
      <div><a class="btn" href="#rsvp">${esc(c.buttonText || 'RSVP')}</a></div>
    </div>
  </section>`;
}

function countdown(data) {
  const cd = data.countdown || {};
  if (cd.enabled === false) return '';
  const target = I.eventInstant(cd);
  const dp = I.dateParts(cd);
  return `
  <section class="sec">
    <div class="wrap">
      <span ${R('kicker')}>${esc(cd.label || 'Counting down')}</span>
      <h2 ${R('h2')} data-fit>${dp ? `${esc(dp.weekday)}, <i>${dp.d} ${esc(dp.month)}</i>` : 'Date <i>coming soon</i>'}</h2>
      ${target !== null ? `<div ${R('moons')} data-countdown="${target}" data-past-today="Today's the day!" data-past-after="Thank you for showering us with love">${I.countdownCells({ m: 'Mins', s: 'Secs' })}</div>` : ''}
      ${cd.time || cd.description ? `<p ${R('lead')}>${[cd.time ? 'Starting at ' + esc(I.fmtClock(cd.time)) : '', esc(cd.description || '')].filter(Boolean).join(' · ')}</p>` : ''}
    </div>
  </section>`;
}

function places(data) {
  const l = data.locations || {};
  const items = (l.items || []).filter(x => x && (x.name || x.addr || x.label));
  if (l.enabled === false || !items.length) return '';
  return `
  <section class="sec" style="padding-top:0">
    <div class="wrap">
      <span ${R('kicker')}>${esc(l.label || 'Where')}</span>
      <h2 ${R('h2')} data-fit>${esc(l.title || 'Where to find us')}</h2>
      <div class="cards">
        ${items.map(x => `
          <article ${R('place cloudcard')}>
            ${x.img ? `<figure>${I.img(x.img, x.name)}</figure>` : ''}
            ${x.label ? `<p class="k">${esc(x.label)}</p>` : ''}
            ${x.name ? `<h3>${esc(x.name)}</h3>` : ''}
            ${x.addr ? `<p>${I.nl2br(x.addr)}</p>` : ''}
            ${x.time ? `<p class="time">${esc(x.time)}</p>` : ''}
            ${x.url ? `<a class="pill-link" href="${esc(I.mapHref(x.url))}" target="_blank" rel="noopener">Get directions</a>` : ''}
          </article>`).join('')}
      </div>
    </div>
  </section>`;
}

function afternoon(data) {
  const t = data.timeline || {};
  const items = (t.items || []).filter(x => x && (x.time || x.title));
  if (t.enabled === false || !items.length) return '';
  const colors = ['#f2d78a', '#f4d3c1', '#cddbc6', '#c9dbe6'];
  return `
  <section class="sec" style="padding-top:0">
    <div class="wrap">
      <span ${R('kicker')}>${esc(t.label || 'The plan')}</span>
      <h2 ${R('h2')} data-fit>${esc(t.title || 'A sweet afternoon')}</h2>
      <ol class="stars">
        ${items.map((x, i) => `
          <li ${R()}>
            <span class="star" aria-hidden="true">${STAR(colors[i % colors.length])}</span>
            <div>
              ${x.time ? `<p class="t">${esc(x.time)}</p>` : ''}
              ${x.title ? `<h3>${esc(x.title)}</h3>` : ''}
              ${x.subtitle ? `<p>${esc(x.subtitle)}</p>` : ''}
              ${x.url ? `<p><a href="${esc(I.mapHref(x.url))}" target="_blank" rel="noopener">Map ↗</a></p>` : ''}
            </div>
          </li>`).join('')}
      </ol>
    </div>
  </section>`;
}

function notes(data) {
  const c = data.cover || {}, f = data.families || {}, g = data.gifts || {}, gl = data.gallery || {};
  const fams = (f.enabled !== false ? (f.items || []) : []).filter(x => x && (x.names || x.label));
  const cards = [];
  if (c.hostText || fams.length || c.hostOutro) cards.push(`
    <div ${R('note cloudcard')}>
      <span class="kicker" style="background:var(--cream)">${esc(f.label || 'Hosted by')}</span>
      ${c.hostText ? `<h3>${I.nl2br(c.hostText)}</h3>` : ''}
      ${fams.map(x => `<p>${x.label ? esc(x.label) + ' · ' : ''}<b>${esc(x.names || '')}</b></p>`).join('')}
      ${c.hostOutro ? `<p>${I.nl2br(c.hostOutro)}</p>` : ''}
    </div>`);
  (data.customSections || []).filter(s => s && s.enabled !== false && (s.title || s.body)).forEach(s => cards.push(`
    <div ${R('note cloudcard')}>
      ${s.label ? `<span class="kicker" style="background:var(--cream)">${esc(s.label)}</span>` : ''}
      ${s.title ? `<h3>${esc(s.title)}</h3>` : ''}
      ${s.image ? `<figure>${I.img(s.image, s.title)}</figure>` : ''}
      ${s.body ? `<p>${I.nl2br(s.body)}</p>` : ''}
    </div>`));
  const accounts = (g.items || []).filter(x => x && x.account);
  if (g.enabled !== false && (accounts.length || g.description)) cards.push(`
    <div ${R('note cloudcard')}>
      <span class="kicker" style="background:var(--cream)">${esc(g.label || 'Registry')}</span>
      <h3>${esc(g.title || 'Gift registry')}</h3>
      ${g.description ? `<p>${I.nl2br(g.description)}</p>` : ''}
      ${accounts.map(x => `<div class="acct"><span><b>${esc(x.bank || 'Account')}</b> · ${esc(x.account)}</span><button type="button" class="copy" data-copy="${esc(x.account)}">Copy</button></div>`).join('')}
    </div>`);
  const photos = (gl.enabled !== false ? (gl.items || []) : []).filter(x => x && x.url).slice(0, 5);
  if (!cards.length && !photos.length) return '';
  return `
  <section class="sec" style="padding-top:0">
    <div class="wrap">
      ${cards.length ? `<div class="notes">${cards.join('')}</div>` : ''}
      ${photos.length ? `
        <div style="margin-top:${cards.length ? 70 : 0}px"><span ${R('kicker')}>${esc(gl.label || 'Waiting for you')}</span>
        ${gl.title ? `<h2 ${R('h2')} data-fit>${esc(gl.title)}</h2>` : ''}</div>
        <div class="bubbles">${photos.map(x => `<figure ${R()}>${I.img(x.url, x.caption || 'Photo')}</figure>`).join('')}</div>` : ''}
    </div>
  </section>`;
}

function rsvp(data) {
  const r = data.rsvp || {};
  if (r.enabled === false) return '';
  return `
  <section class="sec" id="rsvp" style="padding-top:0">
    <div class="wrap">
      <div ${R('reply cloudcard')}>
        <div class="reply-moon">${MOON}</div>
        <h2>${esc(r.title || 'Will you join us?')}</h2>
        ${r.description ? `<p class="desc">${I.nl2br(r.description)}</p>` : ''}
        ${I.rsvpNotes(r).map(n => `<p class="notes-line">${esc(n)}</p>`).join('')}
        ${I.rsvpForm(r, {
          yes: "Yes, I'll be there", no: "Sorry, can't come",
          nameLabel: 'Your name', namePlaceholder: 'First and last name',
          countLabel: 'Number of guests', wishesLabel: 'A wish for the little one',
          wishesPlaceholder: 'Welcome to the world, little one…', button: r.buttonText || 'Send RSVP',
          doneTitle: 'Thank you!'
        })}
        ${I.contactHtml(r, { intro: 'Questions? Contact' })}
      </div>
    </div>
  </section>`;
}

function build(data) {
  const c = data.cover || {};
  document.title = (c.headline || 'Baby Shower') + ' — Invitation';
  document.getElementById('app').innerHTML = [
    c.enabled !== false ? hero(data) : '',
    countdown(data), places(data), afternoon(data), notes(data), rsvp(data),
    `<footer>${MOON}<p>With love${c.names ? ', ' + esc(c.names) : ''}</p></footer>`
  ].join('');
}

Invite.boot(build, DEFAULT_DATA);
</script>
</body>
</html>
