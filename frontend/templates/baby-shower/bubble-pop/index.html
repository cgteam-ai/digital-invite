<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Baby Shower Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Shrikhand: a fat, bouncy display face. Poppins: a clean geometric sans. -->
<link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="../../../shared/config.js"></script>
<style>
  /*
   * BUBBLE POP — a modern, playful baby shower, for a boy or a girl.
   * White space and glossy gradient bubbles that float up, a fat bouncy title, blob-shaped cards,
   * pill-shaped countdown, a wobbly balloon-string timeline and a big rounded reply. Bright mint,
   * sky, lemon and coral — cheerful, never pink-or-blue.
   */
  :root {
    --white:  #ffffff;
    --cloud:  #f4f7fb;
    --ink:    #1d2433;
    --muted:  rgba(29,36,51,.62);
    --mint:   #35d0a5;
    --sky:    #4cc2ff;
    --lemon:  #ffd447;
    --coral:  #ff7b6b;
    --lilac:  #b79cff;
    --display: 'Shrikhand', 'Cooper Black', 'Arial Rounded MT Bold', sans-serif;
    --sans:    'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --pad: clamp(18px, 5.5vw, 44px);
    --blob: 58% 42% 55% 45% / 48% 55% 45% 52%;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { max-width: 100%; overflow-x: hidden; }
  @supports (overflow: clip) { html, body { overflow-x: clip; } }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body { background: var(--white); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.6; -webkit-tap-highlight-color: transparent; }
  img, video, svg { display: block; max-width: 100%; }
  a { color: inherit; }
  button, input, select, textarea { font: inherit; color: inherit; }

  .wrap { width: min(100%, 980px); margin: 0 auto; padding: 0 var(--pad); }
  .sec { position: relative; padding: clamp(50px, 11vw, 96px) 0; text-align: center; }
  .tag { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 999px; background: var(--cloud); font-size: .74rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .tag i { width: 10px; height: 10px; border-radius: 50%; background: var(--mint); }
  .h2 { font-family: var(--display); font-weight: 400; line-height: 1.1; letter-spacing: .01em; font-size: calc(clamp(2rem, 8.5vw, 3.4rem) * var(--fit, 1)); margin-top: 12px; }
  .h2 .c1 { color: var(--mint); } .h2 .c2 { color: var(--sky); } .h2 .c3 { color: var(--coral); } .h2 .c4 { color: var(--lilac); }
  .lead { color: var(--muted); max-width: 44ch; margin: 10px auto 0; font-size: 1.05rem; }

  /* Reveal: a springy pop. */
  .rv { opacity: 0; transform: translateY(24px) scale(.96); transition: opacity .6s ease, transform .8s cubic-bezier(.2,1.4,.4,1); }
  .rv.in { opacity: 1; transform: none; }

  /* Bubbles: glossy gradient circles that float up behind the hero. */
  .bubbles { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .bub { position: absolute; bottom: -20%; border-radius: 50%; opacity: 0; will-change: transform;
         background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.95) 0 12%, var(--c) 14%, color-mix(in srgb, var(--c) 70%, #000 10%) 100%);
         box-shadow: inset -8px -10px 20px rgba(0,0,0,.08); animation: rise var(--dur) linear var(--delay) infinite; }
  @keyframes rise { 0% { transform: translateY(0) translateX(0); opacity: 0; } 8% { opacity: .95; } 92% { opacity: .95; } 100% { transform: translateY(-140vh) translateX(var(--sway)); opacity: 0; } }

  /* ── HERO ── */
  .hero { position: relative; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; text-align: center; overflow: hidden;
          padding: calc(env(safe-area-inset-top) + 30px) 0 50px; background: linear-gradient(180deg, #f8fbff, var(--white) 70%); }
  .hero-in { position: relative; z-index: 1; }
  .hero-in > * { opacity: 0; transform: translateY(14px) scale(.96); transition: opacity .6s ease, transform .9s cubic-bezier(.2,1.4,.4,1); }
  .is-ready .hero-in > * { opacity: 1; transform: none; }
  .hero-in > *:nth-child(2) { transition-delay: .15s; } .hero-in > *:nth-child(3) { transition-delay: .3s; } .hero-in > *:nth-child(n+4) { transition-delay: .45s; }
  .title { font-family: var(--display); font-weight: 400; line-height: 1.02; letter-spacing: .01em; font-size: calc(clamp(2.9rem, 13vw, 6rem) * var(--fit, 1)); margin-top: 14px;
           background: linear-gradient(100deg, var(--mint), var(--sky) 40%, var(--lilac) 70%, var(--coral)); -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: .1em; }
  .tagline { font-weight: 500; font-size: clamp(1.05rem, 4.4vw, 1.3rem); color: var(--muted); margin-top: 6px; }
  .honour { margin-top: 18px; display: inline-block; padding: 10px 20px; border-radius: 999px; background: var(--ink); color: #fff; font-weight: 600; max-width: 100%; }
  .honour small { display: block; font-size: .66rem; letter-spacing: .14em; text-transform: uppercase; opacity: .7; }
  .honour b { font-family: var(--display); font-weight: 400; font-size: 1.15rem; overflow-wrap: anywhere; }
  .photo-blob { width: min(56vw, 250px); aspect-ratio: 1; margin: 22px auto 0; border-radius: var(--blob); overflow: hidden; border: 6px solid #fff; box-shadow: 0 20px 44px rgba(29,36,51,.14); background: var(--cloud); }
  .photo-blob img, .photo-blob video { width: 100%; height: 100%; object-fit: cover; }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 22px; }
  .chips span { display: inline-flex; align-items: center; min-height: 40px; padding: 0 16px; border-radius: 999px; font-weight: 600; font-size: .9rem; background: var(--cloud); max-width: 100%; }
  .chips span:nth-child(1) { background: #dff8f0; color: #157a5c; } .chips span:nth-child(2) { background: #e2f4ff; color: #1b6fa3; } .chips span:nth-child(3) { background: #fff4cf; color: #8a6a00; }
  .cta { display: inline-flex; align-items: center; gap: 10px; min-height: 56px; margin-top: 24px; padding: 0 28px; border-radius: 999px; background: var(--ink); color: #fff; text-decoration: none; font-weight: 700;
         box-shadow: 0 14px 30px rgba(29,36,51,.22); transition: transform .3s cubic-bezier(.2,1.4,.4,1); }
  .cta:hover { transform: translateY(-3px) scale(1.03); }

  /* ── PILL COUNTDOWN ── */
  .cd { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(8px, 2.5vw, 16px); max-width: 640px; margin: 28px auto 0; }
  .cd-cell { min-width: 0; padding: clamp(14px, 4vw, 26px) 4px; border-radius: 999px; background: var(--c); color: #fff; box-shadow: inset 0 -6px 0 rgba(0,0,0,.08); }
  .cd-cell:nth-child(1) { --c: var(--mint); } .cd-cell:nth-child(2) { --c: var(--sky); } .cd-cell:nth-child(3) { --c: var(--coral); } .cd-cell:nth-child(4) { --c: var(--lilac); }
  .cd-num { display: block; font-family: var(--display); font-size: clamp(1.4rem, 6.8vw, 2.8rem); line-height: 1; }
  .cd-unit { display: block; margin-top: 4px; font-size: clamp(.5rem, 2vw, .7rem); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; opacity: .9; }
  .cd-note { grid-column: 1 / -1; font-family: var(--display); font-size: 2rem; color: var(--sky); }

  /* ── BLOB CARDS ── */
  .cards { display: grid; gap: 24px; margin-top: 30px; }
  @media (min-width: 760px) { .cards { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); } }
  .blob-card { position: relative; padding: 30px 26px; background: var(--cloud); border-radius: 34px; text-align: left; }
  .blob-card::before { content: ''; position: absolute; right: -14px; top: -14px; width: 64px; height: 64px; border-radius: var(--blob); background: var(--c, var(--lemon)); }
  .blob-card figure { margin: -30px -26px 18px; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 34px 34px 0 0; }
  .blob-card figure img { width: 100%; height: 100%; object-fit: cover; }
  .blob-card h3 { font-family: var(--display); font-weight: 400; font-size: clamp(1.4rem, 6vw, 1.8rem); line-height: 1.15; margin-top: 6px; overflow-wrap: anywhere; }
  .blob-card p { color: var(--muted); overflow-wrap: anywhere; }
  .blob-card .time { color: var(--ink); font-weight: 700; margin-top: 4px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; margin-top: 12px; padding: 0 18px; border-radius: 999px; background: var(--ink); color: #fff; font-weight: 600; text-decoration: none; }

  /* ── BALLOON STRING TIMELINE ── */
  .string { list-style: none; position: relative; max-width: 560px; margin: 30px auto 0; text-align: left; padding-left: 40px; }
  .string::before { content: ''; position: absolute; left: 13px; top: 10px; bottom: 10px; width: 2px; background: repeating-linear-gradient(180deg, var(--ink) 0 6px, transparent 6px 12px); opacity: .35; }
  .string li { position: relative; padding: 0 0 24px; }
  .string li::before { content: ''; position: absolute; left: -38px; top: 2px; width: 22px; height: 26px; border-radius: 50% 50% 50% 50% / 45% 45% 55% 55%; background: var(--c); }
  .string li::after { content: ''; position: absolute; left: -29px; top: 26px; width: 4px; height: 6px; background: var(--c); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .string li:nth-child(4n+1) { --c: var(--mint); } .string li:nth-child(4n+2) { --c: var(--sky); } .string li:nth-child(4n+3) { --c: var(--coral); } .string li:nth-child(4n) { --c: var(--lemon); }
  .string .t { font-size: .74rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .string h3 { font-weight: 700; font-size: 1.2rem; line-height: 1.25; overflow-wrap: anywhere; }
  .string h3 .ic { font-family: 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif; margin-right: 6px; }
  .string p { color: var(--muted); }
  .string a { font-weight: 700; }

  /* ── NOTES & BUBBLE GALLERY ── */
  .notes { display: grid; gap: 24px; margin-top: 30px; }
  @media (min-width: 760px) { .notes { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); } }
  .notes .blob-card:nth-child(2n) { --c: var(--sky); } .notes .blob-card:nth-child(3n) { --c: var(--coral); }
  .notes figure { margin: 12px 0; border-radius: 24px; overflow: hidden; }
  .acct { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-top: 12px; padding: 12px 14px; border-radius: 18px; background: #fff; }
  .acct span { overflow-wrap: anywhere; }
  .copy { min-height: 40px; padding: 0 16px; border: 0; border-radius: 999px; background: var(--lemon); color: var(--ink); font-weight: 700; cursor: pointer; }
  .pops { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: clamp(10px, 3vw, 22px); margin-top: 30px; }
  .pops figure { width: clamp(120px, 38vw, 220px); aspect-ratio: 1; border-radius: 50%; overflow: hidden; border: 6px solid #fff; box-shadow: 0 16px 34px rgba(29,36,51,.14); background: var(--cloud); }
  .pops figure:nth-child(2n) { width: clamp(96px, 28vw, 170px); border-radius: var(--blob); }
  .pops img { width: 100%; height: 100%; object-fit: cover; }

  /* ── RSVP ── */
  .reply { max-width: 580px; margin: 30px auto 0; padding: clamp(24px, 6vw, 40px); border-radius: 40px; background: var(--cloud); text-align: left; position: relative; }
  .reply .bub-mini { position: absolute; width: 54px; height: 54px; right: -10px; top: -22px; border-radius: 50%; background: radial-gradient(circle at 32% 28%, #fff 0 12%, var(--coral) 14%); }
  .reply h2 { font-family: var(--display); font-weight: 400; text-align: center; font-size: clamp(1.9rem, 8vw, 2.7rem); line-height: 1.1; }
  .reply .desc { text-align: center; color: var(--muted); margin-top: 8px; }
  .reply .notes-line { text-align: center; margin-top: 8px; font-size: .78rem; font-weight: 700; color: #1b6fa3; }
  .rsvp { display: grid; gap: 14px; margin-top: 22px; }
  .rsvp-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .rsvp-choice { position: relative; display: flex; align-items: center; justify-content: center; text-align: center; min-height: 58px; padding: 8px 10px; border-radius: 999px; cursor: pointer;
                 background: #fff; border: 2px solid transparent; font-weight: 700; line-height: 1.15; transition: background .3s, transform .3s cubic-bezier(.2,1.4,.4,1); }
  .rsvp-choice input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .rsvp-choice.on { background: var(--mint); color: #fff; transform: scale(1.04); }
  .rsvp-choice:nth-child(2).on { background: var(--coral); }
  .rsvp-choice:focus-within { outline: 2px solid var(--sky); outline-offset: 2px; }
  .rsvp-field { display: grid; gap: 6px; }
  .rsvp-label { font-size: .72rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .rsvp-input { width: 100%; min-height: 54px; padding: 12px 20px; border-radius: 999px; border: 2px solid #fff; background: #fff; color: var(--ink); font-size: 16px; }
  textarea.rsvp-input { resize: none; min-height: 96px; border-radius: 26px; }
  .rsvp-input::placeholder { color: rgba(29,36,51,.4); }
  .rsvp-input:focus { outline: none; border-color: var(--sky); }
  .rsvp-error { color: #d43d2a; font-weight: 700; text-align: center; }
  .rsvp-submit { min-height: 58px; border: 0; border-radius: 999px; cursor: pointer; background: var(--ink); color: #fff; font-weight: 700; font-size: 1.05rem; box-shadow: 0 14px 30px rgba(29,36,51,.2); transition: transform .3s cubic-bezier(.2,1.4,.4,1); }
  .rsvp-submit:hover { transform: translateY(-2px) scale(1.02); }
  .rsvp-done { margin-top: 20px; text-align: center; }
  .rsvp-done-title { font-family: var(--display); font-weight: 400; font-size: 2.2rem; color: var(--mint); }
  .rsvp-done-body { color: var(--muted); }
  .contact { margin-top: 24px; padding-top: 18px; border-top: 2px dashed rgba(29,36,51,.12); text-align: center; }
  .contact-intro { font-size: .72rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .contact-name { font-weight: 700; font-size: 1.2rem; }
  .contact-phone { color: var(--muted); }
  .contact-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 10px; }
  .contact-link { display: inline-flex; align-items: center; min-height: 42px; padding: 0 16px; border-radius: 999px; background: #fff; color: var(--ink); font-weight: 700; text-decoration: none; box-shadow: 0 6px 16px rgba(29,36,51,.1); }

  footer { text-align: center; padding: 20px var(--pad) calc(env(safe-area-inset-bottom) + 70px); }
  .dots { display: flex; justify-content: center; gap: 8px; margin-bottom: 12px; }
  .dots i { width: 14px; height: 14px; border-radius: 50%; }
  footer p { font-family: var(--display); font-weight: 400; font-size: 1.5rem; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
    .rv, .hero-in > * { opacity: 1; transform: none; transition: none; }
    .bub { opacity: .6; transform: translateY(-60vh); }
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>
<main id="app"></main>

<script src="../../../shared/demo-data.js"></script>
<script src="../../../shared/invitation-core.js"></script>
<script src="../../../shared/invitation-music.js" defer></script>
<script src="../../../shared/rsvp-guest-picker.js" defer></script>
<script>
const DEFAULT_DATA = {
  template: 'bubble-pop',
  title: 'Baby Shower',
  cover: {
    enabled: true, headline: 'Pop! A baby is coming', eventLabel: 'Baby shower', names: 'Name & Name',
    tagline: 'Bubbles, cake and one tiny reason to celebrate.', greeting: 'Hey', hostIntro: '', hostOutro: '', hostText: '',
    image: '', video: '', buttonText: "I'm coming"
  },
  countdown: { enabled: true, label: 'Almost here', date: '', time: '', tzOffset: null, description: '', image: '' },
  families:  { enabled: false, label: 'Hosted by', title: '', items: [] },
  locations: { enabled: true, label: 'Where', title: 'Where the fun is', image: '', items: [
    { label: 'Baby shower', time: '', name: '', addr: '', url: '', img: '' }
  ] },
  timeline:  { enabled: true, label: 'The plan', title: "What's popping", items: [] },
  gallery:   { enabled: false, label: 'Snapshots', title: 'Bump pics', items: [] },
  gifts:     { enabled: false, label: 'Registry', title: 'Little wishes', description: '', image: '', items: [] },
  rsvp: {
    enabled: true, label: 'RSVP', title: 'Are you in?', description: '',
    deadline: '', maxPeople: 4, buttonText: 'Count me in', allowWishes: true, image: '',
    contactName: '', contactPhone: '', contactLink: ''
  },
  memories: { enabled: false, title: '', description: '', url: '', buttonText: '' },
  music:    { enabled: false, url: '', autoplay: true },
  customSections: []
};

const I = Invite, esc = I.esc;
const R = (cls, extra) => `class="${cls ? cls + ' ' : ''}rv"${extra ? ' ' + extra : ''}`;
const COLORS = ['var(--mint)', 'var(--sky)', 'var(--lemon)', 'var(--coral)', 'var(--lilac)'];

/** Twelve bubbles of different sizes, colours, speeds and starting points. */
function bubbles() {
  let s = '';
  for (let i = 0; i < 12; i++) {
    const size = 26 + (i * 37) % 70, left = (i * 83) % 96, dur = 14 + (i * 7) % 12, delay = -((i * 5) % 14), sway = ((i % 2) ? 1 : -1) * (20 + (i * 13) % 50);
    s += `<i class="bub" style="--c:${COLORS[i % COLORS.length]};width:${size}px;height:${size}px;left:${left}%;--dur:${dur}s;--delay:${delay}s;--sway:${sway}px"></i>`;
  }
  return `<div class="bubbles" aria-hidden="true">${s}</div>`;
}
/** Colours each word of a heading in turn. */
const rainbow = s => String(s || '').trim().split(/\s+/).map((w, i) => `<span class="c${(i % 4) + 1}">${esc(w)}</span>`).join(' ');

function hero(data) {
  const c = data.cover || {}, cd = data.countdown || {};
  const dp = I.dateParts(cd);
  const place = ((data.locations || {}).items || []).find(x => x && x.name);
  const guest = I.guestName();
  const photo = I.media(c.image, c.video, c.names, true);
  return `
  <section class="hero">
    ${bubbles()}
    <div class="wrap hero-in">
      <span class="tag"><i></i>${guest ? esc(`${c.greeting || 'Hey'} ${guest}`) : esc(c.eventLabel || 'Baby shower')}</span>
      <h1 class="title" data-fit=".45">${esc(c.headline || 'Pop! A baby is coming')}</h1>
      ${c.tagline ? `<p class="tagline">${esc(c.tagline)}</p>` : ''}
      ${c.names ? `<p class="honour"><small>for</small><b>${esc(c.names)}</b></p>` : ''}
      ${photo ? `<div class="photo-blob">${photo}</div>` : ''}
      <div class="chips">
        ${dp ? `<span>${esc(dp.weekdayShort)} ${dp.d} ${esc(dp.monthShort)}</span>` : ''}
        ${cd.time ? `<span>${esc(I.fmtClock(cd.time))}</span>` : ''}
        ${place ? `<span>${esc(place.name)}</span>` : ''}
      </div>
      <a class="cta" href="#rsvp">${esc(c.buttonText || "I'm coming")} <span aria-hidden="true">→</span></a>
    </div>
  </section>`;
}

function countdown(data) {
  const cd = data.countdown || {};
  if (cd.enabled === false) return '';
  const target = I.eventInstant(cd);
  const dp = I.dateParts(cd);
  return `
  <section class="sec">
    <div class="wrap">
      <span ${R('tag')}><i></i>${esc(cd.label || 'Almost here')}</span>
      <h2 ${R('h2')} data-fit>${dp ? rainbow(`${dp.weekday} ${dp.d} ${dp.month}`) : rainbow('Date coming soon')}</h2>
      ${target !== null ? `<div ${R('cd')} data-countdown="${target}" data-past-today="It's today! Pop!" data-past-after="Thank you for popping by">${I.countdownCells({ m: 'Mins', s: 'Secs' })}</div>` : ''}
      ${cd.time || cd.description ? `<p ${R('lead')} style="margin-top:20px">${[cd.time ? 'From ' + esc(I.fmtClock(cd.time)) : '', esc(cd.description || '')].filter(Boolean).join(' · ')}</p>` : ''}
    </div>
  </section>`;
}

function where(data) {
  const l = data.locations || {};
  const items = (l.items || []).filter(x => x && (x.name || x.addr || x.label));
  if (l.enabled === false || !items.length) return '';
  return `
  <section class="sec" style="padding-top:0">
    <div class="wrap">
      <span ${R('tag')}><i style="background:var(--sky)"></i>${esc(l.label || 'Where')}</span>
      <h2 ${R('h2')} data-fit>${rainbow(l.title || 'Where the fun is')}</h2>
      <div class="cards">
        ${items.map((x, i) => `
          <article ${R('blob-card')} style="--c:${COLORS[(i + 1) % COLORS.length]}">
            ${x.img ? `<figure>${I.img(x.img, x.name)}</figure>` : ''}
            ${x.label ? `<p class="tag" style="background:#fff">${esc(x.label)}</p>` : ''}
            ${x.name ? `<h3>${esc(x.name)}</h3>` : ''}
            ${x.addr ? `<p>${I.nl2br(x.addr)}</p>` : ''}
            ${x.time ? `<p class="time">${esc(x.time)}</p>` : ''}
            ${x.url ? `<a class="pill" href="${esc(I.mapHref(x.url))}" target="_blank" rel="noopener">Directions ↗</a>` : ''}
          </article>`).join('')}
      </div>
    </div>
  </section>`;
}

function plan(data) {
  const t = data.timeline || {};
  const items = (t.items || []).filter(x => x && (x.time || x.title));
  if (t.enabled === false || !items.length) return '';
  return `
  <section class="sec" style="padding-top:0">
    <div class="wrap">
      <span ${R('tag')}><i style="background:var(--coral)"></i>${esc(t.label || 'The plan')}</span>
      <h2 ${R('h2')} data-fit>${rainbow(t.title || "What's popping")}</h2>
      <ol class="string">
        ${items.map(x => `
          <li ${R()}>
            ${x.time ? `<p class="t">${esc(x.time)}</p>` : ''}
            <h3>${I.stepIcon(x) ? `<span class="ic" aria-hidden="true">${esc(I.stepIcon(x))}</span>` : ''}${esc(x.title || '')}</h3>
            ${x.subtitle ? `<p>${esc(x.subtitle)}</p>` : ''}
            ${x.url ? `<p><a href="${esc(I.mapHref(x.url))}" target="_blank" rel="noopener">Map ↗</a></p>` : ''}
          </li>`).join('')}
      </ol>
    </div>
  </section>`;
}

function notes(data) {
  const c = data.cover || {}, f = data.families || {}, g = data.gifts || {}, gl = data.gallery || {};
  const fams = (f.enabled !== false ? (f.items || []) : []).filter(x => x && (x.names || x.label));
  const cards = [];
  if (c.hostText || fams.length || c.hostOutro) cards.push(`
    <div ${R('blob-card')}>
      <p class="tag" style="background:#fff">${esc(f.label || 'Hosted by')}</p>
      ${c.hostText ? `<h3>${I.nl2br(c.hostText)}</h3>` : ''}
      ${fams.map(x => `<p>${x.label ? esc(x.label) + ' · ' : ''}<b>${esc(x.names || '')}</b></p>`).join('')}
      ${c.hostOutro ? `<p>${I.nl2br(c.hostOutro)}</p>` : ''}
    </div>`);
  (data.customSections || []).filter(s => s && s.enabled !== false && (s.title || s.body)).forEach(s => cards.push(`
    <div ${R('blob-card')}>
      ${s.label ? `<p class="tag" style="background:#fff">${esc(s.label)}</p>` : ''}
      ${s.title ? `<h3>${esc(s.title)}</h3>` : ''}
      ${s.image ? `<figure>${I.img(s.image, s.title)}</figure>` : ''}
      ${s.body ? `<p>${I.nl2br(s.body)}</p>` : ''}
    </div>`));
  const accounts = (g.items || []).filter(x => x && x.account);
  if (g.enabled !== false && (accounts.length || g.description)) cards.push(`
    <div ${R('blob-card')}>
      <p class="tag" style="background:#fff">${esc(g.label || 'Registry')}</p>
      <h3>${esc(g.title || 'Little wishes')}</h3>
      ${g.description ? `<p>${I.nl2br(g.description)}</p>` : ''}
      ${accounts.map(x => `<div class="acct"><span><b>${esc(x.bank || 'Account')}</b> · ${esc(x.account)}</span><button type="button" class="copy" data-copy="${esc(x.account)}">Copy</button></div>`).join('')}
    </div>`);
  const photos = (gl.enabled !== false ? (gl.items || []) : []).filter(x => x && x.url).slice(0, 6);
  if (!cards.length && !photos.length) return '';
  return `
  <section class="sec" style="padding-top:0">
    <div class="wrap">
      ${cards.length ? `<div class="notes">${cards.join('')}</div>` : ''}
      ${photos.length ? `
        <div style="margin-top:${cards.length ? 60 : 0}px"><span ${R('tag')}><i style="background:var(--lilac)"></i>${esc(gl.label || 'Snapshots')}</span>
        ${gl.title ? `<h2 ${R('h2')} data-fit>${rainbow(gl.title)}</h2>` : ''}</div>
        <div class="pops">${photos.map(x => `<figure ${R()}>${I.img(x.url, x.caption || 'Photo')}</figure>`).join('')}</div>` : ''}
    </div>
  </section>`;
}

function rsvp(data) {
  const r = data.rsvp || {};
  if (r.enabled === false) return '';
  return `
  <section class="sec" id="rsvp" style="padding-top:0">
    <div class="wrap">
      <span ${R('tag')}><i></i>${esc(r.label || 'RSVP')}</span>
      <div ${R('reply')}>
        <span class="bub-mini" aria-hidden="true"></span>
        <h2>${esc(r.title || 'Are you in?')}</h2>
        ${r.description ? `<p class="desc">${I.nl2br(r.description)}</p>` : ''}
        ${I.rsvpNotes(r).map(n => `<p class="notes-line">${esc(n)}</p>`).join('')}
        ${I.rsvpForm(r, {
          yes: "Yes, I'm in!", no: "Can't make it",
          nameLabel: 'Your name', namePlaceholder: 'First and last name',
          countLabel: 'How many of you', wishesLabel: 'A wish for the baby (optional)',
          wishesPlaceholder: 'Welcome to the world…', button: r.buttonText || 'Count me in',
          doneTitle: 'Pop! Thank you'
        })}
        ${I.contactHtml(r, { intro: 'Questions? Ask' })}
      </div>
    </div>
  </section>`;
}

function build(data) {
  const c = data.cover || {};
  document.title = (c.headline || 'Baby Shower') + ' — Invitation';
  document.getElementById('app').innerHTML = [
    c.enabled !== false ? hero(data) : '',
    countdown(data), where(data), plan(data), notes(data), rsvp(data),
    `<footer><div class="dots" aria-hidden="true">${COLORS.map(col => `<i style="background:${col}"></i>`).join('')}</div><p>See you soon${c.names ? ' — ' + esc(c.names) : ''}</p></footer>`
  ].join('');
}

Invite.boot(build, DEFAULT_DATA);
</script>
</body>
</html>
