<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Guests reach this by scanning a QR code, so it is phone-first and must work one-handed. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Find your table</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<script src="./shared/config.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --gold: #c9a96e; --gold-light: #e8d5b0;
    --bg: #0e0c0b; --panel: #181513; --panel-2: #221d19;
    --border: rgba(201,169,110,.18);
    --text: rgba(255,255,255,.88); --muted: rgba(255,255,255,.5);
    --danger: #d96666;
  }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Jost', system-ui, sans-serif;
    min-height: 100vh; display: flex; justify-content: center;
    padding: 2rem 1.1rem 4rem;
  }
  .wrap { width: 100%; max-width: 460px; }

  header { text-align: center; margin-bottom: 2rem; }
  .eyebrow { font-size: .62rem; text-transform: uppercase; letter-spacing: 3px; color: var(--gold); }
  h1 { font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: 1.9rem;
       color: var(--gold-light); margin: .5rem 0 .2rem; line-height: 1.15; }
  .when { font-size: .78rem; color: var(--muted); }

  label.search-label { display: block; font-size: .62rem; text-transform: uppercase;
                       letter-spacing: 2px; color: var(--muted); margin-bottom: .5rem; }
  /* 16px minimum, or iOS Safari zooms the whole page on focus. */
  #q { width: 100%; font-size: 16px; font-family: inherit; color: var(--text);
       background: var(--panel-2); border: 1px solid var(--border);
       border-radius: 6px; padding: .85rem 1rem; }
  #q:focus { outline: none; border-color: var(--gold); }
  .hint { font-size: .72rem; color: var(--muted); margin-top: .5rem; min-height: 1.1em; }

  .results { margin-top: 1.4rem; list-style: none; }
  .results li { margin-bottom: .5rem; }
  .result-btn { width: 100%; text-align: left; display: flex; justify-content: space-between;
                align-items: center; gap: 1rem; cursor: pointer; font-family: inherit;
                background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
                border-radius: 6px; padding: .8rem 1rem; font-size: .9rem; }
  .result-btn:hover, .result-btn:focus-visible { border-color: var(--gold); outline: none; }
  .result-tbl { font-size: .72rem; color: var(--gold); white-space: nowrap; }
  .result-tbl.none { color: var(--muted); }

  /* Result card */
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
          padding: 1.8rem 1.4rem; text-align: center; margin-top: 1.4rem; }
  .card .who { font-size: .8rem; color: var(--muted); }
  .card .num { font-family: 'Cormorant Garamond', serif; font-weight: 300;
               font-size: 4.4rem; line-height: 1; color: var(--gold-light); margin: .3rem 0 .1rem; }
  .card .num-lbl { font-size: .62rem; text-transform: uppercase; letter-spacing: 3px; color: var(--gold); }
  .card .unseated { font-size: .92rem; color: var(--muted); padding: 1rem 0; }

  .mates { margin-top: 1.6rem; border-top: 1px solid var(--border); padding-top: 1.1rem; text-align: left; }
  .mates h2 { font-size: .62rem; text-transform: uppercase; letter-spacing: 2px;
              color: var(--muted); font-weight: 500; margin-bottom: .6rem; }
  .mates ul { list-style: none; }
  .mates li { font-size: .88rem; padding: .22rem 0; }
  .mates li.self { color: var(--gold-light); }

  .back { display: inline-block; margin-top: 1.4rem; background: none; border: none;
          color: var(--gold); font-family: inherit; font-size: .78rem; cursor: pointer;
          text-decoration: underline; text-underline-offset: 3px; }

  .msg { text-align: center; padding: 2.5rem 1rem; color: var(--muted); font-size: .88rem; }
  .msg.error { color: var(--danger); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">Seating</div>
    <h1 id="title">Find your table</h1>
    <div class="when" id="when"></div>
  </header>

  <div id="fatal" class="msg error" hidden></div>

  <div id="searchPane" hidden>
    <label class="search-label" for="q">Your name</label>
    <input id="q" type="search" autocomplete="off" autocapitalize="words"
           enterkeyhint="search" placeholder="Start typing your name…">
    <div class="hint" id="hint">Type at least 2 letters.</div>
    <ul class="results" id="results"></ul>
  </div>

  <div id="resultPane" hidden></div>

</div>

<script>
'use strict';

const API_BASE = (window.API_BASE || '').replace(/\/$/, '');

// The token is the whole credential, so it is read from the path the QR encodes
// (/seating/<token>) and never written into the page as HTML.
const TOKEN = (function () {
  const m = window.location.pathname.match(/\/seating\/([^/?#]+)/);
  if (m) return decodeURIComponent(m[1]);
  return new URLSearchParams(window.location.search).get('t') || '';
})();

const el = id => document.getElementById(id);

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function fatal(msg) {
  el('searchPane').hidden = true;
  el('resultPane').hidden = true;
  el('fatal').textContent = msg;
  el('fatal').hidden = false;
}

async function get(path) {
  const res = await fetch(API_BASE + '/api/public/seating/' + encodeURIComponent(TOKEN) + path, {
    headers: { Accept: 'application/json' }
  });
  if (res.status === 429) throw new Error('Too many lookups. Please wait a minute and try again.');
  const body = await res.json().catch(() => null);
  if (!res.ok) throw new Error((body && body.error) || 'Something went wrong.');
  return body;
}

// ── Boot ────────────────────────────────────────────────────────────────────
(async function init() {
  if (!TOKEN) return fatal('This seating link is not valid.');
  try {
    const info = await get('');
    if (info.title) {
      el('title').textContent = info.title;
      document.title = info.title + ' — Find your table';
    }
    if (info.eventDate) {
      el('when').textContent = new Date(info.eventDate).toLocaleDateString(undefined, {
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
      });
    }
    el('searchPane').hidden = false;
    el('q').focus();
  } catch (e) {
    fatal(e.message);
  }
})();

// ── Search ──────────────────────────────────────────────────────────────────
let searchSeq = 0;      // guards against an earlier response landing after a later one
let debounce = null;

el('q').addEventListener('input', () => {
  clearTimeout(debounce);
  const raw = el('q').value.trim();

  // Mirrors the server's minimum. Saying so up front is friendlier than an empty result list.
  if (raw.length < 2) {
    el('results').innerHTML = '';
    el('hint').textContent = 'Type at least 2 letters.';
    return;
  }
  el('hint').textContent = 'Searching…';
  debounce = setTimeout(() => runSearch(raw), 220);
});

async function runSearch(query) {
  const mySeq = ++searchSeq;
  let data;
  try {
    data = await get('/search?q=' + encodeURIComponent(query));
  } catch (e) {
    if (mySeq !== searchSeq) return;
    el('results').innerHTML = '';
    el('hint').textContent = e.message;
    return;
  }
  if (mySeq !== searchSeq) return;   // a newer keystroke already won

  const results = data.results || [];
  if (!results.length) {
    el('results').innerHTML = '';
    el('hint').textContent = 'No match. Check the spelling, or ask one of the hosts.';
    return;
  }

  el('hint').textContent = data.truncated
    ? 'Showing the first matches — keep typing to narrow it down.'
    : (results.length === 1 ? '1 match' : results.length + ' matches');

  el('results').innerHTML = results.map((r, i) => {
    const tbl = r.tableNumber == null
      ? '<span class="result-tbl none">No table yet</span>'
      : '<span class="result-tbl">Table ' + r.tableNumber + '</span>';
    // Index into the array rather than interpolating the name into an attribute — avoids any
    // quoting question entirely.
    return '<li><button type="button" class="result-btn" data-i="' + i + '">'
      + '<span>' + esc(r.name) + '</span>' + tbl + '</button></li>';
  }).join('');

  el('results').dataset.payload = JSON.stringify(results);
}

el('results').addEventListener('click', async ev => {
  const btn = ev.target.closest('.result-btn');
  if (!btn) return;
  const results = JSON.parse(el('results').dataset.payload || '[]');
  const pick = results[Number(btn.dataset.i)];
  if (pick) showResult(pick);
});

// ── Result ──────────────────────────────────────────────────────────────────
async function showResult(pick) {
  el('searchPane').hidden = true;
  const pane = el('resultPane');
  pane.hidden = false;

  if (pick.tableNumber == null) {
    pane.innerHTML = '<div class="card">'
      + '<div class="who">' + esc(pick.name) + '</div>'
      + '<p class="unseated">Your table has not been assigned yet.<br>Please ask one of the hosts.</p>'
      + '</div>'
      + '<button class="back" type="button" id="backBtn">Search for another name</button>';
    wireBack();
    return;
  }

  pane.innerHTML = '<div class="card">'
    + '<div class="who">' + esc(pick.name) + '</div>'
    + '<div class="num">' + Number(pick.tableNumber) + '</div>'
    + '<div class="num-lbl">Table</div>'
    + '<div class="mates" id="mates"><h2>Loading your table…</h2></div>'
    + '</div>'
    + '<button class="back" type="button" id="backBtn">Search for another name</button>';
  wireBack();

  try {
    const t = await get('/table/' + Number(pick.tableNumber));
    const names = t.names || [];
    el('mates').innerHTML = '<h2>At your table</h2><ul>'
      + names.map(n => '<li' + (n === pick.name ? ' class="self"' : '') + '>' + esc(n) + '</li>').join('')
      + '</ul>';
  } catch (e) {
    el('mates').innerHTML = '<h2>At your table</h2><p style="font-size:.82rem;color:var(--muted)">'
      + esc(e.message) + '</p>';
  }
}

function wireBack() {
  el('backBtn').addEventListener('click', () => {
    el('resultPane').hidden = true;
    el('resultPane').innerHTML = '';
    el('searchPane').hidden = false;
    el('q').select();
    el('q').focus();
  });
}
</script>
</body>
</html>
