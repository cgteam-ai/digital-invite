# Deploy the application to the server — beta first, production second.
#
# The intended sequence is:
#
#   deploy beta (release branch)  →  test on beta.digital-invite.net
#     →  merge release into main  →  deploy production (main branch)
#
# Triggered by hand from the Actions tab — there is deliberately no push trigger. A deployment
# runs migrations against a live database and this project has no down-migration path, so every
# deploy should be a decision someone made, not a side effect of merging.
#
# Both targets live on the SAME server and are kept apart by everything that can be:
#
#                      production              beta
#   working copy       ~/app                   ~/beta
#   compose file       docker-compose.prod.yml docker-compose.beta.yml
#   branch             main                    release
#   containers         invitation-prod-*       invitation-beta-*
#   database           its own volume          its own volume
#   images             :latest                 :release
#
# Only one thing is shared: production's Caddy owns ports 80/443, so it serves both hostnames
# and reaches the beta web container over the external "invitation-edge" network. Beta's api and
# db are NOT on that network, so a beta build cannot reach the production database.
#
# The server does NOT compile anything. Images are built by build-images.yml and published to
# GHCR; this workflow tells the server to pull them and restart. That is a hosting-cost
# decision: compiling on the server needs ~2 GB of RAM and ~3.5 GB of disk for the SDK and
# build cache, while the running application needs ~190 MB. Pulling finished images is what
# makes a small instance sufficient.
#
# Deploys are also seconds rather than minutes, and the bytes that ran in CI are the bytes
# that run on the server.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#
#   DEPLOY_HOST         the server's IP or hostname
#   DEPLOY_USER         the SSH user (e.g. ubuntu)
#   DEPLOY_SSH_KEY      private half of a key whose public half is in the server's
#                       ~/.ssh/authorized_keys. Generate a DEDICATED key for this — never
#                       reuse your personal one, since anyone able to edit this workflow
#                       could otherwise use it.
#   DEPLOY_KNOWN_HOSTS  output of: ssh-keyscan <host>
#                       Pinning it means a machine-in-the-middle cannot impersonate the
#                       server. Trusting whatever answers would defeat the SSH key entirely.

name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Where to deploy"
        type: choice
        required: true
        default: beta
        options:
          - beta
          - production
      ref:
        description: "Branch, tag or commit — leave blank for the target's default (beta→release, production→main)"
        required: false
        default: ""
      backup_first:
        description: "Back up the database before deploying"
        type: boolean
        default: true

# Keyed by target, so a beta deploy and a production deploy never queue behind one another —
# but two deploys to the SAME target still cannot overlap, which is what would rebuild
# containers underneath each other.
concurrency:
  group: deploy-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The GitHub Environment is named after the target, so "production" can carry required
    # reviewers while "beta" deploys without ceremony. Configure under Settings → Environments.
    environment: ${{ inputs.target }}

    steps:
      - name: Set up SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Resolve target
        id: t
        env:
          TARGET: ${{ inputs.target }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            production)
              echo "dir=app"                        >> "$GITHUB_OUTPUT"
              echo "compose=docker-compose.prod.yml" >> "$GITHUB_OUTPUT"
              echo "api_container=invitation-prod-api" >> "$GITHUB_OUTPUT"
              echo "default_ref=main"               >> "$GITHUB_OUTPUT"
              echo "url=https://digital-invite.net/" >> "$GITHUB_OUTPUT"
              # Only production runs Caddy, so only production has a config to reload.
              echo "reload_caddy=true"              >> "$GITHUB_OUTPUT"
              ;;
            beta)
              echo "dir=beta"                        >> "$GITHUB_OUTPUT"
              echo "compose=docker-compose.beta.yml" >> "$GITHUB_OUTPUT"
              echo "api_container=invitation-beta-api" >> "$GITHUB_OUTPUT"
              echo "default_ref=release"             >> "$GITHUB_OUTPUT"
              echo "url=https://beta.digital-invite.net/" >> "$GITHUB_OUTPUT"
              echo "reload_caddy=false"              >> "$GITHUB_OUTPUT"
              ;;
            *) echo "Unknown target: $TARGET" >&2; exit 1 ;;
          esac
          REF="${INPUT_REF:-}"
          if [ -z "$REF" ]; then
            case "$TARGET" in
              production) REF=main ;;
              beta)       REF=release ;;
            esac
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Deploying '$REF' to $TARGET"

      # Pin the deploy to the EXACT commit, not to a moving tag.
      #
      # ":latest" and ":release" are branch pointers: they say which branch an image came from,
      # never which commit. Deploy by one of those and the running image is whatever was last
      # built from that branch — which silently differs from the code just checked out if the
      # build was skipped, run from another branch, or is still in flight. The failure is
      # invisible: healthy containers serving the wrong bytes.
      #
      # build-images.yml also tags every build "sha-<40 hex>" (type=sha,format=long), so
      # resolving the ref to its commit here gives an immutable, unambiguous image reference.
      - name: Resolve commit
        id: c
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.t.outputs.ref }}
          fetch-depth: 1

      - name: Image tag
        id: img
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA"        >> "$GITHUB_OUTPUT"
          echo "tag=sha-$SHA"    >> "$GITHUB_OUTPUT"
          echo "Deploying commit $SHA as image tag sha-$SHA"

      - name: Deploy
        env:
          DEPLOY_REF: ${{ steps.t.outputs.ref }}
          BACKUP_FIRST: ${{ inputs.backup_first }}
          DEPLOY_DIR: ${{ steps.t.outputs.dir }}
          COMPOSE_FILE: ${{ steps.t.outputs.compose }}
          API_CONTAINER: ${{ steps.t.outputs.api_container }}
          RELOAD_CADDY: ${{ steps.t.outputs.reload_caddy }}
          TARGET: ${{ inputs.target }}
          IMAGE_TAG: ${{ steps.img.outputs.tag }}
          COMMIT_SHA: ${{ steps.img.outputs.sha }}
        run: |
          set -euo pipefail

          # The ref reaches the remote inside a quoted string, so reject anything that is not a
          # plain git ref before it can be read as shell.
          case "$DEPLOY_REF" in
            ''|*[!A-Za-z0-9._/-]*)
              echo "Refusing unsafe ref: $DEPLOY_REF" >&2; exit 1 ;;
          esac

          ssh -o StrictHostKeyChecking=yes \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              "DEPLOY_REF='$DEPLOY_REF' BACKUP_FIRST='$BACKUP_FIRST' DEPLOY_DIR='$DEPLOY_DIR' COMPOSE_FILE='$COMPOSE_FILE' API_CONTAINER='$API_CONTAINER' RELOAD_CADDY='$RELOAD_CADDY' TARGET='$TARGET' IMAGE_TAG='$IMAGE_TAG' COMMIT_SHA='$COMMIT_SHA' bash -s" <<'REMOTE'
          set -euo pipefail

          # Fail early and clearly rather than deploying into a half-prepared directory.
          if [ ! -d "$HOME/${DEPLOY_DIR}" ]; then
            echo "!! $HOME/${DEPLOY_DIR} does not exist." >&2
            echo "!! See backend/docs/DEPLOY.md — the ${TARGET} working copy is cloned there once, by hand." >&2
            exit 1
          fi
          cd "$HOME/${DEPLOY_DIR}"

          # ── Pin the images to the exact commit ────────────────────────────
          # Exported, so they override whatever API_IMAGE/WEB_IMAGE the .env pins. The .env
          # values stay as a sensible default for a hand-run "compose up" on the server; an
          # automated deploy always runs the commit it was asked for.
          export API_IMAGE="ghcr.io/cgteam-ai/digital-invite-api:${IMAGE_TAG}"
          export WEB_IMAGE="ghcr.io/cgteam-ai/digital-invite-web:${IMAGE_TAG}"
          echo "-> ${TARGET}: commit ${COMMIT_SHA}"
          echo "   api: ${API_IMAGE}"
          echo "   web: ${WEB_IMAGE}"

          COMPOSE="docker compose -f ${COMPOSE_FILE}"

          # ── Verify the images exist BEFORE touching anything ──────────────
          # Pulling first means a missing build fails here, with nothing changed: no backup
          # taken, no checkout, no containers recreated. The common cause is deploying a
          # commit whose "Build images" run was never started, or is still running.
          echo "-> pulling images for ${COMMIT_SHA}"
          for IMG in "$API_IMAGE" "$WEB_IMAGE"; do
            if ! docker pull --quiet "$IMG" >/dev/null 2>&1; then
              echo "!! Image not found: $IMG" >&2
              echo "!! Run 'Build images' from this commit's branch and wait for it to finish," >&2
              echo "!! then deploy again. Nothing on the server has been changed." >&2
              exit 1
            fi
          done
          echo "-> images present"

          # ── Back up before anything can change the schema ──────────────────
          # Migrations run on boot and cannot be rolled back, so the backup must exist before
          # the new containers start, not after.
          if [ "${BACKUP_FIRST}" = "true" ]; then
            mkdir -p ~/backups
            STAMP=$(date +%F-%H%M%S)
            echo "-> backing up to ~/backups/pre-deploy-${STAMP}.sql.gz"
            # POSTGRES_USER and POSTGRES_DB are already set inside the db container by compose,
            # so read them there rather than guessing them out here.
            #
            # "< /dev/null" is what keeps the REST of this script alive. The script arrives on the
            # server as the stdin of "bash -s", and "compose exec -T" reads stdin too — without the
            # redirect it swallows every line below, bash reaches EOF and exits 0 right after the
            # backup, and the deploy reports success having pulled nothing. Any command added here
            # that reads stdin needs the same redirect.
            $COMPOSE exec -T db sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB"' < /dev/null \
              | gzip > ~/backups/"pre-deploy-${STAMP}.sql.gz"
            # Keep the newest 10 so a small boot volume cannot fill up silently.
            ls -1t ~/backups/pre-deploy-*.sql.gz 2>/dev/null | tail -n +11 | xargs -r rm --
          fi

          # ── Fetch the requested revision ───────────────────────────────────
          echo "-> deploying ${DEPLOY_REF}"
          git fetch --all --prune --tags
          git checkout --force "${DEPLOY_REF}"
          # Fast-forward only when a branch is checked out. A tag or SHA leaves HEAD detached,
          # where there is nothing to pull — and an "&&" here would abort the script.
          if git symbolic-ref -q HEAD >/dev/null; then
            git pull --ff-only
          fi
          echo "-> now at $(git rev-parse --short HEAD): $(git log -1 --pretty=%s)"

          # ── Restart onto the pinned images ────────────────────────────────
          # No "pull" here: the sha-pinned images were already fetched and verified above,
          # before the backup, so by this point they are local. No --build either — the server
          # never compiles.
          $COMPOSE up -d --remove-orphans

          # ── Reload Caddy's configuration ──────────────────────────────────
          # The Caddyfile is BIND-MOUNTED (see docker-compose.prod.yml), not baked into an
          # image, and Caddy parses it once at startup and keeps the result in memory. Compose
          # decides whether to recreate a container from the service definition and the image
          # id — the CONTENTS of a mounted file are not part of that decision — so the git
          # checkout above writes the new Caddyfile to disk and "up -d" leaves caddy serving
          # the config it read at its last start. Without this step, a change to a security
          # header, a redirect or the TLS host list lands on the server and is silently never
          # applied: no error, no warning, a perfectly healthy container.
          #
          # "reload" swaps the config in place with no dropped connections, unlike "restart".
          # A malformed Caddyfile fails the reload and the OLD config keeps serving, so a typo
          # cannot take the site down — but the deploy must not then claim success, hence the
          # explicit failure below.
          #
          # "< /dev/null" is the same stdin guard the backup step documents: this script is the
          # stdin of "bash -s", and "compose exec -T" would otherwise swallow the lines after it.
          # Beta has no Caddy of its own — production's serves both hostnames — so there is
          # nothing to reload when deploying beta.
          if [ "${RELOAD_CADDY}" = "true" ]; then
            echo "-> reloading caddy configuration"
            if $COMPOSE exec -T caddy caddy reload --config /etc/caddy/Caddyfile < /dev/null; then
              echo "-> caddy reloaded"
            else
              echo "!! caddy reload FAILED — it is still serving the PREVIOUS configuration." >&2
              echo "!! The site is up, but your Caddyfile change has NOT been applied." >&2
              exit 1
            fi
          else
            echo "-> skipping caddy reload (beta is served by production's Caddy)"
          fi

          # ── Wait for the API to report healthy ────────────────────────────
          # Migrations and seeding run before it listens, so this is the real readiness signal.
          echo "-> waiting for the api container to become healthy"
          for i in $(seq 1 40); do
            STATE=$(docker inspect -f '{{.State.Health.Status}}' "${API_CONTAINER}" 2>/dev/null || echo missing)
            if [ "$STATE" = "healthy" ]; then
              echo "-> healthy after $((i * 5))s"
              break
            fi
            if [ "$i" -eq 40 ]; then
              echo "!! ${API_CONTAINER} never became healthy (last state: ${STATE}). Recent logs:"
              $COMPOSE logs --tail 40 api
              exit 1
            fi
            sleep 5
          done

          $COMPOSE ps
          docker image prune -f >/dev/null 2>&1 || true
          REMOTE
      - name: Smoke-test the public site
        env:
          URL: ${{ steps.t.outputs.url }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$URL" || echo 000)
          echo "$URL -> ${CODE}"
          # The deploy already passed its own health gate, so a non-200 here is reported rather
          # than failed: it is expected while a site is still on a bare IP, or before the beta
          # DNS record has propagated.
          if [ "${CODE}" != "200" ]; then
            echo "::warning::${TARGET} returned ${CODE} at ${URL}. Expected before DNS points there, or while still on the bare IP."
          fi
